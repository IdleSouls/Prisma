<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Prisma - Attivazione</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#0f1722;color:#e8edf4;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{width:min(560px,92vw);background:#18222f;border:1px solid #2a3a4e;border-radius:14px;padding:34px 36px;box-shadow:0 10px 40px #0006}
h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
.sub{color:#8fa3b8;margin:0 0 26px;font-size:14px}
.passo{display:flex;gap:14px;margin:0 0 20px}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:#2b6cdf;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:14px}
.passo p{margin:2px 0 0;font-size:14px;line-height:1.45;color:#c6d2df}
.codice{display:flex;gap:8px;margin-top:10px}
.codice code{flex:1;background:#0f1722;border:1px solid #2a3a4e;border-radius:8px;padding:11px 12px;font-size:15px;letter-spacing:1px;user-select:all;font-family:Consolas,monospace;color:#fff}
button{background:#2b6cdf;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit}
button:hover{background:#3a7bef}
button.sec{background:#2a3a4e}
button.sec:hover{background:#34485f}
.drop{margin-top:10px;border:2px dashed #34485f;border-radius:10px;padding:20px;text-align:center;color:#8fa3b8;font-size:14px;transition:.15s}
.drop.on{border-color:#2b6cdf;background:#2b6cdf15;color:#fff}
.msg{margin-top:16px;font-size:14px;min-height:20px}
.err{color:#ff8a8a}.ok{color:#6fdc9a}
.motivo{background:#2a2216;border:1px solid #5a4620;color:#f0cf8a;border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 22px}
</style></head><body>
<div class="card">
  <h1>Prisma</h1>
  <p class="sub">Attiva Prisma su questo computer per iniziare.</p>
  <div class="motivo" id="motivo" style="display:none"></div>
  <div class="passo"><div class="n">1</div><div style="flex:1"><p>Invia questo <b>codice macchina</b> a chi ti ha fornito Prisma:</p>
    <div class="codice"><code id="codice">…</code><button class="sec" id="btnCopia">Copia</button></div></div></div>
  <div class="passo"><div class="n">2</div><div style="flex:1"><p>Riceverai un file chiamato <b>license.json</b>. Caricalo qui:</p>
    <div class="drop" id="drop">Trascina qui il file <b>license.json</b><br>oppure <button id="btnScegli" style="margin-top:10px">Scegli il file…</button></div></div></div>
  <div class="msg" id="msg"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let codice='';
function msg(t,cls){const m=$('msg');m.textContent=t;m.className='msg '+(cls||'')}
async function invia(testo){
  msg('Verifico la licenza…');
  const r=await window.prismaAttivazione.invia(testo);
  if(r.ok){msg('Attivato per "'+r.studio+'". Avvio Prisma…','ok')}
  else msg(r.errore,'err');
}
(async()=>{
  const s=await window.prismaAttivazione.stato();
  codice=s.fingerprint||'';$('codice').textContent=codice||'non disponibile';
  if(s.motivo){$('motivo').textContent=s.motivo;$('motivo').style.display='block'}
})();
$('btnCopia').onclick=async()=>{await window.prismaAttivazione.copia(codice);msg('Codice copiato negli appunti.','ok')};
$('btnScegli').onclick=async()=>{const r=await window.prismaAttivazione.scegliFile();if(r&&r.annullato)return;if(r)msg(r.ok?'Attivato per "'+r.studio+'". Avvio Prisma…':r.errore,r.ok?'ok':'err')};
const d=$('drop');
['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('on')}));
['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('on')}));
d.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>invia(String(rd.result));rd.readAsText(f)});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
</script></body></html>
