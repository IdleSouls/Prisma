      const c = STATE.credenziali.find(x => x.id === id);
      if (c && c.username) copiaTestoNegliAppunti(c.username, 'Nome utente copiato negli appunti.');
      break;
    }

    case 'ripristina-backup-server': ripristinaBackupServer(el.dataset.file); break;
    case 'esporta-mcp': esportaMCP(); break;
    case 'verifica-aggiornamenti': verificaAggiornamenti(); break;
    case 'applica-aggiornamento': applicaAggiornamentoConferma(); break;
    case 'carica-demo':
      if (confermaAzione('Aggiunge clienti ed esempi di prova ai dati attuali. Continuare?')) {
        const demo = generaDatiEsempio();
        STATE.clienti = STATE.clienti.concat(demo.clienti);
        STATE.ritenuteRighe = STATE.ritenuteRighe.concat(demo.ritenuteRighe);
        Object.assign(STATE.onboarding, demo.onboarding);
        Object.assign(STATE.antiriciclaggio, demo.antiriciclaggio || {});
        Object.assign(STATE.scadenzeOverrides, demo.scadenzeOverrides);
        Object.assign(STATE.annualiOverrides, demo.annualiOverrides || {});
        STATE.comunicazioni = STATE.comunicazioni.concat(demo.comunicazioni || []);
        STATE.comunicazioniRicorrenti = (STATE.comunicazioniRicorrenti || []).concat(demo.comunicazioniRicorrenti || []);
        STATE.documenti = STATE.documenti.concat(demo.documenti || []);
        STATE.taskTeam = (STATE.taskTeam || []).concat(demo.taskTeam || []);
        STATE.preventivi = (STATE.preventivi || []).concat(demo.preventivi || []);
        Object.assign(STATE.bilanci, demo.bilanci || {});
        if (!STATE.contoMappings) STATE.contoMappings = {};
        if (!STATE.movimentiContabili) STATE.movimentiContabili = {};
        if (!STATE.fattureContabili) STATE.fattureContabili = {};
        Object.assign(STATE.contoMappings, demo.contoMappings || {});
        Object.assign(STATE.movimentiContabili, demo.movimentiContabili || {});
        Object.assign(STATE.fattureContabili, demo.fattureContabili || {});
        if (!STATE.documentiContabili) STATE.documentiContabili = {};
        Object.assign(STATE.documentiContabili, demo.documentiContabili || {});
        if (!STATE.contiCliente) STATE.contiCliente = {};
        Object.assign(STATE.contiCliente, demo.contiCliente || {});
        STATE.annoCorrente = demo.annoCorrente;
        salvaStato(); render(); toast('Dati di esempio caricati.');
      }
      break;
    case 'reset-tutto':
      if (confermaAzione('Cancella TUTTI i dati salvati in questo browser. Operazione irreversibile. Continuare?')) {
        STATE = statoIniziale();
        salvaStato(); render(); toast('Tutti i dati sono stati azzerati.');
      }
      break;

    /* -------- catalogo scadenze periodiche -------- */
    case 'cat-per-expand':
      if (CAT_PER_EXPANDED.has(el.dataset.tipo)) CAT_PER_EXPANDED.delete(el.dataset.tipo); else CAT_PER_EXPANDED.add(el.dataset.tipo);
      render();
      break;
    case 'cat-per-aggiungi-occ':
      aggiungiOccorrenzaPeriodica(el.dataset.tipo);
      CAT_PER_EXPANDED.add(el.dataset.tipo);
      render();
      break;
    case 'cat-per-rimuovi-occ':
      rimuoviOccorrenzaPeriodica(el.dataset.tipo, Number(el.dataset.idx));
      CAT_PER_EXPANDED.add(el.dataset.tipo);
      render();
      break;
    case 'cat-per-elimina-tipo':
      if (confermaAzione('Eliminare definitivamente questo tipo di scadenza personalizzata?')) {
        rimuoviTipoPeriodicoCustom(el.dataset.tipo); render(); toast('Tipo eliminato.');
      }
      break;
    case 'cat-per-nuovo-tipo':
      aggiungiTipoPeriodicoCustom();
      break;
    case 'cat-per-reset':
      if (confermaAzione('Ripristinare il catalogo scadenze periodiche ai valori predefiniti? Le modifiche manuali e i tipi personalizzati andranno persi.')) {
        ripristinaCatalogoPeriodico(); render(); toast('Catalogo ripristinato.');
      }
      break;

    /* -------- catalogo adempimenti annuali -------- */
    case 'cat-ann-expand':
      if (CAT_ANN_EXPANDED.has(el.dataset.tipo)) CAT_ANN_EXPANDED.delete(el.dataset.tipo); else CAT_ANN_EXPANDED.add(el.dataset.tipo);
      render();
      break;
    case 'cat-ann-aggiungi-sotto':
      aggiungiSottoAnnualeCatalogo(el.dataset.tipo);
      CAT_ANN_EXPANDED.add(el.dataset.tipo);
      render();
      break;
    case 'cat-ann-rimuovi-sotto':
      rimuoviSottoAnnualeCatalogo(el.dataset.tipo, Number(el.dataset.idx));
      CAT_ANN_EXPANDED.add(el.dataset.tipo);
      render();
      break;
    case 'cat-ann-elimina-tipo':
      if (confermaAzione('Eliminare definitivamente questo adempimento annuale personalizzato?')) {
        rimuoviTipoAnnualeCustom(el.dataset.tipo); render(); toast('Tipo eliminato.');
      }
      break;
    case 'cat-ann-nuovo-tipo':
      aggiungiTipoAnnualeCustom();
      break;
    case 'cat-ann-reset':
      if (confermaAzione('Ripristinare il catalogo adempimenti annuali ai valori predefiniti? Le modifiche manuali e i tipi personalizzati andranno persi.')) {
        ripristinaCatalogoAnnuale(); render(); toast('Catalogo ripristinato.');
      }
      break;

    case 'scad-aggiungi-annotazione': {
      const campo = h('scadNuovaAnnotazione');
      if (!campo || !campo.value.trim()) { toast('Scrivi qualcosa prima di aggiungere l\'annotazione.', true); return; }
      aggiungiAnnotazioneScadenza(id, campo.value);
      modalControlloImposta(id);
      render();
      break;
    }
    case 'scad-elimina-annotazione':
      eliminaAnnotazioneScadenza(id, el.dataset.annotazioneId);
      modalControlloImposta(id);
      render();
      break;
  }
}

function onChangeDelegato(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case 'dash-resp': DASH_RESP = el.value; render(); break;

    case 'cli-filtro-regime': CLI_FILTRO.regime = el.value; resetPagina('clienti'); render(); break;
    case 'cli-filtro-resp': CLI_FILTRO.resp = el.value; resetPagina('clienti'); render(); break;
    case 'cli-filtro-cessati': CLI_FILTRO.mostraCessati = el.checked; resetPagina('clienti'); render(); break;

    case 'cred-filtro-cliente': CRED_FILTRO.cliente = el.value; resetPagina('credenziali'); render(); break;
    case 'strumenti-scegli-formato': STRUMENTI_FORMATO_SCELTO = el.value; render(); break;

    // Attività a listino nel modale Preventivo/Mandato (task #138): ricalcola l'importo dalla
    // somma delle attività selezionate e, se il modello ha un campo "dettaglioAttivita", ci
    // compila anche l'elenco voci — niente render() qui: siamo dentro un form aperto, un redraw
    // completo lo butterebbe via (stesso motivo per cui altri toggle di modale, es. c-f24-toggle,
    // manipolano il DOM direttamente invece di richiamare render()).
    case 'prev-toggle-attivita': {
      const scelte = Array.from(document.querySelectorAll('[data-attivita-catalogo]:checked')).map(c => ({
        id: c.dataset.id, nome: c.dataset.nome,
        prezzo: c.dataset.prezzo !== '' ? Number(c.dataset.prezzo) : null,
        richiedeMandato: c.dataset.mandato === '1',
      }));
      if (scelte.length > 0) {
        const somma = scelte.reduce((s, a) => s + (a.prezzo != null ? a.prezzo : 0), 0);
        const campoImporto = h('pImporto');
        if (campoImporto) campoImporto.value = somma.toFixed(2);
      }
      const campoDettaglio = h('campoDettaglioAttivita');
      if (campoDettaglio) campoDettaglio.value = testoElencoAttivita(scelte);
      break;
    }

    case 'scad-filtro-bucket': SCAD_FILTRO.bucket = el.value; resetPagina('scadenze'); render(); break;
    case 'scad-filtro-stato': SCAD_FILTRO.stato = el.value; resetPagina('scadenze'); render(); break;
    case 'scad-filtro-resp': SCAD_FILTRO.resp = el.value; resetPagina('scadenze'); render(); break;
    case 'scad-filtro-tipo': SCAD_FILTRO.tipo = el.value; resetPagina('scadenze'); render(); break;
    case 'scad-cambia-stato': aggiornaScadenza(id, { stato: el.value }); render(); break;
    case 'scad-cambia-resp': aggiornaScadenza(id, { responsabile: el.value }); render(); break;
    // Varianti usate dentro modalDettaglioScadenza (task #110): stessa mutazione di sopra, ma qui
    // il modale resta aperto sopra alla pagina, quindi oltre a render() (la tabella sotto, se
    // visibile) serve ridisegnare ANCHE il modale stesso — es. cambiare stato può impostare in
    // automatico "Completata il", che nel modale è visibile e altrimenti resterebbe non aggiornato.
    case 'scad-detail-cambia-stato': aggiornaScadenza(id, { stato: el.value }); render(); modalDettaglioScadenza(id); break;
    case 'scad-detail-cambia-resp': aggiornaScadenza(id, { responsabile: el.value }); render(); modalDettaglioScadenza(id); break;

    case 'rit-filtro-cliente': RIT_FILTRO_CLIENTE = el.value; resetPagina('ritenute'); render(); break;
    case 'rit-cambia-stato': {
      const r = STATE.ritenuteRighe.find(x => x.id === id);
      if (r) { r.statoRit = el.value; salvaStato(); render(); }
      break;
    }
    case 'rit-imposta-pagamento': {
      // Il cliente ha pagato la fattura: il placeholder diventa una riga vera e propria e
      // rientra nel calcolo del cumulo/scadenza F24 dal prossimo render (derivati() rilegge
      // sempre STATE.ritenuteRighe da zero, non serve altro).
      if (!el.value) return; // l'utente ha svuotato il date picker senza scegliere una data: non fare nulla
      const r = STATE.ritenuteRighe.find(x => x.id === id);
      if (r) {
        r.dataPagamento = el.value;
        if (r.statoRit === 'In attesa di pagamento') r.statoRit = 'Da pagare';
        salvaStato(); render();
        toast('Data di pagamento impostata: la scadenza F24 è stata generata.');
      }
      break;
    }

    case 'ann-filtro-tipo': ANN_FILTRO.tipo = el.value; resetPagina('annuali'); render(); break;
    case 'ann-filtro-resp': ANN_FILTRO.resp = el.value; resetPagina('annuali'); render(); break;
    case 'ann-filtro-stato': ANN_FILTRO.stato = el.value; resetPagina('annuali'); render(); break;
    case 'ann-scadenza': aggiornaAnnualeMeta(id, { scadenza: el.value || null }); render(); break;
    case 'ann-resp': aggiornaAnnualeMeta(id, { responsabile: el.value }); render(); break;
    case 'ann-toggle-sotto': case 'ann-data-sotto': case 'ann-resp-sotto': {
      const idx = Number(el.dataset.idx);
      const annuale = derivati().annuali.find(a => a.id === id);
      if (!annuale) return;
      const nomeSotto = annuale.sotto[idx].nome;
      if (action === 'ann-toggle-sotto') aggiornaSottoAdempimento(id, nomeSotto, { completato: el.checked });
      if (action === 'ann-data-sotto') aggiornaSottoAdempimento(id, nomeSotto, { data: el.value || null });
      if (action === 'ann-resp-sotto') aggiornaSottoAdempimento(id, nomeSotto, { responsabile: el.value });
      render();
      break;
    }
    case 'scad-toggle-step': case 'scad-data-step': {
      const idx = Number(el.dataset.idx);
      const scadenza = derivati().tutteScadenze.find(s => s.id === id);
      if (!scadenza) return;
      const nomeStep = scadenza.step[idx].nome;
      if (action === 'scad-toggle-step') aggiornaStepScadenza(id, nomeStep, { completato: el.checked });
      if (action === 'scad-data-step') aggiornaStepScadenza(id, nomeStep, { data: el.value || null });
      modalControlloImposta(id);
      render();
      break;
    }
    case 'onboard-toggle': aggiornaOnboarding(ONBOARD_SELECTED, el.dataset.chiave, el.checked); render(); break;

    case 'aml-toggle-checklist': aggiornaChecklistAntiriciclaggio(AML_SELECTED, el.dataset.chiave, el.checked); render(); break;
    case 'aml-cambia-rischio': aggiornaCampoAntiriciclaggio(AML_SELECTED, 'profiloRischio', el.value); render(); break;
    case 'aml-cambia-verifica': aggiornaCampoAntiriciclaggio(AML_SELECTED, 'dataAdeguataVerifica', el.value || null); render(); break;
    case 'aml-cambia-revisione': aggiornaCampoAntiriciclaggio(AML_SELECTED, 'scadenzaRevisione', el.value || null); render(); break;

    // Task #120: l'utente ha scelto una categoria di suo pugno nel modale "Nuovo documento" — da qui
    // in poi il suggerimento (aggiornaSuggerimentoCategoriaDocumento, in onInputDelegato) non deve
    // più sovrascrivere il select mentre l'utente continua a digitare il nome. Nessun render(): è
    // solo un flag sul nodo DOM, il modale resta aperto e invariato.
    case 'doc-categoria-manual': el.dataset.userSet = '1'; break;

    case 'task-filtro-assegnato': TASK_FILTRO.assegnato = el.value; STATI_TASK_TEAM.forEach(s=>resetPagina('taskteam-'+s)); render(); break;
    case 'task-filtro-cliente': TASK_FILTRO.cliente = el.value; STATI_TASK_TEAM.forEach(s=>resetPagina('taskteam-'+s)); render(); break;
    case 'task-filtro-mostra-fatti': TASK_FILTRO.mostraFatti = el.checked; STATI_TASK_TEAM.forEach(s=>resetPagina('taskteam-'+s)); render(); break;
    case 'task-cambia-stato': aggiornaTaskTeam(id, { stato: el.value }); render(); break;

    case 'com-filtro-cliente': COM_FILTRO.cliente = el.value; resetPagina('comunicazioni'); render(); break;
    case 'com-filtro-stato': COM_FILTRO.stato = el.value; resetPagina('comunicazioni'); render(); break;
    case 'com-cambia-stato': aggiornaComunicazione(id, { stato: el.value }); render(); break;
    case 'com-cambia-stato-gruppo':
      STATE.comunicazioni.filter(c => c.gruppoId === id).forEach(c => { c.stato = el.value; });
      salvaStato(); render();
      break;
    case 'comric-toggle-attiva': aggiornaComunicazioneRicorrente(id, { attiva: el.checked }); render(); break;
    case 'c-dest-modo': {
      const w1 = document.getElementById('cDestSingoloWrap'), w2 = document.getElementById('cDestMultiWrap');
      if (w1) w1.style.display = el.value === 'singolo' ? '' : 'none';
      if (w2) w2.style.display = el.value === 'multi' ? '' : 'none';
      // Task #105: la sezione F24 ha senso solo per un destinatario singolo (l'importo è specifico
      // di quel cliente) — cambiando modo la nascondiamo e azzeriamo la spunta/i campi, così non
      // resta selezionata "in silenzio" un'F24 legata a un invio broadcast.
      const w3 = document.getElementById('cF24Wrap');
      if (w3) {
        w3.style.display = el.value === 'singolo' ? '' : 'none';
        if (el.value !== 'singolo') {
          const cb = document.getElementById('cIsF24');
          if (cb) cb.checked = false;
          const campi = document.getElementById('cF24Campi');
          if (campi) campi.style.display = 'none';
        }
      }
      break;
    }
    case 'c-f24-toggle': {
      const campi = document.getElementById('cF24Campi');
      if (campi) campi.style.display = el.checked ? '' : 'none';
      break;
    }
    case 'c-categoria-change': {
      const wrap = document.getElementById('cRaccoltaDocWrap');
      if (wrap) wrap.style.display = el.value === 'Raccolta documentale' ? '' : 'none';
      break;
    }
    case 'cr-dest-modo': {
      const w1 = document.getElementById('crDestSingoloWrap'), w2 = document.getElementById('crDestMultiWrap');
      if (w1) w1.style.display = el.value === 'singolo' ? '' : 'none';
      if (w2) w2.style.display = el.value === 'multi' ? '' : 'none';
      break;
    }
    case 'cr-adempimento-change': {
      const valore = el.value;
      const wrapDest = document.getElementById('crDestinatariWrap');
      const wrapInfo = document.getElementById('crAdempimentoInfo');
      const txtInfo = document.getElementById('crAdempimentoInfoTxt');
      if (wrapDest) wrapDest.style.display = valore ? 'none' : '';
      if (wrapInfo) wrapInfo.style.display = valore ? '' : 'none';
      if (txtInfo) txtInfo.textContent = valore ? `Destinatari attuali: ${clientiPerAdempimentoCollegato(valore).length} clienti.` : '';
      break;
    }

    case 'doc-filtro-cliente': DOC_FILTRO.cliente = el.value; resetPagina('documenti'); render(); break;
    case 'doc-filtro-categoria': DOC_FILTRO.categoria = el.value; resetPagina('documenti'); render(); break;
    case 'f24-filtro-cliente': F24_FILTRO.cliente = el.value; resetPagina('f24'); render(); break;
    case 'f24-filtro-tipo': F24_FILTRO.tipo = el.value; resetPagina('f24'); render(); break;
    case 'soci-filtro-cliente': SOCI_FILTRO.cliente = el.value; resetPagina('soci'); render(); break;

    case 'prev-filtro-cliente': PREV_FILTRO.cliente = el.value; resetPagina('preventivi'); render(); break;
    case 'prev-filtro-categoria': PREV_FILTRO.categoria = el.value; resetPagina('preventivi'); render(); break;
    case 'prev-filtro-stato': PREV_FILTRO.stato = el.value; resetPagina('preventivi'); render(); break;
    case 'prev-cambia-stato': aggiornaPreventivo(id, { stato: el.value }); render(); modalDettaglioPreventivo(id); break;
    case 'docm-cambia-cliente': {
      const modalEl = document.querySelector('.modal');
      const soloAml = modalEl.dataset.contestoAml === '1';
      const bloccato = modalEl.dataset.clienteBloccato === '1';
      modalPreventivo(null, el.value, soloAml, null, bloccato);
      break;
    }
    case 'docm-cambia-modello': {
      // Il cliente attualmente scelto va letto dal dataset del modale, non da h('pCliente'): se il
      // documento è bloccato su un cliente specifico (aperto dal fascicolo Antiriciclaggio) quel
      // <select> non esiste nel DOM, e leggerlo darebbe null, perdendo il cliente e facendolo
      // ricadere sul primo della lista al cambio di modello (bug corretto in questa sessione).
      const modalEl = document.querySelector('.modal');
      const soloAml = modalEl.dataset.contestoAml === '1';
      const bloccato = modalEl.dataset.clienteBloccato === '1';
      const clienteCorrente = modalEl.dataset.clienteAttuale || null;
      modalPreventivo(null, clienteCorrente, soloAml, el.value, bloccato);
      break;
    }

    case 'portal-seleziona-cliente': PORTAL_CLIENTE = el.value; render(); aggiornaAnteprimaPortaleSchermoIntero(); break;
    case 'bilancio-seleziona-cliente': BILANCIO_CLIENTE = el.value; render(); break;
    case 'importa-bilancio': importaBilancio(el); break;
    case 'importa-clienti-file': importaClienti(el); break;

    case 'contabilita-seleziona-cliente': CONTAB_CLIENTE = el.value; render(); break;
    case 'schcli-seleziona-cliente': SCHEDA_CLIENTE = el.value; render(); break;
    case 'import-contab-tipo':
      IMPORT_WIZARD.tipo = el.value;
      renderModalImportContabile();
      break;
    case 'import-contab-file': gestisciFileImportContabile(el); break;
    case 'import-contab-mappa-campo':
      IMPORT_WIZARD.mapping[el.dataset.campo] = el.value || null;
      break;
    case 'import-contab-classifica-conto':
      IMPORT_WIZARD.contiNuovi[Number(el.dataset.idx)].categoria = el.value;
      break;

    case 'edit-responsabile': {
      const idx = Number(el.dataset.idx);
      STATE.meta.responsabili[idx] = el.value.trim() || STATE.meta.responsabili[idx];
      salvaStato();
      break;
    }
    case 'importa-backup': importaBackup(el); break;
    case 'strumenti-scegli-file': selezionaFileConversione(el); break;

    case 'cat-per-toggle-attivo': aggiornaTipoPeriodico(el.dataset.tipo, { attivo: el.checked }); render(); break;
    case 'cat-per-mese': aggiornaOccorrenzaPeriodica(el.dataset.tipo, Number(el.dataset.idx), { m: Number(el.value) }); break;
    case 'cat-ann-toggle-attivo': aggiornaTipoAnnuale(el.dataset.tipo, { attivo: el.checked }); render(); break;
  }
}

function onInputDelegato(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch (action) {
    case 'cli-filtro-q': CLI_FILTRO.q = el.value; resetPagina('clienti'); render(); restoreFocus('[data-action="cli-filtro-q"]'); break;
    case 'rubrica-filtro-q': RUBRICA_FILTRO.q = el.value; resetPagina('rubrica'); render(); restoreFocus('[data-action="rubrica-filtro-q"]'); break;
    case 'cred-filtro-q': CRED_FILTRO.q = el.value; resetPagina('credenziali'); render(); restoreFocus('[data-action="cred-filtro-q"]'); break;
    case 'scad-filtro-q': SCAD_FILTRO.q = el.value; resetPagina('scadenze'); render(); restoreFocus('[data-action="scad-filtro-q"]'); break;
    case 'dc-tipo-change': apriModalDocumentoContabile(el.dataset.cliente, el.value); break;
    case 'f24-chiave-change': aggiornaSuggerimentoImportoF24(); break;
    case 'f24-cliente-change': aggiornaSuggerimentoImportoF24(); break;
    case 'doc-nome-suggerisci': aggiornaSuggerimentoCategoriaDocumento(); break; // no render: perderebbe il focus a metà nome
    case 'dc-conto-change': {
      const wrap = h('dcContoNuovoWrap');
      if (wrap) wrap.style.display = (el.value === '__nuovo__') ? '' : 'none';
      break;
    }
    case 'scad-cambia-nota': aggiornaScadenza(id, { nota: el.value }); break; // no render: non perdere il focus mentre si scrive
    case 'scad-cambia-importo': aggiornaScadenza(id, { importo: el.value === '' ? null : Number(el.value) }); break; // no render, stesso motivo
    case 'ann-filtro-q': ANN_FILTRO.q = el.value; resetPagina('annuali'); render(); restoreFocus('[data-action="ann-filtro-q"]'); break;
    case 'ricerca-input': RICERCA_QUERY = el.value; RICERCA_SEL = 0; aggiornaRisultatiRicerca(); break; // niente render(): perderebbe il focus sull'input
    case 'azioni-input': AZIONI_QUERY = el.value; aggiornaRisultatiAzioni(); break; // idem: niente render() mentre si digita

    case 'cat-per-nome': aggiornaTipoPeriodico(el.dataset.tipo, { nome: el.value }); break;
    case 'cat-per-giorno': aggiornaOccorrenzaPeriodica(el.dataset.tipo, Number(el.dataset.idx), { g: Number(el.value) || 1 }); break;
    case 'cat-per-nota': aggiornaOccorrenzaPeriodica(el.dataset.tipo, Number(el.dataset.idx), { nota: el.value }); break;
    case 'cat-ann-nome': aggiornaTipoAnnuale(el.dataset.tipo, { nome: el.value }); break;
    case 'cat-ann-mese': aggiornaScadenzaDefaultAnnuale(el.dataset.tipo, 'm', Number(el.value)); break;
    case 'cat-ann-giorno': aggiornaScadenzaDefaultAnnuale(el.dataset.tipo, 'g', Number(el.value) || 1); break;
    case 'cat-ann-sotto': aggiornaSottoAnnualeCatalogo(el.dataset.tipo, Number(el.dataset.idx), el.value); break;
  }
}
// Piccola utility: dopo un render generato da un input di testo, il focus si perde (si ricrea il DOM).
// Lo ripristiniamo sull'elemento con lo stesso data-action e ci mettiamo il cursore in fondo.
function restoreFocus(selector) {
  requestAnimationFrame(() => {
    const el = document.querySelector(selector);
    if (el) { el.focus(); const v = el.value; el.value=''; el.value=v; }
  });
}

/* I filtri data "Scadenza da/a" (renderScadenze) sono volutamente SORDI sia a "input" che a
   "change": un <input type="date"> nativo può emettere "change" non appena l'utente inizia a
   compilare l'ultimo segmento (l'anno) ancora prima che la data sia completa/valida — se in quel
   momento si facesse un render() (che ricrea il campo da zero), il focus si perderebbe a metà
   della digitazione dell'anno e le cifre successive andrebbero perse (bug segnalato da Matteo).
   Si applica il filtro solo quando il campo perde davvero il focus ("focusout", l'equivalente di
   "blur" ma che bubbla, quindi delegabile su document.body come gli altri eventi), quando il
   valore è ormai quello finale: da lì in poi un render() non interrompe più nessuna digitazione. */
function onFocusOutDelegato(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  switch (el.dataset.action) {
    case 'scad-filtro-data-da': SCAD_FILTRO.dataDa = el.value; resetPagina('scadenze'); render(); break;
    case 'scad-filtro-data-a': SCAD_FILTRO.dataA = el.value; resetPagina('scadenze'); render(); break;
  }
}

/* -------------------- ESPORTAZIONE VISTA PER MCP LOCALE --------------------
   A differenza del backup (STATE grezzo, pensato per essere reimportato qui), questa esportazione
   contiene i dati GIÀ CALCOLATI dal motore del gestionale — scadenze generate e classificate, stato
   contabilità desunto dai documenti, ultimo bilancio con KPI — così che un server MCP locale possa
   limitarsi a leggerli e servirli a Claude, senza dover reimplementare altrove (in un altro linguaggio,
   fuori da questo file) la logica di generazione/classificazione. Quella resta unica, sempre la stessa,
   sempre quella testata qui dentro. */
function esportaVistaMCP() {
  const oggi = oggiISO();
  const { tutteScadenze, annuali } = derivati();
  const classi = classificaScadenze(tutteScadenze, oggi);
  const categoriaPerId = new Map();
  classi.scaduti.forEach(s => categoriaPerId.set(s.id, 'scaduto'));
  classi.inScadenza.forEach(s => categoriaPerId.set(s.id, 'in_scadenza'));
  classi.futuri.forEach(s => categoriaPerId.set(s.id, 'futuro'));
  classi.completati.forEach(s => categoriaPerId.set(s.id, 'completato'));

  const scadenzeOut = tutteScadenze.map(s => ({
    id: s.id, data: s.data, clienteId: s.clienteId, cliente: nomeCliente(s.clienteId),
    famiglia: s.famiglia, tipo: s.tipo, nome: s.nome, responsabile: s.responsabile,
    stato: s.stato, categoria: categoriaPerId.get(s.id) || null, nota: s.nota, dataCompletamento: s.dataCompletamento,
    importo: s.importo != null ? s.importo : null, numeroSolleciti: (s.solleciti || []).length,
    stepControllo: (s.step || []).filter(st => st.completato).length + '/' + (s.step || []).length,
    annotazioni: (s.annotazioni || []).map(a => ({ data: a.data, testo: a.testo, autore: a.autore || null })),
  }));

  const clientiOut = STATE.clienti.map(c => {
    const contab = statoAggiornamentoDocumenti(c.id);
    const anniBil = anniBilancioCliente(c.id);
    const ultimoAnno = anniBil.length ? anniBil[anniBil.length - 1] : null;
    const ultimoBilancio = ultimoAnno ? Object.assign({ periodo: ultimoAnno, periodoEtichetta: etichettaEstesaBilancio(ultimoAnno), infraAnnuale: periodoBilancioInfraAnnuale(ultimoAnno) }, calcolaDerivatiBilancio(STATE.bilanci[c.id][ultimoAnno])) : null;
    return {
      id: c.id, ragioneSociale: c.ragioneSociale, tipo: labelTipoCliente(c.tipo), atecoCodici: c.atecoCodici || [],
      stato: c.stato, regimeFiscale: c.regimeFiscale || '', responsabileStudio: c.responsabileStudio || '',
      contabilita: contab, avvisiCoerenzaContabile: verificaCoerenzaContabile(c.id), ultimoBilancio,
    };
  });

  const taskApertiOut = STATE.taskTeam.filter(t => t.stato !== 'Fatto').map(t => ({
    id: t.id, titolo: t.titolo, clienteId: t.clienteId, cliente: t.clienteId ? nomeCliente(t.clienteId) : null,
    assegnatoA: t.assegnatoA, stato: t.stato, scadenza: t.scadenza || null,
  }));

  const comRecentiOut = STATE.comunicazioni.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,30).map(c => ({
    id: c.id, oggetto: c.oggetto, clienteId: c.clienteId, cliente: c.clienteId ? nomeCliente(c.clienteId) : null,
    data: c.data, stato: c.stato,
  }));

  // Preventivi/mandati (task #143): niente "corpo"/"valoriCustom" nell'export - sono il testo
  // integrale del documento, inutile per elencare/filtrare e potenzialmente lungo; chi vuole il
  // testo completo apre il documento nel gestionale. "numeroAttivita" basta a capire a colpo
  // d'occhio se il documento ha attività a listino collegate, senza portarsi dietro lo snapshot.
  const preventiviOut = STATE.preventivi.map(p => ({
    id: p.id, clienteId: p.clienteId, cliente: nomeCliente(p.clienteId), categoria: p.categoria,
    nomeModello: p.nomeModello, oggetto: p.oggetto, importo: p.importo != null ? p.importo : null,
    dataEmissione: p.dataEmissione, validoFino: p.validoFino || null, stato: p.stato,
    creatoIl: p.creatoIl, numeroAttivita: (p.attivitaScelte || []).length,
    mandatoGeneratoId: p.mandatoGeneratoId || null, preventivoOrigineId: p.preventivoOrigineId || null,
  }));

  // Metadati di modelli documento e catalogo attività (task #143): solo ciò che serve per creare un
  // preventivo/mandato via MCP (id, nome, prezzo...) - non il testo dei modelli (corpo), che resta
  // gestito solo dal gestionale.
  const modelliDocumentoOut = STATE.modelliDocumento.filter(m => m.attivo).map(m => ({
    id: m.id, nome: m.nome, categoria: m.categoria, predefinito: !!m.predefinito,
  }));
  const catalogoAttivitaOut = STATE.catalogoAttivitaStudio.map(a => ({
    id: a.id, nome: a.nome, prezzo: a.prezzo != null ? a.prezzo : null,
    richiedeMandato: !!a.richiedeMandato, descrizione: a.descrizione || '',
  }));

  return {
    generatoIl: new Date().toISOString(),
    studioNome: STATE.meta.studioNome,
    annoCorrente: STATE.annoCorrente,
    clienti: clientiOut,
    scadenze: scadenzeOut,
    scadenzeRiepilogo: { scaduti: classi.scaduti.length, inScadenza: classi.inScadenza.length, futuri: classi.futuri.length, completati: classi.completati.length },
    adempimentiAnnuali: annuali.map(a => ({ id: a.id, clienteId: a.clienteId, cliente: nomeCliente(a.clienteId), tipo: a.tipoNome, scadenza: a.scadenza, percentuale: a.percentuale, completato: a.completato })),
    taskApertiCount: taskApertiOut.length,
    taskAperti: taskApertiOut,
    comunicazioniRecenti: comRecentiOut,
    preventivi: preventiviOut,
    modelliDocumento: modelliDocumentoOut,
    catalogoAttivitaStudio: catalogoAttivitaOut,
  };
}

/* Scarica un file di testo (JSON) sul dispositivo dell'utente. Quando la pagina gira come
   Artifact pubblicato su claude.ai il classico "blob + <a download> + click()" è bloccato dalla
   sandbox del viewer (vale anche se la capability "downloads" non è dichiarata: il download
   avviato dalla pagina stessa è comunque inerte lì) — in quel contesto va usata la capability
   dedicata. Quando invece il file è aperto localmente (window.claude non esiste) resta il metodo
   di sempre, che funziona senza bisogno di nulla in più. */
async function salvaFileScaricabile(filename, contenutoTesto) {
  if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
    try {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        try {
          await downloads.save({ filename, data: contenutoTesto });
          return true;
        } catch (err) {
          if (err && err.code === 'declined') return false; // l'utente ha annullato dal proprio dialogo di salvataggio: non è un errore
          throw err;
        }
      }
    } catch (err) {
      console.error('Download via capability non riuscito, provo il metodo per file locale', err);
    }
  }
  // Se il chiamante ha già preparato un Blob (es. un file Excel binario), va usato così com'è:
  // ricrearlo forzando type:'application/json' ne corromperebbe il tipo dichiarato.
  const blob = (contenutoTesto instanceof Blob) ? contenutoTesto : new Blob([contenutoTesto], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

/* -------------------- GESTIONE ANNUALITÀ (task #147) -------------------- */
/* Annualità per cui è già stato scaricato un backup mirato in QUESTA sessione di navigazione —
   solo un promemoria in-memory (si azzera al reload): il vero blocco resta comunque il confirm()
   con l'elenco di conteggi prima di ogni eliminazione, qui sotto in eliminaDatiAnno(). */
let ANNI_ESPORTATI_SESSIONE = new Set();

function aggiungiAnnoGestito(anno) {
  if (!STATE.meta.anniExtra) STATE.meta.anniExtra = [];
  if (!STATE.meta.anniExtra.includes(anno)) { STATE.meta.anniExtra.push(anno); salvaStato(); }
}
function rimuoviAnnoGestito(anno) {
  if (!STATE.meta.anniExtra) return;
  STATE.meta.anniExtra = STATE.meta.anniExtra.filter(a => a !== anno);
  salvaStato();
}

/* Anni per cui esiste almeno un dato in STATE, calcolati dai campi data reali (non un intervallo
   arbitrario): alimenta il selettore di "Backup e pulizia di un'annualità" qui sotto. */
function anniConDatiRilevati() {
  const anni = new Set([STATE.annoCorrente]);
  const add = v => { if (!v) return; const y = parseInt(String(v).slice(0, 4), 10); if (!isNaN(y)) anni.add(y); };
  Object.keys(STATE.scadenzeOverrides || {}).forEach(add);
  Object.keys(STATE.annualiOverrides || {}).forEach(add);
  (STATE.ritenuteRighe || []).forEach(r => add(r.dataFattura));
  (STATE.f24 || []).forEach(f => add(f.data));
  (STATE.comunicazioni || []).forEach(c => add(c.data));
  (STATE.documenti || []).forEach(d => add(d.dataCaricamento));
  (STATE.taskTeam || []).forEach(t => add(t.scadenza));
  (STATE.preventivi || []).forEach(p => add(p.dataEmissione));
  Object.values(STATE.bilanci || {}).forEach(perCliente => Object.keys(perCliente || {}).forEach(add));
  Object.values(STATE.movimentiContabili || {}).forEach(arr => (arr || []).forEach(m => add(m.data)));
  Object.values(STATE.fattureContabili || {}).forEach(arr => (arr || []).forEach(f => add(f.data)));
  Object.values(STATE.documentiContabili || {}).forEach(arr => (arr || []).forEach(d => add(d.dataRiferimento)));
  return Array.from(anni).sort((a, b) => a - b);
}

/* Raccoglie, per una singola annualità, tutti i record di STATE che le appartengono — usato sia
   per l'export mirato sia per l'eliminazione, così le due operazioni vedono sempre lo stesso
   identico insieme di dati (nessun rischio che l'export dimentichi qualcosa che poi verrà cancellato). */
function raccogliDatiAnno(anno) {
  const a = String(anno);
  const scadenzeChiavi = Object.keys(STATE.scadenzeOverrides || {}).filter(k => k.startsWith(a + '-'));
  const annualiChiavi = Object.keys(STATE.annualiOverrides || {}).filter(k => k.startsWith(a + '|'));
  const ritenute = (STATE.ritenuteRighe || []).filter(r => (r.dataFattura || '').startsWith(a));
  const f24 = (STATE.f24 || []).filter(f => (f.data || '').startsWith(a));
  const comunicazioni = (STATE.comunicazioni || []).filter(c => (c.data || '').startsWith(a));
  const documenti = (STATE.documenti || []).filter(d => (d.dataCaricamento || '').startsWith(a));
  const taskTeam = (STATE.taskTeam || []).filter(t => (t.scadenza || '').startsWith(a));
  const preventivi = (STATE.preventivi || []).filter(p => (p.dataEmissione || '').startsWith(a));
  const bilanciVoci = [];
  Object.keys(STATE.bilanci || {}).forEach(clienteId => {
    Object.keys(STATE.bilanci[clienteId] || {}).forEach(periodo => { if (String(periodo).startsWith(a)) bilanciVoci.push({ clienteId, periodo }); });
  });
  const movimenti = [];
  Object.keys(STATE.movimentiContabili || {}).forEach(clienteId => {
    (STATE.movimentiContabili[clienteId] || []).forEach(m => { if ((m.data || '').startsWith(a)) movimenti.push({ clienteId, id: m.id }); });
  });
  const fatture = [];
  Object.keys(STATE.fattureContabili || {}).forEach(clienteId => {
    (STATE.fattureContabili[clienteId] || []).forEach(f => { if ((f.data || '').startsWith(a)) fatture.push({ clienteId, id: f.id }); });
  });
  const documentiContabili = [];
  Object.keys(STATE.documentiContabili || {}).forEach(clienteId => {
    (STATE.documentiContabili[clienteId] || []).forEach(d => { if ((d.dataRiferimento || '').startsWith(a)) documentiContabili.push({ clienteId, id: d.id }); });
  });
  return { scadenzeChiavi, annualiChiavi, ritenute, f24, comunicazioni, documenti, taskTeam, preventivi, bilanciVoci, movimenti, fatture, documentiContabili };
}

function riepilogoDatiAnno(anno) {
  const d = raccogliDatiAnno(anno);
  return [
    { etichetta: 'Scadenze periodiche (stati/note salvati)', n: d.scadenzeChiavi.length },
    { etichetta: 'Adempimenti annuali (avanzamento salvato)', n: d.annualiChiavi.length },
    { etichetta: "Righe ritenute d'acconto", n: d.ritenute.length },

    { etichetta: 'Comunicazioni', n: d.comunicazioni.length },
    { etichetta: 'Documenti clienti', n: d.documenti.length },
    { etichetta: 'Task team con scadenza in quest\'anno', n: d.taskTeam.length },
    { etichetta: 'Preventivi e mandati', n: d.preventivi.length },
    { etichetta: 'Bilanci caricati', n: d.bilanciVoci.length },
    { etichetta: 'Movimenti contabili (mastrino)', n: d.movimenti.length },
    { etichetta: 'Fatture contabili', n: d.fatture.length },
    { etichetta: 'Documenti contabili (mastrini/fatture caricate)', n: d.documentiContabili.length },

}

async function esportaDatiAnno(anno) {
  const d = raccogliDatiAnno(anno);
  const payload = {
    annoEsportato: anno, esportatoIl: oggiISO(), studioNome: STATE.meta.studioNome,
    scadenzeOverrides: Object.fromEntries(d.scadenzeChiavi.map(k => [k, STATE.scadenzeOverrides[k]])),
    annualiOverrides: Object.fromEntries(d.annualiChiavi.map(k => [k, STATE.annualiOverrides[k]])),
    ritenuteRighe: d.ritenute, f24: d.f24, comunicazioni: d.comunicazioni, documenti: d.documenti,
    taskTeam: d.taskTeam, preventivi: d.preventivi,
    bilanci: d.bilanciVoci.map(v => ({ clienteId: v.clienteId, periodo: v.periodo, dati: STATE.bilanci[v.clienteId][v.periodo] })),
    movimentiContabili: d.movimenti.map(v => ({ clienteId: v.clienteId, dati: (STATE.movimentiContabili[v.clienteId] || []).find(m => m.id === v.id) })),
    fattureContabili: d.fatture.map(v => ({ clienteId: v.clienteId, dati: (STATE.fattureContabili[v.clienteId] || []).find(f => f.id === v.id) })),
    documentiContabili: d.documentiContabili.map(v => ({ clienteId: v.clienteId, dati: (STATE.documentiContabili[v.clienteId] || []).find(x => x.id === v.id) })),
  };
  try {
    const ok = await salvaFileScaricabile(`prisma-backup-annualita-${anno}-${oggiISO()}.json`, JSON.stringify(payload, null, 2));
    if (ok) { ANNI_ESPORTATI_SESSIONE.add(anno); toast(`Backup dell'annualità ${anno} esportato.`); }
  } catch (err) {
    console.error('Esportazione dati annualità non riuscita', err);
    alert('Impossibile esportare il backup in questo browser. Prova ad aprire il file in Chrome, Firefox o Edge aggiornati.');
  }
}

/* Elimina definitivamente da STATE tutti i dati di un'annualità. Riusa gli elimina* esistenti
   dove ce n'è uno (gestiscono anche la pulizia dei file caricati fisicamente) invece di manipolare
   gli array a mano, per non riscrivere/disallineare quella logica in un secondo punto del codice. */
function eliminaDatiAnno(anno) {
  const d = raccogliDatiAnno(anno);
  const riepilogo = riepilogoDatiAnno(anno).filter(r => r.n > 0);
  const totale = riepilogo.reduce((s, r) => s + r.n, 0);
  if (totale === 0) { toast(`Nessun dato trovato in Prisma per l'annualità ${anno}.`); return; }
  const avviso = ANNI_ESPORTATI_SESSIONE.has(anno) ? '' : "\n\nATTENZIONE: non risulta un backup di quest'annualità esportato in questa sessione.";
  const elenco = riepilogo.map(r => `• ${r.etichetta}: ${r.n}`).join('\n');
  const msg = `Stai per eliminare definitivamente da Prisma questi dati dell'annualità ${anno}:\n\n${elenco}\n\nAnagrafica clienti, fascicoli antiriciclaggio, catalogo attività, modelli documento e credenziali NON vengono toccati — solo i dati datati ${anno}.${avviso}\n\nVerifica i tuoi obblighi di conservazione documentale prima di procedere. Confermi l'eliminazione?`;
  if (!confermaAzione(msg)) return;

  d.scadenzeChiavi.forEach(k => delete STATE.scadenzeOverrides[k]);
  d.annualiChiavi.forEach(k => delete STATE.annualiOverrides[k]);
  STATE.ritenuteRighe = (STATE.ritenuteRighe || []).filter(r => !d.ritenute.includes(r));
  d.f24.forEach(f => eliminaF24(f.id));
  d.comunicazioni.forEach(c => eliminaComunicazione(c.id));
  d.documenti.forEach(doc => eliminaDocumento(doc.id));
  d.taskTeam.forEach(t => eliminaTaskTeam(t.id));
  d.preventivi.forEach(p => eliminaPreventivo(p.id));
  d.bilanciVoci.forEach(v => eliminaBilancioAnno(v.clienteId, v.periodo));
  d.movimenti.forEach(v => { STATE.movimentiContabili[v.clienteId] = (STATE.movimentiContabili[v.clienteId] || []).filter(m => m.id !== v.id); });
  d.fatture.forEach(v => { STATE.fattureContabili[v.clienteId] = (STATE.fattureContabili[v.clienteId] || []).filter(f => f.id !== v.id); });
  d.documentiContabili.forEach(v => eliminaDocumentoContabile(v.clienteId, v.id));

  salvaStato();
  render();
  toast(`Dati dell'annualità ${anno} eliminati (${totale} elementi).`);
}

}
function importaBackup(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.clienti)) throw new Error('formato non valido');
      if (!confermaAzione('Importare questo backup? Sovrascriverà tutti i dati attuali.')) return;
      STATE = normalizzaStatoCaricato(parsed);
      salvaStato(); render(); toast('Backup importato correttamente.');
    } catch (err) {
      alert('File non valido: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function init() {
  caricaStato();
  caricaOperatoreLocale();
  generaComunicazioniRicorrentiDovute();
  document.body.addEventListener('click', onClickDelegato);
  document.body.addEventListener('change', onChangeDelegato);
  document.body.addEventListener('input', onInputDelegato);
  document.body.addEventListener('focusout', onFocusOutDelegato);
  h('navMenu').addEventListener('click', (e) => {
    const el = e.target.closest('[data-nav]');
    if (el) setView(el.dataset.nav);
  });
  h('annoSelect').addEventListener('change', (e) => {
    STATE.annoCorrente = Number(e.target.value);
    salvaStato(); render();
  });
  // Ricerca globale: Ctrl/Cmd+K apre la ricerca da qualsiasi punto dell'app (non solo dal
  // pulsante in topbar); frecce/Invio/Esc la navigano una volta aperta.
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      modalRicercaGlobale();
      return;
    }
    // Esc chiude qualsiasi overlay montato in #modalRoot (modali standard, ricerca globale,
    // anteprima a schermo intero del portale cliente) — non solo la ricerca.
    if (e.key === 'Escape' && h('modalRoot').children.length) { chiudiModal(); return; }
    const cercaAperta = !!document.getElementById('ricercaInput');
    if (!cercaAperta) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (RICERCA_RISULTATI.length) { RICERCA_SEL = Math.min(RICERCA_RISULTATI.length - 1, RICERCA_SEL + 1); aggiornaRisultatiRicerca(); } return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (RICERCA_RISULTATI.length) { RICERCA_SEL = Math.max(0, RICERCA_SEL - 1); aggiornaRisultatiRicerca(); } return; }
    if (e.key === 'Enter') { e.preventDefault(); const r = RICERCA_RISULTATI[RICERCA_SEL]; if (r && r.azione) r.azione(); return; }
  });
  // Riprova ad applicare un aggiornamento del sync condiviso rimasto in coda (vedi
  // applicaStatoRemotoSeLibero) appena si smette di scrivere in un qualsiasi campo — registrato
  // qui e non dentro inizializzaSyncCondiviso() perché deve esistere comunque, a prescindere da
  // quando/se il backend condiviso si connette (blur non "bubbla": serve la fase di cattura).
  document.addEventListener('blur', () => {
    if (DB_STATO_REMOTO_PENDENTE) setTimeout(applicaStatoRemotoSeLibero, 50);
  }, true);
  render();
  eventualeSelettoreOperatore(); // task #98: chiede "chi sei" solo se serve (2+ responsabili, non ancora scelto su questo PC)
  inizializzaSyncCondiviso(); // asincrono, non blocca il primo render: se non disponibile (file locale) non fa nulla
}
