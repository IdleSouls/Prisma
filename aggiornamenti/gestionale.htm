        ? `<button class="btn small" data-action="com-riapri-richiesta" data-id="${c.id}">↺ Riapri richiesta</button>`
        : `<button class="btn small" data-action="com-chiudi-richiesta" data-id="${c.id}">✓ Chiudi richiesta</button>`)
    : '';
  const html = `<div class="modal-backdrop" data-action="chiudi-modal-backdrop">
    <div class="modal" style="max-width:540px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">

      </div>
      ${azioneChiusura ? `<div style="margin-bottom:10px;">${azioneChiusura}</div>` : ''}
      ${contestoScad}
      ${c.corpo ? `<div style="font-size:13px;white-space:pre-wrap;margin-bottom:14px;padding:10px 12px;background:var(--bg);border-radius:8px;">${escapeHtml(c.corpo)}</div>` : ''}

/* -------------------- COMUNICAZIONI RICORRENTI -------------------- */
/* Elenco unificato degli adempimenti (periodici e annuali) a cui un modello di comunicazione
   ricorrente può essere agganciato, per popolare il <select> del modal con un unico campo
   invece di due select dipendenti. Il valore ha un prefisso "p:"+flag (periodico) o "a:"+chiave
   (annuale) — vedi clientiPerAdempimentoCollegato. */
function adempimentiCollegabili() {
  const periodici = catalogoPeriodici().map(def => ({ valore: 'p:' + def.flag, nome: def.nome, gruppo: 'Scadenze periodiche' }));
  const annuali = catalogoAnnualeAttivo().map(def => ({ valore: 'a:' + def.chiave, nome: def.nome, gruppo: 'Adempimenti annuali' }));
  return periodici.concat(annuali);
}
/* Clienti attivi (non cessati) per cui l'adempimento agganciato a un modello ricorrente risulta
   applicabile OGGI — ricalcolato ad ogni generazione (non una lista congelata alla creazione),
   così la platea si aggiorna da sola quando un cliente viene onboardato/offboardato da
   quell'adempimento, senza che Matteo debba tenere allineata a mano una lista di destinatari. */
function clientiPerAdempimentoCollegato(adempimentoCollegato) {
  if (!adempimentoCollegato) return [];
  const prefisso = adempimentoCollegato.slice(0, 2), valore = adempimentoCollegato.slice(2);
  const attivi = STATE.clienti.filter(c => c.stato !== 'cessato');
  if (prefisso === 'p:') return attivi.filter(c => flagsAttivi(c)[valore]).map(c => c.id);
  if (prefisso === 'a:') return attivi.filter(c => (c.adempimentiAnnualiApplicabili||[]).includes(valore)).map(c => c.id);
  return [];
}
function nomeAdempimentoCollegato(adempimentoCollegato) {
  const trovato = adempimentiCollegabili().find(a => a.valore === adempimentoCollegato);
  return trovato ? trovato.nome : adempimentoCollegato;
}
function renderComunicazioniRicorrenti() {
  const lista = STATE.comunicazioniRicorrenti || [];
  const destTxt = (t) => t.adempimentoCollegato
    ? `Automatico: clienti con "${nomeAdempimentoCollegato(t.adempimentoCollegato)}" attivo (${clientiPerAdempimentoCollegato(t.adempimentoCollegato).length})`
    : t.destinatari.modo === 'tutti' ? 'Tutti i clienti attivi'
    : t.destinatari.modo === 'multi' ? `${(t.destinatari.clienteIds||[]).length} clienti selezionati`
    : nomeCliente((t.destinatari.clienteIds||[])[0]);
  const freqTxt = (t) => t.frequenza === 'Mensile' ? `Ogni mese, il giorno ${t.giorno}`
    : t.frequenza === 'Trimestrale' ? `Ogni trimestre (gen/apr/lug/ott), il giorno ${t.giorno}`
    : `Ogni anno, ${t.giorno}/${t.mese}`;
  const righe = lista.map(t => `<div class="cat-tipo ${t.attiva===false?'disattivo':''}" style="padding:10px 14px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <input type="checkbox" data-action="comric-toggle-attiva" data-id="${t.id}" ${t.attiva!==false?'checked':''} title="Attiva">
      <div style="flex:1;">
        <div style="font-weight:700;font-size:13px;">${escapeHtml(t.oggetto)}</div>
        <div class="helptext">${escapeHtml(freqTxt(t))} · ${escapeHtml(destTxt(t))} · <span class="badge info">${escapeHtml(t.categoria)}</span></div>
      </div>
      <button class="btn small" data-action="modifica-comunicazione-ricorrente" data-id="${t.id}">Modifica</button>
      <button class="btn small danger" data-action="elimina-comunicazione-ricorrente" data-id="${t.id}">Elimina</button>
    </div>
  </div>`).join('');
  return `<div class="card">
    <div class="section-title">Comunicazioni ricorrenti <span class="cnt">${lista.length}</span></div>
    <div class="helptext" style="margin-bottom:10px;">Modelli che generano automaticamente una nuova comunicazione ad ogni scadenza (mensile, trimestrale o annuale) — utili per promemoria ricorrenti o rassegne su novità normative. Possono avere destinatari manuali oppure essere collegati a un adempimento (flag periodico o annuale): in tal caso i destinatari sono automatici e si aggiornano da soli.</div>
    ${righe || '<div class="helptext">Nessun modello ricorrente configurato.</div>'}
    <div style="margin-top:10px;"><button class="btn small primary" data-action="nuova-comunicazione-ricorrente">+ Nuovo modello ricorrente</button></div>
  </div>`;
}

/* Vero se, nel periodo corrente (mese/trimestre/anno secondo la frequenza), il giorno soglia
   configurato è già passato oggi. Usata solo alla CREAZIONE di un modello ricorrente: evita che
   crearne uno con soglia già superata nel periodo in corso (es. creato il 20, soglia il 5) lo
   faccia scattare subito per tutti i destinatari — deve aspettare la prossima occorrenza,
   esattamente come se fosse stato creato prima della soglia dei periodi successivi. */
function sogliaRicorrenzaGiaPassata(t, oggi) {
  const d = new Date(oggi + 'T00:00:00');
  const mese = d.getMonth() + 1, giorno = d.getDate();
  const giornoSoglia = Math.min(t.giorno || 1, 28);
  if (t.frequenza === 'Mensile') return giorno >= giornoSoglia;
  if (t.frequenza === 'Trimestrale') return [1,4,7,10].includes(mese) && giorno >= giornoSoglia;
  return mese === (t.mese || 1) && giorno >= giornoSoglia;
}
function aggiungiComunicazioneRicorrente(t) {
  if (!STATE.comunicazioniRicorrenti) STATE.comunicazioniRicorrenti = [];
  const oggi = oggiISO();
  const ultimaGenerazionePeriodo = sogliaRicorrenzaGiaPassata(t, oggi) ? periodoRicorrenza(t.frequenza, oggi) : null;
  STATE.comunicazioniRicorrenti.push(Object.assign({ id: uid('comric'), ultimaGenerazionePeriodo }, t));
  salvaStato();
}
function aggiornaComunicazioneRicorrente(id, patch) {
  const t = (STATE.comunicazioniRicorrenti||[]).find(x => x.id === id);
  if (!t) return;
  Object.assign(t, patch);
  salvaStato();
}
function eliminaComunicazioneRicorrente(id) {
  STATE.comunicazioniRicorrenti = (STATE.comunicazioniRicorrenti||[]).filter(x => x.id !== id);
  salvaStato();
}

/* Calcola in quale "periodo" cade una data, secondo la frequenza del modello — usato per capire
   se la generazione per il periodo corrente è già stata fatta (evita doppioni). */
function periodoRicorrenza(frequenza, dataISO) {
  const d = new Date(dataISO + 'T00:00:00');
  const anno = d.getFullYear(), mese = d.getMonth() + 1;
  if (frequenza === 'Mensile') return `${anno}-${String(mese).padStart(2,'0')}`;
  if (frequenza === 'Trimestrale') return `${anno}-Q${Math.ceil(mese/3)}`;
  return `${anno}`; // Annuale
}
function ricorrenzaDovutaOggi(t, oggi) {
  if (t.attiva === false) return false;
  const d = new Date(oggi + 'T00:00:00');
  const mese = d.getMonth() + 1, giorno = d.getDate();
  const giornoSoglia = Math.min(t.giorno || 1, 28);
  if (t.frequenza === 'Mensile') {
    if (giorno < giornoSoglia) return false;
  } else if (t.frequenza === 'Trimestrale') {
    if (![1,4,7,10].includes(mese)) return false;
    if (giorno < giornoSoglia) return false;
  } else {
    if (mese !== (t.mese || 1)) return false;
    if (giorno < giornoSoglia) return false;
  }
  return t.ultimaGenerazionePeriodo !== periodoRicorrenza(t.frequenza, oggi);
}
/* Chiamata ad ogni avvio dell'app: genera le comunicazioni dovute per i modelli ricorrenti
   attivi. Idempotente — se richiamata più volte nello stesso periodo non duplica nulla, perché
   confronta il periodo corrente con l'ultimo già generato per quel modello. */
function generaComunicazioniRicorrentiDovute() {
  const oggi = oggiISO();
  let generate = 0;
  (STATE.comunicazioniRicorrenti || []).forEach(t => {
    if (!ricorrenzaDovutaOggi(t, oggi)) return;
    let clienteIds = [];
    if (t.adempimentoCollegato) clienteIds = clientiPerAdempimentoCollegato(t.adempimentoCollegato);
    else if (t.destinatari.modo === 'tutti') clienteIds = STATE.clienti.filter(c=>c.stato!=='cessato').map(c=>c.id);
    else clienteIds = (t.destinatari.clienteIds||[]).filter(cid => { const c = clienteById(cid); return c && c.stato !== 'cessato'; });
    if (t.destinatari.modo === 'singolo' && !t.adempimentoCollegato) clienteIds = clienteIds.slice(0,1);
    if (clienteIds.length > 0) {
      const gruppoId = clienteIds.length > 1 ? uid('comgrp') : null;
      clienteIds.forEach(clienteId => {
        aggiungiComunicazione({ clienteId, data: oggi, categoria: t.categoria, stato: 'Inviata', oggetto: t.oggetto, corpo: t.corpo, note: '', visibilePortale: true, gruppoId, generataDaRicorrenteId: t.id });
      });
      generate++;
    }
    t.ultimaGenerazionePeriodo = periodoRicorrenza(t.frequenza, oggi);
  });
  if (generate) salvaStato();
  return generate;
}

   Ogni documento in STATE.documenti passa SEMPRE da un <select> su questa lista (mai testo libero),

   resta comunque coperta più sotto perché non è stata rimossa, solo riordinata). "Altro" resta
   l'ultima voce, come ripiego per tutto ciò che non rientra altrove. */
const CATEGORIE_DOCUMENTO = ['Anagrafica', 'Visura camerale', 'Atto costitutivo/Statuto', 'Contratto', 'Bilancio', 'Dichiarazione fiscale', 'F24', 'Registro contabile', 'Busta paga', 'Certificazione', 'Corrispondenza Enti', 'Polizza assicurativa', 'Pratiche', 'Altro'];
let DOC_FILTRO = { cliente: 'Tutti', categoria: 'Tutti' };

/* Task #120: auto-classificazione documenti — suggerisce una categoria in base a parole chiave nel
   nome file, "imparando" dai documenti già categorizzati dall'utente. Deliberatamente NESSUNA
   struttura dati a parte: STATE.documenti stesso è la memoria di addestramento — ogni documento
   salvato (sia con la categoria suggerita accettata sia con una scelta manualmente) è un esempio
   nome->categoria, quindi anche le "correzioni" dell'utente (cambiare la categoria di un documento
   già salvato, o ignorare il suggerimento e sceglierne un'altra in salvataggio) migliorano da sole i
   suggerimenti futuri al prossimo giro, senza bisogno di tracciarle a parte. */
function suggerisciCategoriaDocumento(nomeFile) {
  const testo = (nomeFile || '').toLowerCase().trim();
  if (testo.length < 3) return null;
  const parole = Array.from(new Set(testo.split(/[^a-zàèéìòù0-9]+/i).filter(p => p.length >= 4)));
  if (!parole.length) return null;
  const punteggi = {}; // categoria -> numero di documenti storici con almeno una parola in comune
  STATE.documenti.forEach(d => {
    if (!d.categoria || !d.nome) return;
    const nomeLower = d.nome.toLowerCase();
    if (parole.some(p => nomeLower.includes(p))) {
      punteggi[d.categoria] = (punteggi[d.categoria] || 0) + 1;
    }
  });
  let migliore = null, punteggioMax = 0;
  Object.keys(punteggi).forEach(cat => {
    if (punteggi[cat] > punteggioMax) { punteggioMax = punteggi[cat]; migliore = cat; }
  });
  // Serve almeno 2 documenti storici concordanti: con un solo precedente il "pattern" sarebbe solo
  // una coincidenza, non ancora un'abitudine consolidata da suggerire con sicurezza.
  return punteggioMax >= 2 ? migliore : null;
}

  document.getElementById('modalRoot').innerHTML = html;
}

/* -------------------- RENDER: PREVENTIVI E MANDATI (task #121, rifatto su modelli #125) --------------------
   Documento generato da un modello (vedi motore modelli sopra): entità in array e legata al
   cliente via clienteId diretto, esattamente come documenti/comunicazioni/F24/taskTeam —
   filtrabile/eliminabile con .filter(clienteId !== id) dentro eliminaCliente. Questa vista mostra
   SOLO le categorie non-AML (Preventivo/Mandato professionale/Lettera di incarico/personalizzate);
   i documenti con categoria che inizia per "AML" vivono invece nel fascicolo Antiriciclaggio del
   cliente (vedi renderAntiriciclaggio) pur condividendo esattamente lo stesso STATE.preventivi,
   lo stesso motore di generazione e le stesse azioni (apri/modifica/elimina/stampa/esporta). */
const STATI_PREVENTIVO = ['Bozza', 'Inviato', 'Accettato', 'Rifiutato'];
let PREV_FILTRO = { cliente: 'Tutti', categoria: 'Tutti', stato: 'Tutti' };

/* Apre una finestra separata con il documento pronto per la stampa: window.print() richiede un
   vero contesto browser (non implementato in jsdom, quindi mai testabile end-to-end) — avvolto in
   try/catch perché in ambienti dove i popup sono bloccati o print() non è disponibile il documento
   deve comunque restare aperto e leggibile/stampabile a mano dall'utente, non far fallire silenziosamente. */
function apriStampaPreventivo(id) {
  const p = STATE.preventivi.find(x => x.id === id);
  if (!p) { toast('Documento non trovato.'); return; }
  const win = window.open('', '_blank');
  if (!win) { toast('Impossibile aprire la finestra di stampa (popup bloccato dal browser?).', true); return; }
  win.document.write(`<!DOCTYPE html><html><head><title>${escapeHtml(p.oggetto || p.categoria)}</title><meta charset="utf-8"><style>body{font-family:Georgia,'Times New Roman',serif;max-width:720px;margin:40px auto;padding:0 24px;line-height:1.7;white-space:pre-wrap;font-size:14px;color:#111;}</style></head><body>${escapeHtml(p.corpo || '')}</body></html>`);
  win.document.close();
  win.focus();
  try { win.print(); } catch (e) { /* il documento resta comunque aperto e stampabile manualmente */ }
}
/* Esporta il documento come file di testo scaricabile, riusando lo stesso meccanismo di
   salvaFileScaricabile() già usato per il backup — gestisce da sola sia il download da browser
   locale sia il salvataggio via capability quando la pagina gira come Artifact. */
async function esportaPreventivoFile(id) {
  const p = STATE.preventivi.find(x => x.id === id);
  if (!p) { toast('Documento non trovato.'); return; }
  const slug = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const nomeFile = `${slug(p.categoria)}-${slug(nomeCliente(p.clienteId))}-${p.dataEmissione || oggiISO()}.txt`;
  try {
    const ok = await salvaFileScaricabile(nomeFile, new Blob([p.corpo || ''], { type: 'text/plain;charset=utf-8;' }));
    if (ok) toast('Documento esportato.');
  } catch (err) {
    console.error('Esportazione documento non riuscita', err);
    alert('Impossibile esportare il documento in questo browser.');
  }
}
/* Esportazione in Word senza passare dal server locale/LibreOffice (task #138, "vorrei che si
   potesse aprire facilmente il file con word"): l'RTF è testo puro con un minimo di marcatori di
   formattazione, apribile e modificabile direttamente da Word/LibreOffice/Google Docs senza alcuna
   conversione — a differenza del .txt qui sopra, che perde ogni formattazione. Euristica di
   grassetto: la prima riga (di norma il nome dello studio) e le righe tutte in maiuscolo (i titoli
   di sezione nei modelli di Matteo sono scritti così, es. "CONDIZIONI GENERALI") diventano titoli
   in grassetto — non è un vero motore di stile, ma basta a rendere il documento leggibile subito
   senza dover reintrodurre grassetti a mano in Word. */
function escapeRtf(testo) {
  let out = '';
  for (const ch of (testo || '')) {
    const code = ch.codePointAt(0);
    if (ch === '\\' || ch === '{' || ch === '}') out += '\\' + ch;
    else if (code > 126) out += '\\u' + code + '?';
    else out += ch;
  }
  return out;
}
function generaRtfDaTesto(testo) {
  const righe = (testo || '').split('\n');
  const corpo = righe.map((riga, i) => {
    const trimmed = riga.trim();
    const eTitolo = trimmed.length > 2 && trimmed === trimmed.toUpperCase() && /[A-ZÀÈÉÌÒÙ]/.test(trimmed);
    const testoRiga = escapeRtf(riga) || ' ';
    if (i === 0 || eTitolo) return `{\\b\\fs26 ${testoRiga}}\\par`;
    return `${testoRiga}\\par`;
  }).join('\n');
  return `{\\rtf1\\ansi\\ansicpg1252\\deff0{\\fonttbl{\\f0\\froman Times New Roman;}}\\f0\\fs22\n${corpo}\n}`;
}
async function esportaPreventivoRtf(id) {
  const p = STATE.preventivi.find(x => x.id === id);
  if (!p) { toast('Documento non trovato.'); return; }
  const slug = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const nomeFile = `${slug(p.categoria)}-${slug(nomeCliente(p.clienteId))}-${p.dataEmissione || oggiISO()}.rtf`;
  try {
    const ok = await salvaFileScaricabile(nomeFile, new Blob([generaRtfDaTesto(p.corpo || '')], { type: 'application/rtf' }));
    if (ok) toast('Documento esportato in formato Word (.rtf).');
  } catch (err) {
    console.error('Esportazione RTF non riuscita', err);
    alert('Impossibile esportare il documento in questo browser.');
  }
}

function renderPreventivi() {

  const daConvertire = tutti.filter(p => p.categoria === 'Preventivo' && p.stato === 'Accettato' && (p.attivitaScelte||[]).some(a => a.richiedeMandato));

  </div>`;

  const categorieDisponibili = Array.from(new Set(tutti.map(p => p.categoria))).sort((a,b)=>a.localeCompare(b));
  const toolbar = `<div class="toolbar">

      ${STATE.clienti.slice().sort((a,b)=>a.ragioneSociale.localeCompare(b.ragioneSociale)).map(c=>`<option value="${c.id}" ${PREV_FILTRO.cliente===c.id?'selected':''}>${escapeHtml(c.ragioneSociale)}</option>`).join('')}
    </select></div>

      <option value="Tutti" ${PREV_FILTRO.categoria==='Tutti'?'selected':''}>Tutte</option>
      ${categorieDisponibili.map(c=>`<option ${PREV_FILTRO.categoria===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
    </select></div>
    <div class="field"><label>Stato</label><select data-action="prev-filtro-stato">
      <option value="Tutti" ${PREV_FILTRO.stato==='Tutti'?'selected':''}>Tutti</option>

    <div class="field" style="margin-left:auto;"><label>&nbsp;</label><button class="btn primary" data-action="nuovo-preventivo">+ Nuovo documento</button></div>
  </div>`;

  if (STATE.clienti.length === 0) {
    return `<div class="card"><div class="empty"><div class="big">Aggiungi prima un cliente</div>Preventivi e mandati sono sempre legati a un'anagrafica cliente.</div></div>`;
  }

  if (modelliAttivi.length === 0) {

  }

  if (PREV_FILTRO.cliente !== 'Tutti') lista = lista.filter(p => p.clienteId === PREV_FILTRO.cliente);
  if (PREV_FILTRO.categoria !== 'Tutti') lista = lista.filter(p => p.categoria === PREV_FILTRO.categoria);
  if (PREV_FILTRO.stato !== 'Tutti') lista = lista.filter(p => p.stato === PREV_FILTRO.stato);

/* Un solo modale per creare E modificare (id assente/presente), stesso pattern di modalF24.
   In creazione: se clienteIdPreselezionato è dato (aperto dal fascicolo di un cliente specifico,
   es. da Antiriciclaggio) il cliente è fisso e non selezionabile — evita di generare per errore un
   documento per il cliente sbagliato. soloAml filtra quali modelli sono selezionabili: solo quelli
   con categoria "AML*" se true, solo gli altri se false — così lo stesso modale serve sia Preventivi
   e mandati sia la sezione Documenti del fascicolo Antiriciclaggio. */
function modalPreventivo(id, clienteIdCorrente, soloAml, modelloIdForzato, clienteBloccatoForzato) {
  const editing = id ? STATE.preventivi.find(x => x.id === id) : null;
  if (id && !editing) { toast('Documento non trovato.'); return; }
  if (!editing && STATE.clienti.length === 0) { toast('Aggiungi prima almeno un cliente.'); return; }
  const clientiAttivi = STATE.clienti.filter(c => c.stato !== 'cessato');
  /* clienteBloccatoForzato è un flag esplicito (non dedotto dalla presenza di clienteIdCorrente):
     un documento aperto dal fascicolo di un cliente specifico resta bloccato su quel cliente anche
     dopo aver cambiato modello; un documento aperto "libero" resta libero anche dopo aver scelto un
     cliente dal menu — altrimenti cambiare modello dopo aver scelto il cliente lo resetterebbe al
     primo della lista (bug corretto in questa sessione). */
  const clienteBloccato = !editing && !!clienteBloccatoForzato;
  const clienteCorrenteId = editing ? editing.clienteId : (clienteIdCorrente || (clientiAttivi[0] ? clientiAttivi[0].id : null));

  let modello = null, modelliDisponibili = [], campiPersonalizzati = [];
  if (editing) {
    modello = STATE.modelliDocumento.find(m => m.id === editing.modelloId) || null;
  } else {
    modelliDisponibili = STATE.modelliDocumento.filter(m => m.attivo && categoriaEAml(m.categoria) === !!soloAml);
    if (modelliDisponibili.length === 0) {
      toast(soloAml ? 'Nessun modello antiriciclaggio attivo: creane uno in "Modelli documenti".' : 'Nessun modello attivo: creane uno in "Modelli documenti".');
      return;
    }
    const modelloId = modelloIdForzato || (modelliDisponibili.find(m => m.predefinito) || modelliDisponibili[0]).id;
    modello = modelliDisponibili.find(m => m.id === modelloId) || modelliDisponibili[0];
  }
  if (modello) campiPersonalizzati = placeholderPersonalizzatiModello(modello.corpo);
  const valoriCustomEsistenti = editing ? (editing.valoriCustom || {}) : {};

  const selettoreCliente = (clienteBloccato || editing)
    ? `<div class="field"><label>Cliente</label><div class="helptext" style="padding-top:6px;">${escapeHtml(nomeCliente(clienteCorrenteId))}</div></div>`
    : `<div class="field"><label>Cliente *</label><select id="pCliente" data-action="docm-cambia-cliente">${clientiAttivi.map(c=>`<option value="${c.id}" ${clienteCorrenteId===c.id?'selected':''}>${escapeHtml(c.ragioneSociale)}</option>`).join('')}</select></div>`;
  const selettoreModello = editing
    ? `<div class="field"><label>Modello</label><div class="helptext" style="padding-top:6px;">${modello ? escapeHtml(modello.categoria + ' — ' + modello.nome) : 'Modello non più disponibile'}</div></div>`
    : `<div class="field"><label>Modello *</label><select id="pModello" data-action="docm-cambia-modello">${modelliDisponibili.map(m=>`<option value="${m.id}" ${modello.id===m.id?'selected':''}>${escapeHtml(m.categoria + ' — ' + m.nome)}</option>`).join('')}</select></div>`;
  const campiHtml = campiPersonalizzati.map(chiave => `
    <div class="field full" style="grid-column:1/-1;">
      <label>${escapeHtml(chiave)}</label>
      <textarea data-campo-custom data-chiave="${escapeHtml(chiave)}" ${chiave === 'dettaglioAttivita' ? 'id="campoDettaglioAttivita"' : ''} rows="2" style="min-height:44px;">${escapeHtml(valoriCustomEsistenti[chiave] || '')}</textarea>
    </div>`).join('');

  // Attività a listino (task #138): solo in creazione e fuori dal contesto AML — selezionandole si
  // calcola da sole l'importo e (se il modello ha un campo "dettaglioAttivita", come i modelli
  // standard di Matteo) si compila da sola anche l'elenco voci nel testo del documento. In
  // modifica restano bloccate: se servono cambiare conviene eliminare e ricreare il documento,
  // esattamente come già vale per il modello (vedi selettoreModello sopra).
  const catalogoAttivita = STATE.catalogoAttivitaStudio || [];
  const attivitaScelteEsistenti = editing ? (editing.attivitaScelte || []) : [];
  const sezioneAttivita = (!soloAml && catalogoAttivita.length > 0) ? `<div class="section-title" style="margin-top:14px;">Attività dal catalogo studio (opzionale)</div>
    <div class="helptext" style="margin-bottom:6px;">Selezionale per calcolare l'importo in automatico${campiPersonalizzati.includes('dettaglioAttivita') ? ' e compilare l\'elenco voci nel documento' : ''}. Resta comunque tutto modificabile a mano dopo.</div>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px 12px;">
      ${catalogoAttivita.map(a => {
        const scelta = attivitaScelteEsistenti.some(x => x.id === a.id);
        return `<label style="display:flex;align-items:center;gap:8px;font-weight:400;">
          <input type="checkbox" data-action="prev-toggle-attivita" data-attivita-catalogo data-id="${a.id}" data-nome="${escapeHtml(a.nome)}" data-prezzo="${a.prezzo != null ? a.prezzo : ''}" data-mandato="${a.richiedeMandato ? '1' : '0'}" ${scelta ? 'checked' : ''} ${editing ? 'disabled' : ''}>
          <span style="flex:1;">${escapeHtml(a.nome)}${a.richiedeMandato ? ' <span class="badge info" style="font-size:9px;">richiede mandato</span>' : ''}</span>
          <span style="color:var(--text-mut);white-space:nowrap;">${a.prezzo != null ? fmtEuro(a.prezzo) : '—'}</span>
        </label>`;
      }).join('')}
    </div>${editing ? '<div class="helptext" style="margin-top:4px;">Attività non modificabili dopo la creazione: elimina e ricrea il documento se servono cambiarle.</div>' : ''}` : '';

  const html = `<div class="modal-backdrop" data-action="chiudi-modal-backdrop">
    <div class="modal" data-contesto-aml="${soloAml?'1':'0'}" data-cliente-bloccato="${clienteBloccato?'1':'0'}" data-cliente-attuale="${clienteCorrenteId||''}" style="max-width:600px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><h2>${editing?'Modifica documento':'Nuovo documento da modello'}</h2><div class="modal-sub">${editing?'Il testo si aggiorna solo scegliendo "Rigenera dal modello" nel dettaglio del documento.':'I campi qui sotto compilano il modello scelto.'}</div></div>
        <button class="icon-x" data-action="chiudi-modal" title="Chiudi">✕</button>
      </div>
      <form id="formPreventivo" onsubmit="return false;">
        <div class="grid2">
          ${selettoreCliente}
          ${selettoreModello}
          <div class="field full" style="grid-column:1/-1;"><label>Oggetto / titolo del documento *</label><input id="pOggetto" value="${editing?escapeHtml(editing.oggetto||''):''}" placeholder="es. Sanatoria periodi d'imposta 2024-2025"></div>
          <div class="field"><label>Importo (€, opzionale)</label><input type="number" step="0.01" id="pImporto" value="${editing&&editing.importo!=null?editing.importo:''}" placeholder="0.00"></div>
          <div class="field"><label>Data emissione</label><input type="date" id="pDataEmissione" value="${editing?editing.dataEmissione:oggiISO()}"></div>
          <div class="field"><label>Valido fino al (opzionale)</label><input type="date" id="pValidoFino" value="${editing&&editing.validoFino?editing.validoFino:''}"></div>
          <div class="field"><label>Stato</label><select id="pStato">${statiPerCategoriaDocumento(modello?modello.categoria:'').map(s=>`<option ${(editing?editing.stato:'Bozza')===s?'selected':''}>${s}</option>`).join('')}</select></div>
        </div>
        ${sezioneAttivita}
        ${campiHtml ? `<div class="section-title" style="margin-top:14px;">Campi del modello</div><div class="grid2">${campiHtml}</div>` : ''}
        <div class="field full" style="grid-column:1/-1;margin-top:10px;"><label>Note interne (opzionale, non incluse nel documento)</label><textarea id="pNote" style="min-height:50px;">${editing?escapeHtml(editing.note||''):''}</textarea></div>
      </form>
      <div class="modal-actions">
        <button class="btn" data-action="chiudi-modal">Annulla</button>
        <button class="btn primary" data-action="salva-preventivo" data-id="${editing?editing.id:''}" data-modello="${modello?modello.id:''}">${editing?'Salva modifiche':'Crea documento'}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

/* Anteprima EDITABILE del testo generato dal modello (non un semplice <pre> di sola lettura): il
   testo, una volta emesso, è un'istantanea salvata sul documento — modificabile a mano con "Salva
   testo" per un ritocco puntuale, oppure "Rigenera dal modello" per ripartire da capo dal modello
   corrente (con conferma, perché sovrascrive eventuali modifiche manuali). */
function modalDettaglioPreventivo(id) {
  const p = STATE.preventivi.find(x => x.id === id);
  if (!p) { toast('Documento non trovato.'); return; }
  const modelloEsiste = p.modelloId && STATE.modelliDocumento.some(m => m.id === p.modelloId);

  const attivitaScelte = p.attivitaScelte || [];
  const blocAttivita = attivitaScelte.length ? `<div class="field full" style="margin-top:6px;"><label>Attività dal catalogo</label>
    <div class="helptext">${attivitaScelte.map(a => `${escapeHtml(a.nome)}${a.prezzo != null ? ' (' + fmtEuro(a.prezzo) + ')' : ''}`).join(' · ')}</div>
  </div>` : '';

  // Collegamento preventivo -> mandato (task #138): un mandato serve solo se almeno un'attività
  // scelta lo richiede (gestione continuativa, non una pratica singola) e solo dopo l'accettazione
  // — e solo una volta: se p.mandatoGeneratoId esiste già, il pulsante lascia il posto al link
  // verso il mandato generato, per non crearne un secondo per errore.
  const richiedeMandato = attivitaScelte.some(a => a.richiedeMandato);
  let blocCollegamento = '';
  if (p.categoria === 'Preventivo' && richiedeMandato) {
    if (p.mandatoGeneratoId && STATE.preventivi.some(x => x.id === p.mandatoGeneratoId)) {
      blocCollegamento = `<div class="helptext" style="margin-top:8px;">📄 Mandato già generato da questo preventivo: <span style="cursor:pointer;text-decoration:underline;color:var(--blu-mid);" data-action="apri-preventivo" data-id="${p.mandatoGeneratoId}">apri</span></div>`;
    } else if (p.stato === 'Accettato') {
      blocCollegamento = `<div style="margin-top:8px;"><button class="btn small primary" data-action="preventivo-genera-mandato" data-id="${p.id}">📄 Genera mandato collegato</button></div>`;

      blocCollegamento = `<div class="helptext" style="margin-top:8px;">Le attività scelte prevedono un mandato: comparirà qui non appena il preventivo sarà "Accettato".</div>`;
    }
  }
  if (p.preventivoOrigineId) {
    const origine = STATE.preventivi.find(x => x.id === p.preventivoOrigineId);
    if (origine) blocCollegamento += `<div class="helptext" style="margin-top:8px;">↳ Generato dal preventivo accettato: <span style="cursor:pointer;text-decoration:underline;color:var(--blu-mid);" data-action="apri-preventivo" data-id="${origine.id}">${escapeHtml(origine.oggetto)}</span></div>`;
  }

  const html = `<div class="modal-backdrop" data-action="chiudi-modal-backdrop">
    <div class="modal" style="max-width:640px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><h2>${escapeHtml(p.categoria)} — ${escapeHtml(nomeCliente(p.clienteId))}</h2><div class="modal-sub">${escapeHtml(p.oggetto||'')}${p.nomeModello?' · modello: '+escapeHtml(p.nomeModello):''}</div></div>
        <button class="icon-x" data-action="chiudi-modal" title="Chiudi">✕</button>
      </div>
      <div class="grid2" style="margin-top:10px;">
        <div class="field"><label>Stato</label><select data-action="prev-cambia-stato" data-id="${p.id}">${statiPerCategoriaDocumento(p.categoria).map(s=>`<option ${p.stato===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Importo</label><div style="padding-top:7px;font-size:13px;">${p.importo!=null?fmtEuro(p.importo):'—'}</div></div>
      </div>
      ${blocAttivita}
      ${blocCollegamento}
      ${p.note ? `<div class="field full" style="margin-top:6px;"><label>Note interne</label><div class="helptext">${escapeHtml(p.note)}</div></div>` : ''}
      <div class="field full" style="margin-top:10px;">
        <label>Testo del documento</label>
        <textarea id="prevAnteprimaCorpo" style="white-space:pre-wrap;font-family:Georgia,'Times New Roman',serif;font-size:13px;line-height:1.6;background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:14px;min-height:260px;margin:4px 0 0;width:100%;box-sizing:border-box;">${escapeHtml(p.corpo||'')}</textarea>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
        <button class="btn small primary" data-action="preventivo-salva-testo" data-id="${p.id}">💾 Salva testo</button>
        ${modelloEsiste ? `<button class="btn small" data-action="preventivo-rigenera" data-id="${p.id}">↻ Rigenera dal modello</button>` : ''}
        <button class="btn small" data-action="preventivo-stampa" data-id="${p.id}">🖨️ Stampa</button>
        <button class="btn small" data-action="preventivo-esporta-rtf" data-id="${p.id}">📄 Esporta Word (.rtf)</button>
        <button class="btn small" data-action="preventivo-esporta" data-id="${p.id}">⬇️ Esporta (.txt)</button>

/* Aggiorna il testo di suggerimento e, se il campo importo è ancora vuoto, lo precompila — non
   sovrascrive mai un importo che l'utente ha già digitato, il suggerimento resta sempre modificabile
   e va sempre verificato (vedi nota della regola). */
function aggiornaSuggerimentoImportoF24() {
  const selChiave = h('fChiaveAdempimento');
  const box = h('f24SuggerimentoImporto');
  if (!selChiave || !box) return;
  const chiave = selChiave.value;
  const clienteId = h('fCliente') ? h('fCliente').value : null;
  const cliente = clienteId ? clienteById(clienteId) : null;
  if (!chiave || !cliente) { box.textContent = ''; return; }
  const regola = (STATE.regoleImportiStatutari || []).find(r => r.chiave === chiave);
  const importo = calcolaImportoStatutario(chiave, cliente);
  if (importo == null) {
    box.textContent = regola ? `Nessun importo suggerito: la regola "${regola.nome}" non ha ancora un importo compilato in Impostazioni.` : '';
    return;
  }
  box.textContent = `Importo suggerito: € ${fmtNum2(importo)}${regola && regola.nota ? ' — ' + regola.nota : ''}`;
  const campoImporto = h('fImporto');
  if (campoImporto && campoImporto.value === '') campoImporto.value = importo;
}

const STATI_TASK_TEAM = ['Da fare', 'In corso', 'Fatto'];

function taskInRitardo(t) {
  return t.stato !== 'Fatto' && t.scadenza && giorniTra(oggiISO(), t.scadenza) < 0;
}

function renderTaskTeam() {
  const tutti = STATE.taskTeam;
  const aperti = tutti.filter(t => t.stato !== 'Fatto').length;
  const inRitardo = tutti.filter(taskInRitardo).length;

  const kpi = `<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="kpi completati"><div class="n">${tutti.length}</div><div class="l">TASK TOTALI</div></div>
    <div class="kpi inscadenza"><div class="n">${aperti}</div><div class="l">APERTI</div></div>
    <div class="kpi scaduti"><div class="n">${inRitardo}</div><div class="l">IN RITARDO</div></div>
  </div>`;

  const respOptions = ['Tutti'].concat(STATE.meta.responsabili);
  const toolbar = `<div class="toolbar">
    <div class="field"><label>Assegnato a</label><select data-action="task-filtro-assegnato">
      ${respOptions.map(r=>`<option value="${escapeHtml(r)}" ${TASK_FILTRO.assegnato===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
    </select></div>
    <div class="field"><label>Cliente</label><select data-action="task-filtro-cliente">
      <option value="Tutti" ${TASK_FILTRO.cliente==='Tutti'?'selected':''}>Tutti</option>
      <option value="__nessuno__" ${TASK_FILTRO.cliente==='__nessuno__'?'selected':''}>— Nessuno (task generale) —</option>
      ${STATE.clienti.slice().sort((a,b)=>a.ragioneSociale.localeCompare(b.ragioneSociale)).map(c=>`<option value="${c.id}" ${TASK_FILTRO.cliente===c.id?'selected':''}>${escapeHtml(c.ragioneSociale)}</option>`).join('')}
    </select></div>
    <div class="field" style="min-width:max-content;"><label>&nbsp;</label><label class="checkline" style="white-space:nowrap;"><input type="checkbox" data-action="task-filtro-mostra-fatti" ${TASK_FILTRO.mostraFatti?'checked':''}> Mostra completati</label></div>
    <div class="field" style="margin-left:auto;"><label>&nbsp;</label><button class="btn primary" data-action="nuovo-task-team">+ Nuovo task</button></div>
  </div>`;

  if (tutti.length === 0) {
    return kpi + toolbar + `<div class="card"><div class="empty"><div class="big">Nessun task creato</div>Crea un task per te o per un collega — puoi collegarlo a un cliente, dargli una scadenza e assegnarlo a chi vuoi.</div></div>`;
  }

  let filtrati = tutti;
  if (TASK_FILTRO.assegnato !== 'Tutti') filtrati = filtrati.filter(t => t.assegnatoA === TASK_FILTRO.assegnato);
  if (TASK_FILTRO.cliente === '__nessuno__') filtrati = filtrati.filter(t => !t.clienteId);
  else if (TASK_FILTRO.cliente !== 'Tutti') filtrati = filtrati.filter(t => t.clienteId === TASK_FILTRO.cliente);
  if (!TASK_FILTRO.mostraFatti) filtrati = filtrati.filter(t => t.stato !== 'Fatto');

  const cardTask = (t) => {
    const ritardo = taskInRitardo(t);
    // Task #114: la card mostra solo un'ANTEPRIMA dell'ultima nota (non tutto lo storico, che sta
    // nel modale) con un conteggio - così si capisce a colpo d'occhio se c'è dello storico da
    // leggere prima di lavorare sulla pratica, senza affollare il kanban.
    const noteStorico = t.noteStorico || [];
    const ultimaNota = noteStorico.length ? noteStorico[noteStorico.length - 1] : null;
    const anteprimaNota = ultimaNota
      ? `<div class="note">${escapeHtml(ultimaNota.testo)}<div class="helptext" style="margin-top:2px;">${escapeHtml(ultimaNota.autore || '—')} · ${fmtData(ultimaNota.data)}${noteStorico.length > 1 ? ` · ${noteStorico.length} note` : ''}</div></div>`
      : '';
    return `<div class="task-card">
      <div class="titolo">${escapeHtml(t.titolo)}</div>
      <div class="meta">
        <span class="badge info">${escapeHtml(t.assegnatoA || '—')}</span>
        ${t.clienteId ? `<span class="badge viola">${escapeHtml(nomeCliente(t.clienteId))}</span>` : ''}
        ${t.scadenza ? `<span class="pill-delta ${ritardo?'scaduto':'lontano'}">${ritardo?'In ritardo — ':'Entro '}${fmtDataBreve(t.scadenza)}</span>` : ''}
      </div>
      ${anteprimaNota}
      <div class="azioni">
        <select data-action="task-cambia-stato" data-id="${t.id}">${STATI_TASK_TEAM.map(s=>`<option ${t.stato===s?'selected':''}>${s}</option>`).join('')}</select>
        <button class="btn small" data-action="modifica-task-team" data-id="${t.id}">Modifica</button>
        <button class="btn small danger" data-action="elimina-task-team" data-id="${t.id}">Elimina</button>
      </div>
    </div>`;
  };

  const colonne = STATI_TASK_TEAM.map(stato => {
    const delColonna = filtrati.filter(t => t.stato === stato).sort((a,b) => (a.scadenza||'9999-99-99').localeCompare(b.scadenza||'9999-99-99'));
    const pagCol = paginaLista('taskteam-' + stato, delColonna, 30);
    return `<div>
      <div class="task-col-head">${stato} <span class="cnt">${delColonna.length}</span></div>
      ${delColonna.length ? pagCol.pagina.map(cardTask).join('') : `<div class="helptext">Nessun task.</div>`}
      ${controlliPaginazione(pagCol)}
    </div>`;
  }).join('');

  return kpi + toolbar + `<div class="task-board">${colonne}</div>`;
}

function aggiungiTaskTeam(t) {
  const task = Object.assign({ id: uid('task'), noteStorico: [] }, t);
  // Difensivo: un chiamante esterno (es. il ponte MCP) potrebbe non passare uno stato - senza
  // questo default il task risulterebbe comunque "aperto" nei KPI (stato !== 'Fatto') ma
  // invisibile nelle 3 colonne della vista a kanban, che fanno un confronto esatto con
  // STATI_TASK_TEAM: un bug reale, riscontrato in produzione, non solo un'ipotesi difensiva.
  if (!STATI_TASK_TEAM.includes(task.stato)) task.stato = STATI_TASK_TEAM[0];
  // Difensivo: un chiamante esterno (es. il ponte MCP, che non conosce questo modello dati più
  // recente) potrebbe ancora passare un vecchio campo "note" stringa invece di "noteStorico" -
  // lo convertiamo qui in modo che non vada mai perso silenziosamente.
  if (task.note && !(task.noteStorico && task.noteStorico.length)) {
    task.noteStorico = [{ id: uid('nota'), testo: String(task.note).trim(), autore: operatoreCorrente() || null, data: task.creatoIl || oggiISO() }];
  }
  delete task.note;
  STATE.taskTeam.push(task);
  salvaStato();
}
function aggiornaTaskTeam(id, patch) {
  const t = STATE.taskTeam.find(x => x.id === id);

  // 3 riconosciuti lo renderebbe invisibile nel kanban pur restando contato nei KPI.
  if ('stato' in patch && !STATI_TASK_TEAM.includes(t.stato)) t.stato = STATI_TASK_TEAM[0];
  salvaStato();
}
function eliminaTaskTeam(id) {
  STATE.taskTeam = STATE.taskTeam.filter(x => x.id !== id);

}

/* -------------------- BILANCI & KPI -------------------- */
/* Riclassificazione a valore aggiunto, il più diffuso schema di analisi di bilancio per PMI:
   dalle 17 voci grezze del template si ricavano i totali (attivo, passivo, EBITDA, EBIT...) e
   da questi gli indicatori di redditività/solidità/liquidità. Tutta la logica qui sotto è pura
   (nessun accesso a STATE, DOM, file) apposta per poterla testare senza bisogno di un vero file
   Excel o della libreria SheetJS — solo l'import/export file usano SheetJS/CSV, il calcolo no. */
/* Parser CSV minimale e senza dipendenze — gestisce sia "," che ";" come separatore (Excel in
   italiano esporta di default con ";") e i campi tra virgolette. Usato sia dai Bilanci sia,
   più avanti, dall'import di contabilità/prima nota. */
function parseCSV(text) {
  const testo = String(text || '').replace(/^﻿/, '');
  const righe = testo.split(/\r\n|\n|\r/).filter(r => r.trim() !== '');
  if (righe.length === 0) return [];
  const delim = (righe[0].split(';').length >= righe[0].split(',').length) ? ';' : ',';
  return righe.map(riga => {
    const campi = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < riga.length; i++) {
      const ch = riga[i];
      if (ch === '"') { inQuotes = !inQuotes; continue; }
      if (ch === delim && !inQuotes) { campi.push(cur); cur = ''; continue; }
      cur += ch;
    }
    campi.push(cur);
    return campi.map(c => c.trim());
  });
}

];
const GRUPPO_VOCE_BILANCIO = {
  immobImmateriali:'Attivo', immobMateriali:'Attivo', immobFinanziarie:'Attivo', rimanenze:'Attivo', creditiClienti:'Attivo', liquidita:'Attivo', altreAttivita:'Attivo',
  patrimonioNetto:'Passivo', debitiLungo:'Passivo', debitiBreve:'Passivo', altrePassivita:'Passivo',
  ricavi:'Conto economico', costiEsterni:'Conto economico', costoPersonale:'Conto economico', ammortamenti:'Conto economico', oneriFinanziari:'Conto economico', imposte:'Conto economico',
};
/* Riconosce una voce di una stampa "grezza" dalla contabilità (bilancio di verifica, situazione
   contabile...) e la raggruppa in una delle 17 voci semplificate sopra, per parole chiave — stessa
   logica di suggerisciCategoriaConto per la Contabilità, qui applicata al bilancio. Non decide da
   sola: il risultato è sempre mostrato a Matteo per conferma/correzione prima di essere importato
   (vedi pianificaImportBilancio + apriModalRiclassificaBilancio), non c'è mai un valore aggregato
   senza che sia stato scelto o confermato a video. L'ordine dei controlli conta: le voci più
   specifiche vanno controllate prima di quelle generiche che potrebbero fare match per sbaglio. */
function suggerisciVoceBilancioDaTesto(testo) {
  const t = normalizzaLabel(testo);
  if (!t) return null;
  if (/immobilizzazion.{0,15}immaterial|avviament|brevett|marchi|software|licenz/.test(t)) return 'immobImmateriali';
  if (/immobilizzazion.{0,15}material|impiant|macchinar|attrezzatur|fabbricat|terreni|automezz|mobili e arredi/.test(t)) return 'immobMateriali';
  if (/immobilizzazion.{0,15}finanziar|partecipazion|titoli immobilizzat/.test(t)) return 'immobFinanziarie';
  if (/rimanenz|magazzino|materie prime|prodotti finiti|semilavorat|merci c\/|merci in rimanenza/.test(t)) return 'rimanenze';
  if (/credit.{0,15}client|fatture da emettere/.test(t)) return 'creditiClienti';
  if (/disponibilit.{0,10}liquid|banca|c\/c bancari|cassa|depositi bancari|assegni/.test(t)) return 'liquidita';
  if (/patrimonio netto|capitale sociale|riserv|utile.{0,15}esercizio|perdita.{0,15}esercizio|utili portati a nuovo/.test(t)) return 'patrimonioNetto';
  if (/tfr|trattamento di fine rapporto|mutu|finanziament.{0,15}lungo|debit.{0,15}lungo/.test(t)) return 'debitiLungo';
  if (/debit.{0,15}fornitor|debit.{0,15}brev|debiti tributari|debiti previdenziali|iva a debito|erario c\/iva/.test(t)) return 'debitiBreve';
  if (/ricav.{0,15}vendit|fatturato|ricavi delle prestazioni/.test(t)) return 'ricavi';
  if (/materie prime.{0,15}consum|acquist|costi.{0,15}servizi|godimento.{0,15}beni.{0,15}terzi|utenze|affitt|canon[ie]|consulenz/.test(t)) return 'costiEsterni';
  if (/salari|stipend|costo.{0,15}personale|oneri sociali|inps.{0,15}dipendent/.test(t)) return 'costoPersonale';
  if (/ammortament|svalutazion/.test(t)) return 'ammortamenti';
  if (/interess.{0,15}passiv|oneri finanziari|commissioni bancarie/.test(t)) return 'oneriFinanziari';
  if (/^ires\b|^irap\b|imposte.{0,15}reddito|imposte correnti|imposte differite/.test(t)) return 'imposte';
  if (/credit.{0,15}divers|crediti tributari|risconti attivi|ratei attivi/.test(t)) return 'altreAttivita';
  if (/fondo rischi|risconti passivi|ratei passivi|debiti diversi/.test(t)) return 'altrePassivita';
  return null;
}

function normalizzaLabel(s) { return (s||'').toString().trim().toLowerCase().replace(/\s+/g,' '); }

function parseNumeroIt(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  let s = String(v).trim();
  if (s === '') return null;
  s = s.replace(/[€\s]/g, '');
  if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  const n = Number(s);
  return isNaN(n) ? null : n;
}

/* Legge una tabella grezza (array di array — prima riga: "Voce" + una colonna per anno) e
   restituisce i dati riconosciuti per anno. Non riconosce una riga -> la segnala invece di
   inventare un valore, così chi importa sa cosa non è stato letto. */
/* Riconosce l'intestazione di una colonna di bilancio: un anno intero ("2026"), un mese/anno
   ISO ("2026-06"), oppure una data italiana (che indica dove chiude il periodo infra-annuale:
   "30/06/2026" o "06/2026") — tutte normalizzate nella stessa forma periodo usata da STATE.bilanci
   (vedi dataFinePeriodoBilancio/etichettaEstesaBilancio). Restituisce null se non riconosciuta. */
function parsePeriodoHeaderBilancio(cella) {
  const s = String(cella == null ? '' : cella).trim();
  if (!s) return null;
  if (/^\d{4}$/.test(s)) { const a = Number(s); return (a > 1990 && a < 2100) ? s : null; }
  if (/^\d{4}-\d{2}$/.test(s)) { const [a, m] = s.split('-').map(Number); return (a > 1990 && a < 2100 && m >= 1 && m <= 12) ? s : null; }
  const mSlashYM = /^(\d{1,2})\/(\d{4})$/.exec(s); // MM/YYYY
  if (mSlashYM) { const m = Number(mSlashYM[1]), a = Number(mSlashYM[2]); return (m>=1&&m<=12&&a>1990&&a<2100) ? `${a}-${String(m).padStart(2,'0')}` : null; }
  const mSlashDMY = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s); // DD/MM/YYYY -> prendiamo solo mese/anno (granularità mensile)
  if (mSlashDMY) { const m = Number(mSlashDMY[2]), a = Number(mSlashDMY[3]); return (m>=1&&m<=12&&a>1990&&a<2100) ? `${a}-${String(m).padStart(2,'0')}` : null; }
  return null;
}
function parseRigheBilancio(righe) {
  if (!righe || righe.length < 2) return { anni: [], datiPerAnno: {}, vociNonRiconosciute: [] };
  const header = righe[0] || [];
  const periodi = [];
  for (let j = 1; j < header.length; j++) {
    const periodo = parsePeriodoHeaderBilancio(header[j]);
    if (periodo) periodi.push({ idx: j, periodo });
  }
  const datiPerAnno = {};
  periodi.forEach(p => { datiPerAnno[p.periodo] = {}; });
  const mappaLabel = {};
  CATALOGO_VOCI_BILANCIO.forEach(v => { mappaLabel[normalizzaLabel(v.label)] = v.chiave; });
  const vociNonRiconosciute = [];
  for (let i = 1; i < righe.length; i++) {
    const riga = righe[i];
    if (!riga || riga[0] === undefined || riga[0] === '') continue;
    const chiave = mappaLabel[normalizzaLabel(riga[0])];
    if (!chiave) { vociNonRiconosciute.push(riga[0]); continue; }
    periodi.forEach(p => {
      const val = parseNumeroIt(riga[p.idx]);
      if (val !== null) datiPerAnno[p.periodo][chiave] = val;
    });
  }
  return { anni: periodi.map(p => p.periodo), datiPerAnno, vociNonRiconosciute };
}

function calcolaDerivatiBilancio(v) {
  v = v || {};
  const g = (k) => (typeof v[k] === 'number' ? v[k] : 0);
  const totImmobilizzazioni = g('immobImmateriali') + g('immobMateriali') + g('immobFinanziarie');
  const totCircolante = g('rimanenze') + g('creditiClienti') + g('liquidita') + g('altreAttivita');
  const totAttivo = totImmobilizzazioni + totCircolante;
  const totDebiti = g('debitiLungo') + g('debitiBreve') + g('altrePassivita');
  const totPassivo = g('patrimonioNetto') + totDebiti;
  const valoreAggiunto = g('ricavi') - g('costiEsterni');
  const ebitda = valoreAggiunto - g('costoPersonale');
  const ebit = ebitda - g('ammortamenti');
  const risultatoAnteImposte = ebit - g('oneriFinanziari');
  const utileNetto = risultatoAnteImposte - g('imposte');
  const div = (n, d) => (d ? n / d : null);
  return Object.assign({}, v, {
    totImmobilizzazioni, totCircolante, totAttivo, totDebiti, totPassivo,
    valoreAggiunto, ebitda, ebit, risultatoAnteImposte, utileNetto,
    roe: div(utileNetto, g('patrimonioNetto')),
    roi: div(ebit, totAttivo),
    ros: div(ebit, g('ricavi')),
    ebitdaMargin: div(ebitda, g('ricavi')),
    indiceIndebitamento: div(totDebiti, g('patrimonioNetto')),
    gradoCapitalizzazione: div(g('patrimonioNetto'), totAttivo),
    currentRatio: div(totCircolante, g('debitiBreve')),
    incidenzaPersonale: div(g('costoPersonale'), g('ricavi')),
  });
}

function fmtEuro(n) { return (n===null||n===undefined||isNaN(n)) ? 'n/d' : n.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}); }
function fmtPct(n) { return (n===null||n===undefined||isNaN(n)) ? 'n/d' : (n*100).toLocaleString('it-IT',{maximumFractionDigits:1}) + '%'; }
function fmtNum2(n) { return (n===null||n===undefined||isNaN(n)) ? 'n/d' : n.toLocaleString('it-IT',{maximumFractionDigits:2}); }

/* Un "periodo" di bilancio è una stringa: "2026" per l'anno intero (chiusura al 31/12), oppure
   "2026-06" per una situazione infra-annuale (chiusura di periodo, es. al 30/06) — stesso sistema
   di STATE.bilanci per entrambi i casi, distinti solo dall'etichetta mostrata e dalla data di
   riferimento usata per ordinarli cronologicamente insieme (un 30/06/2026 viene prima del bilancio
   2026 ma dopo quello 2025). */
function dataFinePeriodoBilancio(periodo) {
  const pStr = String(periodo);
  if (/^\d{4}$/.test(pStr)) return `${pStr}-12-31`;
  const m = /^(\d{4})-(\d{2})$/.exec(pStr);
  if (m) {
    const anno = Number(m[1]), mese = Number(m[2]);
    const ultimoGiorno = new Date(anno, mese, 0).getDate();
    return `${m[1]}-${m[2]}-${String(ultimoGiorno).padStart(2,'0')}`;
  }
  return `${pStr}-12-31`;
}
function periodoBilancioInfraAnnuale(periodo) { return /^\d{4}-\d{2}$/.test(String(periodo)); }
/* Etichetta breve (per assi dei grafici) ed etichetta estesa (per tabelle/titoli). */
function etichettaBreveBilancio(periodo) {
  if (!periodoBilancioInfraAnnuale(periodo)) return String(periodo);
  const d = dataFinePeriodoBilancio(periodo);
  const [anno, mese, giorno] = d.split('-');
  return `${giorno}/${mese}/${anno.slice(2)}`;
}
function etichettaEstesaBilancio(periodo) {
  if (!periodoBilancioInfraAnnuale(periodo)) return `${periodo} (anno intero)`;
  return `Situazione al ${fmtData(dataFinePeriodoBilancio(periodo))} (infra-annuale)`;
}
function anniBilancioCliente(clienteId) {
  return Object.keys((STATE.bilanci && STATE.bilanci[clienteId]) || {})
    .sort((a,b) => dataFinePeriodoBilancio(a).localeCompare(dataFinePeriodoBilancio(b)));
}
function salvaBilancioAnno(clienteId, anno, voci) {
  if (!STATE.bilanci) STATE.bilanci = {};
  if (!STATE.bilanci[clienteId]) STATE.bilanci[clienteId] = {};
  STATE.bilanci[clienteId][anno] = Object.assign({}, STATE.bilanci[clienteId][anno]||{}, voci, { caricatoIl: oggiISO() });
  salvaStato();
}
function eliminaBilancioAnno(clienteId, anno) {
  if (STATE.bilanci && STATE.bilanci[clienteId]) { delete STATE.bilanci[clienteId][anno]; salvaStato(); }
}

/* Piccolo grafico a barre inline in SVG — niente librerie esterne, funziona sempre. */
function graficoBarreSvg(punti) {
  const w = 260, h = 90, padSx = 4, padBasso = 16;
  const valori = punti.map(p => Math.abs(p.valore || 0));
  const max = Math.max(1, ...valori);
  const nBar = punti.length || 1;
  const bw = (w - padSx*2) / nBar;
  const zeroY = h - padBasso;
  const barre = punti.map((p, i) => {
    const val = p.valore || 0;
    const bh = Math.max(1, Math.abs(val) / max * (zeroY - 10));
    const x = padSx + i*bw + bw*0.15;
    const y = val >= 0 ? zeroY - bh : zeroY;
    const colore = val >= 0 ? 'var(--blu-mid)' : 'var(--rosso)';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${bh.toFixed(1)}" style="fill:${colore}" rx="2"></rect>
      <text x="${(x+bw*0.35).toFixed(1)}" y="${h-4}" font-size="9" text-anchor="middle" style="fill:var(--text-mut)">${escapeHtml(String(p.label))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><line x1="0" y1="${zeroY}" x2="${w}" y2="${zeroY}" style="stroke:var(--border)"></line>${barre}</svg>`;
}

/* Scarica il template come vero file Excel (stessa libreria SheetJS già usata per leggere gli
   import, quindi nessuna dipendenza in più) quando è disponibile; altrimenti CSV, che funziona
   sempre anche offline — mai un errore muto, sempre un file scaricabile in un modo o nell'altro. */
function scaricaTemplateBilancio() {
  const annoBase = STATE.annoCorrente;
  // esempio con 2 anni interi + 1 colonna infra-annuale (situazione al 30/06 dell'anno corrente),
  // per mostrare subito il formato accettato senza dover spiegare a parole cosa scrivere in testata
  const colonne = [annoBase-2, annoBase-1, `30/06/${annoBase}`];
  const righe = [['Voce', ...colonne]];
  CATALOGO_VOCI_BILANCIO.forEach(v => righe.push([v.label, '', '', '']));
  if (typeof XLSX !== 'undefined') {
    try {
      const ws = XLSX.utils.aoa_to_sheet(righe);
      ws['!cols'] = [{ wch: 46 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Bilancio');
      XLSX.writeFile(wb, 'template-bilancio.xlsx');
      toast('Template scaricato (Excel).');
      return;
    } catch (err) {
      console.error('Generazione template Excel non riuscita, uso il CSV come alternativa:', err);
    }
  }
  const csv = righe.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  try {
    const blob = new Blob(['﻿'+csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'template-bilancio.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Template scaricato (CSV — Excel non disponibile offline).');
  } catch (err) {
    console.error('Download template bilancio non riuscito', err);
    alert('Impossibile scaricare il file in questo browser.');
  }
}

/* Riga d'ingresso "diretta": nessuna riclassifica, richiede etichette già uguali (parola per
   parola) a quelle del template — usata quando Matteo ha già compilato il template ufficiale.
   Comune sia al CSV (nessuna dipendenza) sia all'Excel vero (via SheetJS, se disponibile). */
function elaboraImportBilancio(clienteId, righe) {
  const { anni, datiPerAnno, vociNonRiconosciute } = parseRigheBilancio(righe);
  if (anni.length === 0) { toast('Nessun periodo riconosciuto nell\'intestazione (anni tipo 2024, 2025... oppure una data di chiusura infra-annuale tipo 30/06/2026).'); return; }
  anni.forEach(anno => salvaBilancioAnno(clienteId, anno, datiPerAnno[anno]));
  render();
  toast(`Importati dati per ${anni.length} ${anni.length===1?'periodo':'periodi'}${vociNonRiconosciute.length ? ' (alcune righe non riconosciute, ignorate)' : ''}.`);
}

/* Pianifica l'import da una stampa "grezza" (bilancio di verifica, situazione contabile...) con
   voci più dettagliate delle 17 semplificate: per ogni riga cerca prima una corrispondenza esatta
   col template, poi un suggerimento per parole chiave (suggerisciVoceBilancioDaTesto). Non scrive
   nulla in STATE — restituisce solo il "piano" che poi Matteo conferma o corregge riga per riga
   nel modal di riclassifica, prima che qualunque numero venga davvero sommato e salvato. */
function pianificaImportBilancio(righe) {
  if (!righe || righe.length < 2) return { periodi: [], righe: [] };
  const header = righe[0] || [];
  const periodi = [];
  for (let j = 1; j < header.length; j++) {
    const periodo = parsePeriodoHeaderBilancio(header[j]);
    if (periodo) periodi.push({ idx: j, periodo });
  }
  const mappaLabel = {};
  CATALOGO_VOCI_BILANCIO.forEach(v => { mappaLabel[normalizzaLabel(v.label)] = v.chiave; });
  const righeMappa = [];
  for (let i = 1; i < righe.length; i++) {
    const riga = righe[i];
    if (!riga || riga[0] === undefined || riga[0] === '') continue;
    const testoRiga = String(riga[0]);
    const chiaveEsatta = mappaLabel[normalizzaLabel(testoRiga)];
    const chiaveSuggerita = chiaveEsatta || suggerisciVoceBilancioDaTesto(testoRiga);
    const valori = {};
    periodi.forEach(p => { const val = parseNumeroIt(riga[p.idx]); if (val !== null) valori[p.periodo] = val; });
    if (Object.keys(valori).length === 0) continue; // riga senza alcun valore numerico, niente da importare
    righeMappa.push({
      testoRiga, chiave: chiaveSuggerita || '',
      origine: chiaveEsatta ? 'esatta' : (chiaveSuggerita ? 'suggerita' : 'nessuna'),
      valori,
    });
  }
  return { periodi: periodi.map(p => p.periodo), righe: righeMappa };
}

function importaBilancio(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const clienteId = inputEl.dataset.cliente;
  const nome = file.name.toLowerCase();
  if (nome.endsWith('.csv')) {
    const reader = new FileReader();
    reader.onload = () => {
      try { apriModalRiclassificaBilancio(clienteId, parseCSV(reader.result)); }
      catch (err) { alert('File CSV non valido: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
  } else {
    if (typeof XLSX === 'undefined') { alert('Libreria di lettura Excel non disponibile (serve una connessione internet al primo caricamento della pagina). In alternativa scarica il template in CSV: funziona sempre, anche offline.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, { type: 'array' });
        const foglio = wb.Sheets[wb.SheetNames[0]];
        const righe = XLSX.utils.sheet_to_json(foglio, { header: 1, raw: true, defval: '' });
        apriModalRiclassificaBilancio(clienteId, righe);
      } catch (err) { alert('File Excel non valido: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  }
}

/* -------------------- CONTABILITÀ / PRIMA NOTA — import intelligente --------------------
   Il punto di partenza: NON vogliamo che chi registra fatture o prima nota nel gestionale
   contabile "vero" debba poi rifare a mano lo stesso lavoro qui. L'unico modo sensato è
   l'import periodico di quello che è già stato registrato altrove. Tre problemi concreti da
   risolvere (segnalati esplicitamente): 1) riconoscere in automatico quali conti sono banca,
   cassa, carte, personale — impossibile dedurlo da un export generico con certezza, quindi
   "impara una volta, ricorda per sempre" con un suggerimento per parole chiave come punto di
   partenza; 2) sapere fino a che data la contabilità è aggiornata — calcolato SEMPRE dal dato
   stesso (la data più recente importata), mai chiesto a mano; 3) data emissione (fatture
   attive) e data ricezione (fatture passive) spesso non sono nell'export generico — si mappano
   se ci sono, restano vuote se non ci sono, non si inventano mai. */

const CATEGORIE_CONTO = ['Banca', 'Cassa', 'Carta di credito', 'Personale', 'Erario', 'Fornitori', 'Clienti', 'Altro'];

/* Classificazione per codice conto (mastro del piano dei conti Profis in uso in studio — verificato
   sul PdC reale, sett. 2026): quando l'export riporta il codice numerico del conto (es. "31.03.03"),
   la fascia di mastro è molto più affidabile del solo testo libero, perché la codifica è stabile.
   Copre i mastri rilevanti per banca/cassa/personale/fornitori/clienti/erario; per tutti gli altri
   mastri (immobilizzazioni, patrimonio netto, costi/ricavi non di gestione corrente, conti d'ordine
   ecc.) non propone nulla — meglio chiedere all'utente che indovinare. */
function suggerisciCategoriaContoDaCodice(codiceConto) {
  const c = (codiceConto || '').toString().trim();
  if (!c) return null;
  const mastro = parseInt(c.split('.')[0], 10);
  if (isNaN(mastro)) return null;
  if (mastro === 31) {
    const sottoconto = c.split('.').slice(0, 2).join('.');
    if (sottoconto === '31.01') return 'Banca'; // banche e posta c/c
    if (sottoconto === '31.03') return 'Cassa'; // cassa contanti (carte/PayPal si riconoscono dal testo, vedi sopra)
    return 'Banca';
  }
  if (mastro === 23) return 'Clienti'; // crediti commerciali
  if (mastro === 57) return 'Fornitori'; // debiti commerciali
  if (mastro === 59) return 'Erario'; // conti erariali (IVA, imposte)
  if (mastro === 61) return 'Personale'; // enti previdenziali (INPS, INAIL, ecc.)
  if (mastro === 63 && c.indexOf('63.07') === 0) return 'Personale'; // debiti verso il personale
  if (mastro === 81) return 'Personale'; // costi personale dipendente
  return null;
}

function suggerisciCategoriaConto(testo, codiceConto) {
  const t = normalizzaLabel(testo);
  // le carte di credito e PayPal in Profis sono sottoconti del mastro Cassa (31.03), ma per lo
  // studio sono una categoria a sé: il testo ha sempre l'ultima parola su questo caso specifico
  if (/carta|carte|visa|mastercard|paypal|nexi/.test(t)) return 'Carta di credito';
  const daCodice = suggerisciCategoriaContoDaCodice(codiceConto);
  if (daCodice) return daCodice;
  if (!t) return null;
  if (/banca|c\/c|bancari|posta/.test(t)) return 'Banca';
  if (/cassa|contant/.test(t)) return 'Cassa';
  if (/personale|dipendent|stipend|retribuz|inps|inail|tfr|paghe|enasarco/.test(t)) return 'Personale';
  if (/erario|iva|irap|ires|irpef|imposte/.test(t)) return 'Erario';
  if (/fornitor/.test(t)) return 'Fornitori';
  if (/client/.test(t)) return 'Clienti';
  return null;
}

    { chiave:'numero', label:'Numero fattura', obbligatorio:false, parole:['numero','num'] },
    { chiave:'controparte', label:'Fornitore', obbligatorio:false, parole:['fornitore','ragione sociale','controparte'] },
    { chiave:'dataRicezione', label:'Data ricezione', obbligatorio:true, parole:['ricezione','arrivo','data'] },
    { chiave:'imponibile', label:'Imponibile', obbligatorio:false, parole:['imponibile'] },
    { chiave:'iva', label:'IVA', obbligatorio:false, parole:['iva'] },
    { chiave:'totale', label:'Totale', obbligatorio:true, parole:['totale'] },
  ],
};
const TIPI_IMPORT_LABEL = { movimenti:'Movimenti (banca/cassa/carte/personale)', fattureAttive:'Fatture attive (vendita)', fatturePassive:'Fatture passive (acquisto)' };

function firmaColonne(header) { return (header||[]).map(normalizzaLabel).filter(Boolean).join('|'); }

/* Per ogni campo atteso, propone la colonna del file il cui nome contiene una delle parole
   chiave. Se non trova nulla di plausibile lascia il campo vuoto — meglio chiedere che
   indovinare. */
function suggerisciMappingColonne(header, tipo) {
  const campi = CAMPI_IMPORT[tipo] || [];
  const mapping = {};
  campi.forEach(campo => {
    const trovata = (header||[]).find(h => {
      const hn = normalizzaLabel(h);
      return campo.parole.some(p => hn.includes(p));
    });
    mapping[campo.chiave] = trovata || null;
  });
  return mapping;
}

/* Applica il mapping colonna->campo alle righe grezze (array di array, riga 0 = intestazioni)
   e restituisce un array di oggetti {chiave: valoreCella}. Le righe completamente vuote sono
   scartate. Un campo mappato su "nessuna colonna" resta undefined riga per riga (mai indovinato). */
function applicaMappingRighe(righeAoa, mapping) {
  if (!righeAoa || righeAoa.length === 0) return [];
  const header = righeAoa[0] || [];
  const idx = {};
  Object.keys(mapping).forEach(chiave => {
    const nomeCol = mapping[chiave];
    idx[chiave] = nomeCol ? header.findIndex(h => normalizzaLabel(h) === normalizzaLabel(nomeCol)) : -1;
  });
  const out = [];
  for (let i = 1; i < righeAoa.length; i++) {
    const riga = righeAoa[i];
    if (!riga || riga.every(c => c === '' || c === undefined || c === null)) continue;
    const obj = {};
    Object.keys(idx).forEach(chiave => { obj[chiave] = idx[chiave] >= 0 ? riga[idx[chiave]] : undefined; });
    out.push(obj);
  }
  return out;
}

/* Trova, tra le righe di movimenti già mappate, i conti che questo cliente non ha ancora mai
   classificato — con un suggerimento automatico per parole chiave dove possibile. */
function contiDaClassificare(clienteId, righeMovimenti) {
  const mappe = (STATE.contoMappings && STATE.contoMappings[clienteId]) || {};
  const visti = new Set();
  const out = [];
  righeMovimenti.forEach(r => {
    const conto = (r.conto || '').toString().trim();
    if (!conto) return;
    const chiave = normalizzaLabel(conto);
    if (visti.has(chiave) || mappe[chiave]) return;
    visti.add(chiave);
    const codiceConto = (r.codiceConto || '').toString().trim();
    out.push({ conto, chiave, categoria: suggerisciCategoriaConto(conto, codiceConto) || '' });
  });
  return out;
}

function idMovimentoContabile(clienteId, m) {
  return `${clienteId}|${m.data}|${normalizzaLabel(m.conto)}|${m.importo}|${normalizzaLabel(m.descrizione||'')}`;
}
function idFatturaContabile(clienteId, tipo, f) {
  return `${clienteId}|${tipo}|${(f.numero||'').trim()}|${f.data}|${f.totale}`;
}

/* Salva le classificazioni conto->categoria decise dall'utente (learn-once) e poi importa i
   movimenti applicando la categoria a ciascuna riga. Dedup: una riga già presente (stesso
   cliente/data/conto/importo/descrizione) non viene duplicata se il file viene reimportato. */
function elaboraImportMovimenti(clienteId, righeMappate, classificazioni) {
  if (!STATE.contoMappings) STATE.contoMappings = {};
  if (!STATE.contoMappings[clienteId]) STATE.contoMappings[clienteId] = {};
  Object.keys(classificazioni||{}).forEach(chiave => {
    if (classificazioni[chiave]) STATE.contoMappings[clienteId][chiave] = classificazioni[chiave];
  });
  if (!STATE.movimentiContabili) STATE.movimentiContabili = {};
  if (!STATE.movimentiContabili[clienteId]) STATE.movimentiContabili[clienteId] = [];
  const esistenti = new Set(STATE.movimentiContabili[clienteId].map(m => m.id));
  let aggiunti = 0, saltati = 0, senzaData = 0;
  righeMappate.forEach(r => {
    const data = (r.data||'').toString().trim();
    const conto = (r.conto||'').toString().trim();
    const importo = parseNumeroIt(r.importo);
    if (!data || !conto || importo === null) { senzaData++; return; }
    const categoria = STATE.contoMappings[clienteId][normalizzaLabel(conto)] || 'Altro';
    const m = { data, conto, descrizione: (r.descrizione||'').toString().trim(), importo, categoria };
    m.id = idMovimentoContabile(clienteId, m);
    if (esistenti.has(m.id)) { saltati++; return; }
    esistenti.add(m.id);
    STATE.movimentiContabili[clienteId].push(m);
    aggiunti++;
  });
  salvaStato();
  return { aggiunti, saltati, senzaData };
}
function elaboraImportFatture(clienteId, tipo, righeMappate) {
  if (!STATE.fattureContabili) STATE.fattureContabili = {};
  if (!STATE.fattureContabili[clienteId]) STATE.fattureContabili[clienteId] = [];
  const esistenti = new Set(STATE.fattureContabili[clienteId].map(f => f.id));
  let aggiunti = 0, saltati = 0, senzaData = 0;
  const campoData = tipo === 'fattureAttive' ? 'dataEmissione' : 'dataRicezione';
  righeMappate.forEach(r => {
    const data = (r[campoData]||'').toString().trim();
    const totale = parseNumeroIt(r.totale);
    if (!data || totale === null) { senzaData++; return; }
    const f = {
      tipo, data, numero: (r.numero||'').toString().trim(), controparte: (r.controparte||'').toString().trim(),
      imponibile: parseNumeroIt(r.imponibile), iva: parseNumeroIt(r.iva), totale,
    };
    f.id = idFatturaContabile(clienteId, tipo, f);
    if (esistenti.has(f.id)) { saltati++; return; }
    esistenti.add(f.id);
    STATE.fattureContabili[clienteId].push(f);
    aggiunti++;
  });
  salvaStato();
  return { aggiunti, saltati, senzaData };
}

/* "Fino a quando è aggiornata la contabilità": SEMPRE calcolato dal dato più recente
   effettivamente importato, per categoria — mai un valore che qualcuno deve ricordarsi di
   aggiornare a mano. Oltre 45 giorni dall'ultimo aggiornamento -> segnalato. */
const SOGLIA_GIORNI_CONTABILITA_STALE = 45;
function statoAggiornamentoContabile(clienteId) {
  const movimenti = (STATE.movimentiContabili && STATE.movimentiContabili[clienteId]) || [];
  const fatture = (STATE.fattureContabili && STATE.fattureContabili[clienteId]) || [];
  const righe = [];
  CATEGORIE_CONTO.forEach(cat => {
    const date = movimenti.filter(m => m.categoria === cat).map(m => m.data);
    if (date.length === 0) return;
    const ultima = date.sort().slice(-1)[0];
    righe.push({ etichetta: cat, data: ultima, giorniFa: giorniTra(ultima, oggiISO()) });
  });
  ['fattureAttive','fatturePassive'].forEach(tipo => {
    const date = fatture.filter(f => f.tipo === tipo).map(f => f.data);
    if (date.length === 0) return;
    const ultima = date.sort().slice(-1)[0];
    righe.push({ etichetta: tipo === 'fattureAttive' ? 'Fatture attive' : 'Fatture passive', data: ultima, giorniFa: giorniTra(ultima, oggiISO()) });
  });
  return righe.sort((a,b) => a.etichetta.localeCompare(b.etichetta));
}

/* -------------------- CONTABILITÀ: stato desunto da documenti caricati periodicamente --------------------
   Redesign (set. 2026): l'export analitico riga-per-riga di movimenti/fatture spesso non è disponibile.
   Quello che si ha davvero, periodicamente, sono report/stampe: registro IVA unico — vendite, acquisti
   e corrispettivi insieme, come si tiene realmente in studio — (attesta fino a quando le fatture/i
   corrispettivi sono registrati), bilancio a una certa data (attesta fino a quando è aggiornata la prima
   nota), più il mastrino dei conti in questione e il bilancino paghe come controllo di coerenza. Non si
   tenta di leggere il dettaglio riga per riga di questi documenti (poco affidabile da PDF): si registra
   solo IL FATTO che un documento è stato ricevuto e a quale data si riferisce — è quella data, sempre la
   più recente per tipo, a determinare "fino a quando è aggiornata la contabilità". Mai un valore inserito
   a mano a parte. */
const TIPI_DOCUMENTO_CONTABILE = [
  { v:'registroIva', l:'Registro IVA (vendite, acquisti, corrispettivi)', categoria:'Registro IVA' },
  { v:'bilancio', l:'Bilancio', categoria:'Prima nota' },
  { v:'mastrino', l:'Mastrino conti (controllo)', categoria:null },
];
function labelTipoDocumentoContabile(v) {
  const t = TIPI_DOCUMENTO_CONTABILE.find(x => x.v === v);
  return t ? t.l : (v || '—');
}

/* -------------------- CONTABILITÀ: registro conti per cliente --------------------
   Un cliente può avere più conti da monitorare via mastrino (banca, carte, cassa, PayPal, e anche
   il conto ponte usato per le retribuzioni — vedi sotto): invece di un'unica etichetta generica,
   ogni mastrino registrato è taggato con IL conto a cui si riferisce, creato al volo la prima volta
   e riselezionato le volte successive, così la freschezza si legge per singolo conto. */
function contiCliente(clienteId) {
  if (!STATE.contiCliente) STATE.contiCliente = {};
  return STATE.contiCliente[clienteId] || [];
}
function creaContoCliente(clienteId, nome) {
  const nomePulito = (nome || '').trim();
  if (!nomePulito) return null;
  if (!STATE.contiCliente) STATE.contiCliente = {};
  if (!STATE.contiCliente[clienteId]) STATE.contiCliente[clienteId] = [];
  const esistente = STATE.contiCliente[clienteId].find(c => c.nome.toLowerCase() === nomePulito.toLowerCase());
  if (esistente) return esistente;
  const conto = { id: uid('conto'), nome: nomePulito };
  STATE.contiCliente[clienteId].push(conto);
  salvaStato();
  return conto;
}
function nomeConto(clienteId, contoId) {
  const c = contiCliente(clienteId).find(x => x.id === contoId);
  return c ? c.nome : '—';
}

function registraDocumentoContabile(clienteId, tipo, dataRiferimento, note, contoId, fileInfo) {
  if (!STATE.documentiContabili) STATE.documentiContabili = {};
  if (!STATE.documentiContabili[clienteId]) STATE.documentiContabili[clienteId] = [];
  const doc = { id: uid('doccontab'), tipo, dataRiferimento, dataCaricamento: oggiISO(), note: (note||'').trim() };
  if (tipo === 'mastrino' && contoId) doc.contoId = contoId;
  if (fileInfo && fileInfo.percorso) { doc.filePercorso = fileInfo.percorso; doc.fileNome = fileInfo.nomeFile; doc.fileDimensione = fileInfo.dimensione; }
  STATE.documentiContabili[clienteId].push(doc);
  salvaStato();
  return doc;
}
function eliminaDocumentoContabile(clienteId, docId) {
  if (!STATE.documentiContabili || !STATE.documentiContabili[clienteId]) return;
  const doc = STATE.documentiContabili[clienteId].find(d => d.id === docId);
  if (doc && doc.filePercorso) eliminaFileReale(doc.filePercorso);
  STATE.documentiContabili[clienteId] = STATE.documentiContabili[clienteId].filter(d => d.id !== docId);
  salvaStato();
}

/* Per ogni categoria (fatture attive, fatture passive, prima nota) prende il documento più recente
   del tipo corrispondente e la SUA data di riferimento. */
function statoAggiornamentoDocumenti(clienteId) {
  const docs = (STATE.documentiContabili && STATE.documentiContabili[clienteId]) || [];
  const righe = [];
  TIPI_DOCUMENTO_CONTABILE.filter(t => t.categoria).forEach(t => {
    const diQuelTipo = docs.filter(d => d.tipo === t.v && d.dataRiferimento);
    if (diQuelTipo.length === 0) return;
    const ultimo = diQuelTipo.slice().sort((a,b) => a.dataRiferimento.localeCompare(b.dataRiferimento)).slice(-1)[0];
    righe.push({ etichetta: t.categoria, data: ultimo.dataRiferimento, giorniFa: giorniTra(ultimo.dataRiferimento, oggiISO()) });
  });
  return righe.sort((a,b) => a.etichetta.localeCompare(b.etichetta));
}

/* Per ogni conto del cliente (banca, carte, cassa, PayPal, conto ponte retribuzioni...) prende il
   mastrino più recente registrato su QUEL conto e la sua data di riferimento — freschezza per
   singolo conto, non un'unica etichetta generica: un conto rimasto indietro non viene mascherato
   da uno aggiornato. */
function statoContiCliente(clienteId) {
  const docs = (STATE.documentiContabili && STATE.documentiContabili[clienteId]) || [];
  const righe = [];
  contiCliente(clienteId).forEach(conto => {
    const diQuelConto = docs.filter(d => d.tipo === 'mastrino' && d.contoId === conto.id && d.dataRiferimento);
    if (diQuelConto.length === 0) return;
    const ultimo = diQuelConto.slice().sort((a,b) => a.dataRiferimento.localeCompare(b.dataRiferimento)).slice(-1)[0];
    righe.push({ contoId: conto.id, etichetta: conto.nome, data: ultimo.dataRiferimento, giorniFa: giorniTra(ultimo.dataRiferimento, oggiISO()) });
  });
  return righe.sort((a,b) => a.etichetta.localeCompare(b.etichetta));
}

/* Controllo di coerenza: se il mastrino di un conto (banca, cassa, conto ponte retribuzioni...) è
   più aggiornato del bilancio caricato, la prima nota potrebbe non essere davvero aggiornata come
   il bilancio dichiara. Un avviso per ciascun conto indietro, non uno generico. Segnala, non blocca. */
function verificaCoerenzaContabile(clienteId) {
  const docs = (STATE.documentiContabili && STATE.documentiContabili[clienteId]) || [];
  const bilanci = docs.filter(d => d.tipo === 'bilancio' && d.dataRiferimento).sort((a,b)=>a.dataRiferimento.localeCompare(b.dataRiferimento));
  if (bilanci.length === 0) return [];
  const ultimoBilancio = bilanci.slice(-1)[0];
  const avvisi = [];
  statoContiCliente(clienteId).forEach(riga => {
    if (riga.data > ultimoBilancio.dataRiferimento) {
      avvisi.push(`Mastrino "${riga.etichetta}" più recente (${fmtData(riga.data)}) del bilancio caricato (${fmtData(ultimoBilancio.dataRiferimento)}): verifica se il bilancio è da aggiornare.`);
    }
  });
  return avvisi;
}

function leggiFileTabellare(file, cb) {
  const nome = file.name.toLowerCase();
  if (nome.endsWith('.csv')) {
    const reader = new FileReader();
    reader.onload = () => { try { cb(parseCSV(reader.result)); } catch (e) { cb(null, e.message); } };
    reader.onerror = () => cb(null, 'errore di lettura del file');
    reader.readAsText(file, 'UTF-8');
  } else {
    if (typeof XLSX === 'undefined') { cb(null, 'Libreria di lettura Excel non disponibile (serve una connessione internet al primo caricamento della pagina). Usa un file .csv in alternativa: funziona sempre.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, { type: 'array' });
        const foglio = wb.Sheets[wb.SheetNames[0]];
        cb(XLSX.utils.sheet_to_json(foglio, { header: 1, raw: true, defval: '' }));
      } catch (e) { cb(null, e.message); }
    };
    reader.onerror = () => cb(null, 'errore di lettura del file');
    reader.readAsArrayBuffer(file);
  }
}

function gestisciFileImportContabile(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file || !IMPORT_WIZARD) return;
  leggiFileTabellare(file, (righeAoa, errore) => {
    if (errore) { alert(errore); return; }
    if (!righeAoa || righeAoa.length < 2) { toast('File vuoto o senza righe di dati.'); return; }
    IMPORT_WIZARD.righeAoa = righeAoa;
    const firma = w_tipo => `${IMPORT_WIZARD.tipo}::${firmaColonne(righeAoa[0])}`;
    IMPORT_WIZARD.firma = firma();
    const profilo = (STATE.importProfili || {})[IMPORT_WIZARD.firma];
    if (profilo) {
      IMPORT_WIZARD.mapping = profilo.mappingColonne;
      procediDopoMapping();
    } else {
      IMPORT_WIZARD.mapping = suggerisciMappingColonne(righeAoa[0], IMPORT_WIZARD.tipo);
      IMPORT_WIZARD.step = 'mappa';
      renderModalImportContabile();
    }
  });
}
function procediDopoMapping() {
  const w = IMPORT_WIZARD;
  w.righeMappate = applicaMappingRighe(w.righeAoa, w.mapping);
  if (w.tipo === 'movimenti') {
    w.contiNuovi = contiDaClassificare(w.clienteId, w.righeMappate);
    w.step = w.contiNuovi.length > 0 ? 'classifica' : 'anteprima';
  } else {
    w.step = 'anteprima';
  }
  renderModalImportContabile();
}

  return toolbar + helptext + boxAvvisi + `<div id="contabDocStato">${statoCards}</div>` + contiCards + tabellaDocumenti + sezioneAvanzata;
