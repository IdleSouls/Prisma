        <div style="width:38px;text-align:right;font-weight:700;font-size:12.5px;">${x.pct}%</div>
      </div>`).join('') : '<div class="empty">Tutti i clienti attivi hanno l\'onboarding completo.</div>'}
  </div>`;

  return filtroHtml + kpi + sezioneScaduti + sezioneInScadenza + sezioneAnnuali + sezioneOnboarding;
}

/* -------------------- PAGINAZIONE LISTE --------------------
   Con 100-200 clienti attivi le viste a lista lunga (Scadenze, Annuali...) possono generare
   centinaia o migliaia di righe in un anno (misurato: ~1600 scadenze/anno per 150 clienti).
   Stampare tutto nel DOM in un colpo, come si faceva prima, blocca il rendering per diversi
   secondi ad ogni apertura della vista. Ogni renderer a lista lunga passa la propria lista già
   filtrata/ordinata a paginaLista(vista, lista) e stampa solo lista.pagina, poi aggiunge
   controlliPaginazione(...) in fondo. "vista" è una chiave stabile per tenere la pagina separata
   per ciascuna lista (es. 'scadenze', 'clienti', 'taskteam-Da fare'...). */
const RIGHE_PER_PAGINA = 50;
let PAGINE = {}; // { vista: numeroPaginaCorrente }

function resetPagina(vista) { PAGINE[vista] = 1; }

function paginaLista(vista, listaCompleta, perPagina) {
  perPagina = perPagina || RIGHE_PER_PAGINA;
  const totale = listaCompleta.length;
  const totalePagine = Math.max(1, Math.ceil(totale / perPagina));
  let pag = PAGINE[vista] || 1;
  if (pag > totalePagine) pag = totalePagine;
  if (pag < 1) pag = 1;
  PAGINE[vista] = pag;
  const start = (pag - 1) * perPagina;
  return { pagina: listaCompleta.slice(start, start + perPagina), numeroPagina: pag, totalePagine, totale, perPagina, vista };
}

function controlliPaginazione(info) {
  const { vista, numeroPagina, totalePagine, totale, perPagina } = info;
  if (totalePagine <= 1) return '';
  const daIdx = totale === 0 ? 0 : (numeroPagina - 1) * perPagina + 1;
  const aIdx = Math.min(numeroPagina * perPagina, totale);
  return `<div class="paginazione">
    <span class="helptext">${daIdx}–${aIdx} di ${totale}</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn small" data-action="pagina-prev" data-vista="${vista}" data-tot="${totalePagine}" ${numeroPagina<=1?'disabled':''}>← Precedente</button>
      <span class="helptext">Pagina ${numeroPagina} di ${totalePagine}</span>
      <button class="btn small" data-action="pagina-next" data-vista="${vista}" data-tot="${totalePagine}" ${numeroPagina>=totalePagine?'disabled':''}>Successiva →</button>
    </div>
  </div>`;
}

/* -------------------- RICERCA GLOBALE --------------------
   Con 100-200 clienti, "dov'è quel cliente/quella comunicazione/quel documento" diventa un
   problema reale se bisogna sapere in anticipo in quale vista e con quale filtro cercarlo.
   Ctrl/Cmd+K (o il pulsante in alto) apre una ricerca unica su clienti, scadenze, adempimenti
   annuali, comunicazioni, documenti, task team, soci e F24 — ogni risultato porta dritto al
   punto giusto, riusando la stessa navigazione già presente altrove (es. scheda cliente 360°).
   Nota di design: scadenze/annuali/comunicazioni/documenti/F24 vengono cercati SOLO sul proprio
   testo (adempimento, oggetto, nome, descrizione), non anche sul nome cliente — altrimenti
   digitare il nome di un cliente con 12 scadenze/anno produrrebbe 12 righe ridondanti in più
   categorie. Cercare un cliente per nome resta compito della categoria "Clienti", che porta
   comunque alla sua scheda 360° con tutto quanto sopra già in vista. */
let RICERCA_QUERY = '';
let RICERCA_RISULTATI = [];
let RICERCA_SEL = 0;

function risultatiRicercaGlobale(query) {
  const q = (query || '').trim().toLowerCase();
  if (q.length < 2) return [];
  const out = [];
  const push = (categoria, titolo, sottotitolo, azione) => out.push({ categoria, titolo, sottotitolo, azione });

  STATE.clienti.forEach(c => {
    const campi = [c.ragioneSociale, c.partitaIva, c.codiceFiscale, c.settore, (c.contatti||{}).email, (c.contatti||{}).telefono, (c.contatti||{}).pec];
    if (campi.filter(Boolean).some(v => String(v).toLowerCase().includes(q))) {
      push('Clienti', c.ragioneSociale, `${c.regimeFiscale||'—'}${c.stato==='cessato'?' · cessato':''}${c.partitaIva?' · P.IVA '+c.partitaIva:''}`,
        () => { SCHEDA_CLIENTE = c.id; chiudiModal(); setView('schedacliente'); });
    }
  });

  const { tutteScadenze, annuali } = derivati();
  tutteScadenze.forEach(s => {
    if (s.nome.toLowerCase().includes(q)) {
      const nomeCli = nomeCliente(s.clienteId);
      push('Scadenze', `${s.nome} — ${nomeCli}`, `${fmtDataBreve(s.data)} · ${s.stato}`,
        () => { SCAD_FILTRO = { bucket: 'Tutti', stato: 'Tutti', resp: 'Tutti', tipo: 'Tutti', q: nomeCli, dataDa: '', dataA: '' }; resetPagina('scadenze'); chiudiModal(); setView('scadenze'); });
    }
  });

  annuali.forEach(a => {
    if (a.tipoNome.toLowerCase().includes(q)) {
      const nomeCli = nomeCliente(a.clienteId);
      push('Adempimenti annuali', `${a.tipoNome} — ${nomeCli}`, `${a.percentuale}% completato${a.scadenza?' · scad. '+fmtDataBreve(a.scadenza):''}`,
        () => { ANN_FILTRO = { tipo: 'Tutti', resp: 'Tutti', stato: 'Tutti', q: nomeCli }; resetPagina('annuali'); chiudiModal(); setView('annuali'); });
    }
  });

  STATE.comunicazioni.forEach(c => {
    if ((c.oggetto||'').toLowerCase().includes(q)) {
      const nomeCli = nomeCliente(c.clienteId);
      push('Comunicazioni', c.oggetto, `${fmtDataBreve(c.data)} · ${nomeCli} · ${c.stato}`,
        () => { COM_FILTRO = { cliente: c.clienteId, stato: 'Tutti' }; resetPagina('comunicazioni'); chiudiModal(); setView('comunicazioni'); });
    }
  });

  STATE.documenti.forEach(d => {
    if ((d.nome||'').toLowerCase().includes(q)) {
      const nomeCli = nomeCliente(d.clienteId);
      push('Documenti', d.nome, `${nomeCli}${d.dataScadenza?' · scad. '+fmtDataBreve(d.dataScadenza):''}`,
        () => { DOC_FILTRO = { cliente: d.clienteId, categoria: 'Tutti' }; resetPagina('documenti'); chiudiModal(); setView('documenti'); });
    }
  });

  STATE.taskTeam.forEach(t => {
    if ((t.titolo||'').toLowerCase().includes(q)) {
      const nomeCli = t.clienteId ? nomeCliente(t.clienteId) : null;
      push('Task team', t.titolo, `${t.assegnatoA||'—'}${nomeCli?' · '+nomeCli:''} · ${t.stato}`,
        () => { chiudiModal(); setView('taskteam'); modalTaskTeam(t.id); });
    }
  });

  (STATE.soci||[]).forEach(s => {
    if ((s.nome||'').toLowerCase().includes(q) || (s.ruolo||'').toLowerCase().includes(q)) {
      push('Soci e referenti', s.nome, `${s.ruolo||''}${(s.clienteIds||[]).length?' · '+s.clienteIds.map(nomeCliente).join(', '):''}`,
        () => { chiudiModal(); setView('soci'); modalSocio(s.id); });
    }
  });

  (STATE.f24||[]).forEach(f => {
    if ((f.descrizione||'').toLowerCase().includes(q)) {
      const nomeCli = nomeCliente(f.clienteId);
      push('F24', `${f.descrizione} — ${nomeCli}`, `${fmtDataBreve(f.data)} · ${fmtEuro(f.importo)}`,
        () => { F24_FILTRO = { cliente: f.clienteId, tipo: 'Tutti' }; resetPagina('f24'); chiudiModal(); setView('f24'); });
    }
  });

  return out;
}

function modalRicercaGlobale() {
  RICERCA_QUERY = '';
  RICERCA_SEL = 0;
  const html = `<div class="modal-backdrop" data-action="chiudi-modal-backdrop">
    <div class="modal" style="max-width:640px;padding-top:16px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <input id="ricercaInput" type="text" placeholder="Cerca clienti, scadenze, comunicazioni, documenti, task, soci, F24..." style="flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:14.5px;" data-action="ricerca-input" autocomplete="off">
        <button class="icon-x" data-action="chiudi-modal" title="Chiudi">✕</button>
      </div>
      <div id="ricercaResults"></div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  const input = document.getElementById('ricercaInput');
  if (input) input.focus();
  aggiornaRisultatiRicerca();
}

/* Aggiorna SOLO il contenitore dei risultati, senza toccare l'input: se rifacessimo l'intero
   modale ad ogni tasto premuto (come fa render() per il resto dell'app) l'input perderebbe il
   focus mentre si scrive — stesso motivo per cui scad-cambia-nota/importo evitano render(). */
function aggiornaRisultatiRicerca() {
  const el = document.getElementById('ricercaResults');
  if (!el) return;
  if (RICERCA_QUERY.trim().length < 2) {
    RICERCA_RISULTATI = [];
    el.innerHTML = `<div class="empty" style="padding:24px 4px;">Digita almeno 2 caratteri per cercare.</div>`;
    return;
  }
  RICERCA_RISULTATI = risultatiRicercaGlobale(RICERCA_QUERY).slice(0, 40);
  if (RICERCA_SEL >= RICERCA_RISULTATI.length) RICERCA_SEL = Math.max(0, RICERCA_RISULTATI.length - 1);
  if (RICERCA_RISULTATI.length === 0) {
    el.innerHTML = `<div class="empty" style="padding:24px 4px;">Nessun risultato per "${escapeHtml(RICERCA_QUERY)}".</div>`;
    return;
  }
  const perCategoria = new Map();
  RICERCA_RISULTATI.forEach((r, idx) => { r._idx = idx; if (!perCategoria.has(r.categoria)) perCategoria.set(r.categoria, []); perCategoria.get(r.categoria).push(r); });
  el.innerHTML = `<div style="max-height:60vh;overflow-y:auto;">` + Array.from(perCategoria.entries()).map(([cat, righe]) => `
    <div style="font-size:11px;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.03em;margin:12px 2px 4px;">${escapeHtml(cat)} (${righe.length})</div>
    ${righe.map(r => `<div class="client-row" data-action="ricerca-apri" data-idx="${r._idx}" style="cursor:pointer;margin-bottom:4px;${r._idx===RICERCA_SEL?'border-color:var(--blu-mid);background:#f4f8fc;':''}">
      <div><div class="name">${escapeHtml(r.titolo)}</div><div class="meta">${escapeHtml(r.sottotitolo||'')}</div></div>
    </div>`).join('')}
  `).join('') + `</div>`;
}

/* -------------------- TAB AZIONI: ricerca a parole chiave sulle funzioni dell'app --------------------
   No IA, nessun costo: puro matching testuale locale su un registro curato di azioni (creazioni rapide
   + scorciatoie verso ogni sezione della nav). Digitando es. "creazione cliente" si trova la voce e,
   cliccandola, si naviga direttamente lì aprendo subito la funzione (stesso pattern collaudato di
   risultatiRicercaGlobale: chiudiModal() + setView() + eventuale modalXxx() nella stessa chiusura). */
let AZIONI_QUERY = '';
let AZIONI_RISULTATI = [];

function registroAzioni() {
  const out = [];
  const push = (categoria, titolo, sottotitolo, parole, azione) => out.push({ categoria, titolo, sottotitolo, parole: (parole || '').toLowerCase(), azione });

  // Azioni rapide: creazione diretta di una nuova voce (le stesse funzioni richiamate dai pulsanti "+ Nuovo..." nell'app)
  push('Azioni rapide', '+ Nuovo cliente', 'Apre la creazione di una nuova anagrafica cliente', 'anagrafica azienda ditta partita iva creazione nuovo cliente',
    () => { chiudiModal(); setView('clienti'); modalCliente(null); });
  push('Azioni rapide', '+ Nuovo socio o referente', 'Persona collegata a uno o più clienti (socio, amministratore, referente)', 'socio referente amministratore persona nuovo',
    () => { chiudiModal(); setView('soci'); modalSocio(null); });
  push('Azioni rapide', '+ Nuovo task', 'Assegna un\'attività a un collega dello studio', 'task cosa da fare todo attivita team assegna nuovo',
    () => { chiudiModal(); setView('taskteam'); modalTaskTeam(null); });
  push('Azioni rapide', '+ Nuova comunicazione', 'Pubblica un messaggio nel portale cliente', 'comunicazione messaggio portale broadcast invio nuova',
    () => { chiudiModal(); setView('comunicazioni'); modalComunicazione(null); });
  push('Azioni rapide', '+ Registra F24', 'F24 versato o compensato per un cliente', 'f24 versamento compensazione pagamento modello registra nuovo',
    () => { chiudiModal(); setView('f24'); modalF24(null); });
  push('Azioni rapide', '+ Nuovo preventivo o mandato', 'Documento da modello: preventivo, mandato professionale, lettera di incarico', 'preventivo mandato lettera incarico documento nuovo',
    () => { chiudiModal(); setView('preventivi'); modalPreventivo(null, null, false, null, false); });
  push('Azioni rapide', '+ Nuovo modello documento', 'Testo precompilato con segnaposto {{così}} per preventivi/mandati/antiriciclaggio', 'modello template segnaposto documento nuovo',
    () => { chiudiModal(); setView('modelli'); modalModelloDocumento(null); });
  push('Azioni rapide', '+ Nuova password/credenziale', 'Salva un accesso: Entratel, Telemaco, home banking, software...', 'password credenziale accesso entratel telemaco banking vault nuova',
    () => { chiudiModal(); setView('credenziali'); modalCredenziale(null); });
  push('Azioni rapide', '+ Nuova attività a catalogo', 'Voce del tariffario dello studio usata nei preventivi', 'catalogo tariffario listino prezzo attivita nuova',
    () => { chiudiModal(); setView('impostazioni'); modalAttivitaCatalogo(null); });
  push('Azioni rapide', 'Cerca un record esistente (Ctrl/Cmd+K)', 'Cerca tra clienti, scadenze, comunicazioni, documenti, task, soci, F24 già presenti', 'ricerca cerca trova cliente scadenza pratica record esistente',
    () => { chiudiModal(); modalRicercaGlobale(); });
  push('Azioni rapide', 'Importa clienti da Excel/CSV', 'Carica più anagrafiche insieme da un file', 'importa excel csv massivo clienti caricamento',
    () => { chiudiModal(); setView('clienti'); });
  push('Azioni rapide', 'Esporta o importa backup', 'Backup JSON di tutti i dati dello studio, esportazione per MCP', 'backup esporta importa json ripristino salvataggio mcp',
    () => { chiudiModal(); setView('impostazioni'); });

  // Vai a una sezione: una voce per ogni pagina della barra laterale
  NAV.forEach(g => g.items.forEach(it => {
    if (it.id === 'azioni') return;
    const sotto = (PAGE_TITLES[it.id] || ['', ''])[1];
    push(g.group, `Vai a ${it.label}`, sotto, `vai apri sezione ${it.label}`,
      () => { chiudiModal(); setView(it.id); });
  }));

  return out;
}

function risultatiAzioni(query) {
  const q = (query || '').trim().toLowerCase();
  const tutte = registroAzioni();
  if (!q) return tutte;
  // Match "a parole": ogni parola digitata deve comparire da qualche parte nel testo cercabile
  // dell'azione, in un ordine qualsiasi — non l'intera query come un'unica sottostringa contigua.
  // Altrimenti "creazione cliente" non troverebbe mai "+ Nuovo cliente" (il cui testo cercabile
  // contiene "creazione" e "cliente" separati da altre parole, non uno accanto all'altro).
  const parole = q.split(/\s+/).filter(Boolean);
  return tutte.filter(a => {
    const testo = `${a.titolo} ${a.sottotitolo || ''} ${a.categoria} ${a.parole}`.toLowerCase();
    return parole.every(p => testo.includes(p));
  });
}

function generaListaAzioniHTML(risultati) {
  if (risultati.length === 0) {
    return `<div class="empty" style="padding:24px 4px;">Nessuna funzione trovata per "${escapeHtml(AZIONI_QUERY)}". Prova un'altra parola chiave.</div>`;
  }
  const perCategoria = new Map();
  risultati.forEach((r, idx) => { r._idx = idx; if (!perCategoria.has(r.categoria)) perCategoria.set(r.categoria, []); perCategoria.get(r.categoria).push(r); });
  return Array.from(perCategoria.entries()).map(([cat, righe]) => `
    <div style="font-size:11px;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.03em;margin:14px 2px 6px;">${escapeHtml(cat)}</div>
    ${righe.map(r => `<div class="client-row" data-action="azioni-apri" data-idx="${r._idx}" style="cursor:pointer;margin-bottom:4px;">
      <div><div class="name">${escapeHtml(r.titolo)}</div><div class="meta">${escapeHtml(r.sottotitolo || '')}</div></div>
    </div>`).join('')}
  `).join('');
}

function renderAzioni() {
  AZIONI_RISULTATI = risultatiAzioni(AZIONI_QUERY);
  return `
  <div class="card">
    <input id="azioniInput" type="text" placeholder="Es. &quot;creazione cliente&quot;, &quot;nuovo task&quot;, &quot;password&quot;, &quot;backup&quot;..." value="${escapeHtml(AZIONI_QUERY)}" style="width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:14.5px;box-sizing:border-box;" data-action="azioni-input" autocomplete="off">
    <div class="helptext" style="margin-top:8px;">Digita una parola chiave per trovare una funzione, oppure sfoglia l'elenco qui sotto. Cliccando su una voce vai dritto lì.</div>
    <div id="azioniResults" style="margin-top:6px;">${generaListaAzioniHTML(AZIONI_RISULTATI)}</div>
  </div>`;
}

/* Aggiorna SOLO il contenitore dei risultati, senza toccare l'input: stesso motivo di
   aggiornaRisultatiRicerca() sopra — rifare l'intero tab ad ogni tasto premuto farebbe perdere il focus. */
function aggiornaRisultatiAzioni() {
  const el = document.getElementById('azioniResults');
  if (!el) return;
  AZIONI_RISULTATI = risultatiAzioni(AZIONI_QUERY);
  el.innerHTML = generaListaAzioniHTML(AZIONI_RISULTATI);
}

/* -------------------- RENDER: CLIENTI -------------------- */
let CLI_FILTRO = { q: '', regime: 'Tutti', resp: 'Tutti', mostraCessati: false };

function renderClienti() {
  const f = CLI_FILTRO;
  let lista = STATE.clienti.filter(c => {
    if (!f.mostraCessati && c.stato === 'cessato') return false;
    if (f.regime !== 'Tutti' && c.regimeFiscale !== f.regime) return false;
    if (f.resp !== 'Tutti' && c.responsabileStudio !== f.resp) return false;
    if (f.q && !c.ragioneSociale.toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  }).sort((a,b) => a.ragioneSociale.localeCompare(b.ragioneSociale));

  const attivi = STATE.clienti.filter(c => c.stato !== 'cessato').length;

  const toolbar = `<div class="toolbar">
    <div class="field grow"><label>Cerca</label><input type="text" placeholder="Nome o ragione sociale..." value="${escapeHtml(f.q)}" data-action="cli-filtro-q"></div>
    <div class="field"><label>Regime fiscale</label><select data-action="cli-filtro-regime">
      <option ${f.regime==='Tutti'?'selected':''}>Tutti</option>
      ${REGIMI_FISCALI.map(r=>`<option ${f.regime===r?'selected':''}>${r}</option>`).join('')}
    </select></div>
    <div class="field"><label>Responsabile</label><select data-action="cli-filtro-resp">
      <option ${f.resp==='Tutti'?'selected':''}>Tutti</option>
      ${STATE.meta.responsabili.map(r=>`<option ${f.resp===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
    </select></div>
    <div class="field" style="min-width:max-content;"><label>&nbsp;</label><label class="checkline" style="white-space:nowrap;"><input type="checkbox" data-action="cli-filtro-cessati" ${f.mostraCessati?'checked':''}> Mostra cessati</label></div>
    <div class="field" style="margin-left:auto;"><label>&nbsp;</label><button class="btn primary" data-action="nuovo-cliente">+ Nuovo cliente</button></div>
  </div>`;

  const toolbarImport = `<div class="toolbar" style="margin-top:-10px;">
    <div class="field"><label>&nbsp;</label><button class="btn small" data-action="scarica-template-clienti">⬇ Scarica template Excel</button></div>
    <div class="field"><label>&nbsp;</label><label class="btn small" style="margin:0;">⬆ Importa clienti (Excel/CSV)<input type="file" accept=".csv,.xlsx,.xls" style="display:none;" data-action="importa-clienti-file"></label></div>
    <div class="field grow"><label>&nbsp;</label><div class="helptext">Il template ha una seconda scheda con i valori ammessi per ogni colonna. I clienti già presenti (stessa Partita IVA o stesso Codice Fiscale) vengono riconosciuti e saltati, non duplicati.</div></div>
  </div>`;

  const header = `<div class="section-title">Clienti <span class="cnt">${attivi} attivi · ${lista.length} mostrati</span></div>`;

  if (lista.length === 0) {
    return toolbar + toolbarImport + `<div class="card"><div class="empty"><div class="big">Nessun cliente trovato</div>Prova a cambiare i filtri, oppure aggiungi un nuovo cliente.</div></div>`;
  }

  const pag = paginaLista('clienti', lista);
  const righe = pag.pagina.map(c => {
    const pct = percentualeOnboarding(STATE.onboarding[c.id]);
    return `<div class="client-row" data-action="apri-cliente" data-id="${c.id}">
      <div>
        <div class="name">${escapeHtml(c.ragioneSociale)} ${c.stato==='cessato'?'<span class="badge cessato">CESSATO</span>':''}</div>
        <div class="meta">${escapeHtml(c.regimeFiscale||'—')} · Resp. ${escapeHtml(c.responsabileStudio||'—')} ${c.partitaIva?'· P.IVA '+escapeHtml(c.partitaIva):''} ${c.settore?'· '+escapeHtml(c.settore):''}</div>
      </div>
      <div class="right">
        <div style="text-align:right;">
          <div class="helptext">Onboarding</div>
          <div style="font-weight:700;font-size:13px;">${pct}%</div>
        </div>
        <div style="width:90px;"><div class="progress"><div style="width:${pct}%"></div></div></div>
        <button class="btn small" data-action="modifica-cliente" data-id="${c.id}">Modifica</button>
      </div>
    </div>`;
  }).join('');

  return toolbar + toolbarImport + header + righe + controlliPaginazione(pag);
}

/* -------------------- RENDER: RUBRICA (task #135) --------------------
   Vista dedicata di sola consultazione: non ha un proprio STATE, legge i contatti già presenti
   su STATE.clienti.contatti (email, email amministrazione, PEC, telefono, indirizzo) - lo scopo è
   trovare in fretta un recapito senza aprire la scheda cliente, non duplicare l'anagrafica. */
let RUBRICA_FILTRO = { q: '' };

function renderRubrica() {
  const q = (RUBRICA_FILTRO.q || '').trim().toLowerCase();
  let lista = STATE.clienti.filter(c => c.stato !== 'cessato').slice().sort((a,b) => a.ragioneSociale.localeCompare(b.ragioneSociale));
  if (q) {
    lista = lista.filter(c => {
      const co = c.contatti || {};
      const testo = [c.ragioneSociale, co.email, co.emailAmministrazione, co.pec, co.telefono, co.localita, c.responsabileStudio].filter(Boolean).join(' ').toLowerCase();
      return testo.includes(q);
    });
  }

  const toolbar = `<div class="toolbar">
    <div class="field grow"><label>Cerca</label><input type="text" placeholder="Nome, email, telefono, città..." value="${escapeHtml(RUBRICA_FILTRO.q)}" data-action="rubrica-filtro-q"></div>
  </div>`;

  const header = `<div class="section-title">Rubrica <span class="cnt">${lista.length} contatti</span></div>`;

  if (lista.length === 0) {
    return toolbar + `<div class="card"><div class="empty"><div class="big">Nessun contatto trovato</div>${STATE.clienti.length===0 ? 'Aggiungi prima qualche cliente in Anagrafiche.' : 'Prova a cambiare la ricerca.'}</div></div>`;
  }

  const pag = paginaLista('rubrica', lista);
  const righe = pag.pagina.map(c => {
    const co = c.contatti || {};
    const recapiti = [
      co.email ? `<a href="mailto:${escapeHtml(co.email)}" title="Email">✉ ${escapeHtml(co.email)}</a>` : '',
      co.emailAmministrazione ? `<a href="mailto:${escapeHtml(co.emailAmministrazione)}" title="Email amministrazione">✉ ${escapeHtml(co.emailAmministrazione)} <span class="helptext" style="display:inline;">(amm.)</span></a>` : '',
      co.pec ? `<a href="mailto:${escapeHtml(co.pec)}" title="PEC">✉ ${escapeHtml(co.pec)} <span class="helptext" style="display:inline;">(PEC)</span></a>` : '',
      co.telefono ? `<a href="tel:${escapeHtml(co.telefono)}" title="Telefono">☎ ${escapeHtml(co.telefono)}</a>` : '',
    ].filter(Boolean).join('<br>');
    const copiaTesto = [co.email, co.telefono].filter(Boolean).join(' · ');
    return `<div class="client-row" style="cursor:default;">
      <div>
        <div class="name" style="cursor:pointer;" data-action="apri-cliente" data-id="${c.id}">${escapeHtml(c.ragioneSociale)}</div>
        <div class="meta">${escapeHtml(co.localita || '—')}${c.responsabileStudio ? ' · Resp. ' + escapeHtml(c.responsabileStudio) : ''}</div>
      </div>
      <div class="right" style="align-items:flex-start;">
        <div style="font-size:13px;line-height:1.7;text-align:right;">${recapiti || '<span class="helptext">Nessun recapito in anagrafica</span>'}</div>
        <div style="display:flex;gap:8px;">
          ${copiaTesto ? `<button class="btn small ghost" data-action="rubrica-copia" data-testo="${escapeHtml(copiaTesto)}">Copia</button>` : ''}
          <button class="btn small" data-action="modifica-cliente" data-id="${c.id}">✎ Modifica</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return toolbar + header + righe + controlliPaginazione(pag);
}

/* -------------------- RENDER: SCHEDA CLIENTE (vista 360°) --------------------
   Il punto di questa pagina: invece di dover girare tra Scadenze, Task, Comunicazioni,
   Contabilità e Bilanci per capire "a che punto siamo con questo cliente", tutto quello
   che lo riguarda è qui in un colpo d'occhio, con collegamenti rapidi alle viste complete
   già filtrate su di lui. */
let SCHEDA_CLIENTE = null;

function renderSchedaCliente() {
  if (VIEW_PARAMS.clienteId) { SCHEDA_CLIENTE = VIEW_PARAMS.clienteId; VIEW_PARAMS = {}; }
  const tutti = STATE.clienti.slice().sort((a,b)=>a.ragioneSociale.localeCompare(b.ragioneSociale));
  if (tutti.length === 0) return `<div class="card"><div class="empty"><div class="big">Nessun cliente in anagrafica</div>Aggiungi il primo cliente per vedere qui la sua scheda completa.</div></div>`;
  if (!SCHEDA_CLIENTE || !tutti.find(c=>c.id===SCHEDA_CLIENTE)) SCHEDA_CLIENTE = tutti[0].id;
  const cliente = clienteById(SCHEDA_CLIENTE);

  const toolbar = `<div class="toolbar">
    <div class="field grow"><label>Cliente</label><select data-action="schcli-seleziona-cliente">
      ${tutti.map(c=>`<option value="${c.id}" ${c.id===SCHEDA_CLIENTE?'selected':''}>${escapeHtml(c.ragioneSociale)}${c.stato==='cessato'?' (cessato)':''}</option>`).join('')}
    </select></div>
    <div class="field"><label>&nbsp;</label><button class="btn small" data-action="modifica-cliente" data-id="${cliente.id}">✎ Modifica anagrafica</button></div>
  </div>`;

  const contatti = cliente.contatti || {};
  const header = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <div>
        <div style="font-size:19px;font-weight:800;">${escapeHtml(cliente.ragioneSociale)} ${cliente.stato==='cessato'?'<span class="badge cessato">CESSATO</span>':''}</div>
        <div class="helptext" style="margin-top:4px;">${escapeHtml(cliente.regimeFiscale||'—')} · ${escapeHtml(labelTipoCliente(cliente.tipo))}${cliente.partitaIva?' · P.IVA '+escapeHtml(cliente.partitaIva):''}${cliente.codiceFiscale?' · CF '+escapeHtml(cliente.codiceFiscale):''}</div>
        <div class="helptext" style="margin-top:2px;">Resp. studio: ${escapeHtml(cliente.responsabileStudio||'—')}${cliente.settore?' · Settore '+escapeHtml(cliente.settore):''}${cliente.annoIngresso?' · Cliente dal '+cliente.annoIngresso:''}</div>
        ${(cliente.atecoCodici||[]).length ? `<div class="helptext" style="margin-top:2px;">ATECO: ${(cliente.atecoCodici||[]).map(a=>escapeHtml(a)).join(', ')}</div>` : ''}
        ${(contatti.email||contatti.telefono||contatti.pec) ? `<div class="helptext" style="margin-top:2px;">${contatti.email?escapeHtml(contatti.email):''}${contatti.telefono?' · '+escapeHtml(contatti.telefono):''}${contatti.pec?' · PEC '+escapeHtml(contatti.pec):''}</div>` : ''}
      </div>
      <div style="display:flex;gap:22px;">
        <div style="text-align:right;">
          <div class="helptext">Onboarding</div>
          <div style="font-weight:800;font-size:20px;">${percentualeOnboarding(STATE.onboarding[cliente.id])}%</div>
          <button class="btn small" style="margin-top:6px;" data-action="schcli-apri-onboarding" data-cliente="${cliente.id}">Vai →</button>
        </div>
        <div style="text-align:right;">
          <div class="helptext">Antiriciclaggio</div>
          <div style="font-weight:800;font-size:20px;">${percentualeAntiriciclaggio(STATE.antiriciclaggio[cliente.id])}%</div>
          <button class="btn small" style="margin-top:6px;" data-action="schcli-apri-aml" data-cliente="${cliente.id}">Vai →</button>
        </div>
      </div>
    </div>
  </div>`;

  const { tutteScadenze, annuali } = derivati();
  const scadenzeCliente = tutteScadenze.filter(s => s.clienteId === cliente.id);
  const { scaduti, inScadenza, futuri, completati } = classificaScadenze(scadenzeCliente, oggiISO());
  const kpiScadenze = `<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
    <div class="kpi scaduti" data-action="schcli-apri-scadenze" data-cliente="${cliente.id}" data-filtro="scaduti"><div class="n">${scaduti.length}</div><div class="l">SCADUTI</div></div>
    <div class="kpi inscadenza" data-action="schcli-apri-scadenze" data-cliente="${cliente.id}" data-filtro="inscadenza"><div class="n">${inScadenza.length}</div><div class="l">IN SCADENZA</div></div>
    <div class="kpi futuri" data-action="schcli-apri-scadenze" data-cliente="${cliente.id}" data-filtro="futuri"><div class="n">${futuri.length}</div><div class="l">FUTURI</div></div>
    <div class="kpi completati" data-action="schcli-apri-scadenze" data-cliente="${cliente.id}" data-filtro="completati"><div class="n">${completati.length}</div><div class="l">COMPLETATI</div></div>
  </div>`;
  const prossime = scaduti.concat(inScadenza).concat(futuri).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,5);
  const rigaScadenzaCliente = (s) => {
    const d = deltaLabel(s.data);
    return `<tr><td>${fmtDataBreve(s.data)}</td><td>${escapeHtml(s.nome)}</td><td><span class="pill-delta ${d.cls}">${d.txt}</span></td><td><span class="badge ${statoBadgeClass(s.stato)}">${escapeHtml(s.stato)}</span></td></tr>`;
  };
  const sezScadenze = `<div class="card">
    <div class="section-title">Scadenze <span class="cnt">${scadenzeCliente.length} totali</span></div>
    ${kpiScadenze}
    ${prossime.length ? `<table style="margin-top:12px;"><thead><tr><th>Data</th><th>Adempimento</th><th>Tra</th><th>Stato</th></tr></thead><tbody>${prossime.map(rigaScadenzaCliente).join('')}</tbody></table>` : '<div class="empty" style="margin-top:8px;">Nessuna scadenza aperta per questo cliente.</div>'}
    <div style="margin-top:10px;"><button class="btn small" data-action="schcli-apri-scadenze" data-cliente="${cliente.id}" data-filtro="tutti">Vedi tutte le scadenze →</button></div>
  </div>`;

  const annualiCliente = annuali.filter(a => a.clienteId === cliente.id);
  const annualiIncompleti = annualiCliente.filter(a => !a.completato);
  const sezAnnuali = annualiCliente.length === 0 ? '' : `<div class="card">
    <div class="section-title">Adempimenti annuali <span class="cnt">${annualiIncompleti.length} da completare</span></div>
    ${annualiIncompleti.length ? annualiIncompleti.map(a => `
      <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
        <div style="flex:1;font-weight:600;font-size:13px;">${escapeHtml(a.tipoNome)}</div>
        <div style="width:120px;"><div class="progress"><div style="width:${a.percentuale}%"></div></div></div>
        <div style="width:38px;text-align:right;font-weight:700;font-size:12.5px;">${a.percentuale}%</div>
      </div>`).join('') : '<div class="empty">Tutto completato per quest\'anno.</div>'}
    <div style="margin-top:10px;"><button class="btn small" data-action="nav" data-nav="annuali">Vai agli adempimenti annuali →</button></div>
  </div>`;

  const taskCliente = STATE.taskTeam.filter(t => t.clienteId === cliente.id);
  const taskAperti = taskCliente.filter(t => t.stato !== 'Fatto').sort((a,b)=>(a.scadenza||'9999').localeCompare(b.scadenza||'9999'));
  const sezTask = `<div class="card">
    <div class="section-title">Task team <span class="cnt">${taskAperti.length} aperti</span></div>
    ${taskAperti.length ? taskAperti.slice(0,5).map(t => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" data-action="modifica-task-team" data-id="${t.id}">
        <div style="flex:1;">
          <div style="font-weight:600;font-size:13px;">${escapeHtml(t.titolo)} ${taskInRitardo(t)?'<span class="pill-delta scaduto">In ritardo</span>':''}</div>
          <div class="helptext">${escapeHtml(t.assegnatoA)}${t.scadenza?' · '+fmtDataBreve(t.scadenza):''}</div>
        </div>
      </div>`).join('') : '<div class="empty">Nessun task aperto per questo cliente.</div>'}
    <div style="margin-top:10px;display:flex;gap:10px;">
      <button class="btn small primary" data-action="nuovo-task-team" data-cliente="${cliente.id}">+ Nuovo task</button>
      <button class="btn small" data-action="schcli-apri-task" data-cliente="${cliente.id}">Vedi tutti →</button>
    </div>
  </div>`;

  const comCliente = STATE.comunicazioni.filter(c => c.clienteId === cliente.id).sort((a,b)=>b.data.localeCompare(a.data));
  const sezCom = `<div class="card">
    <div class="section-title">Comunicazioni <span class="cnt">${comCliente.length} totali</span></div>
    ${comCliente.length ? comCliente.slice(0,3).map(c => `
      <div style="padding:8px 0;border-bottom:1px solid var(--border);">
        <div style="font-weight:600;font-size:13px;">${escapeHtml(c.oggetto)}</div>
        <div class="helptext">${fmtDataBreve(c.data)} · <span class="badge info">${escapeHtml(categoriaComunicazione(c))}</span> · ${escapeHtml(c.stato)}</div>
      </div>`).join('') : '<div class="empty">Nessuna comunicazione ancora inviata a questo cliente.</div>'}
    <div style="margin-top:10px;display:flex;gap:10px;">
      <button class="btn small primary" data-action="nuova-comunicazione" data-cliente="${cliente.id}">+ Nuova comunicazione</button>
      <button class="btn small" data-action="schcli-apri-comunicazioni" data-cliente="${cliente.id}">Vedi tutte →</button>
    </div>
  </div>`;

  const statoContab = statoAggiornamentoDocumenti(cliente.id);
  const sezContab = `<div class="card">
    <div class="section-title">Contabilità</div>
    ${statoContab.length ? `<div class="kpi-grid" style="grid-template-columns:repeat(auto-fill, minmax(160px,1fr));">
      ${statoContab.map(s => `<div class="kpi completati"><div class="n" style="font-size:14px;">${escapeHtml(s.data)}</div><div class="l">${escapeHtml(s.etichetta)}</div></div>`).join('')}
    </div>` : '<div class="empty">Nessun documento contabile ancora registrato per questo cliente.</div>'}
    <div style="margin-top:10px;"><button class="btn small" data-action="schcli-apri-contabilita" data-cliente="${cliente.id}">Apri Contabilità →</button></div>
  </div>`;

  const anniBil = anniBilancioCliente(cliente.id);
  let sezBilanci;
  if (anniBil.length === 0) {
    sezBilanci = `<div class="card"><div class="section-title">Bilanci & KPI</div><div class="empty">Nessun bilancio caricato per questo cliente.</div>
      <div style="margin-top:10px;"><button class="btn small" data-action="schcli-apri-bilanci" data-cliente="${cliente.id}">Apri Bilanci & KPI →</button></div>
    </div>`;
  } else {
    const ultimoAnno = anniBil[anniBil.length-1];
    const d = calcolaDerivatiBilancio(STATE.bilanci[cliente.id][ultimoAnno]);
    sezBilanci = `<div class="card">
      <div class="section-title">Bilanci & KPI <span class="cnt">${escapeHtml(etichettaEstesaBilancio(ultimoAnno))}</span></div>
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="kpi completati"><div class="n" style="font-size:18px;">${fmtEuro(d.ricavi)}</div><div class="l">Ricavi</div></div>
        <div class="kpi completati"><div class="n" style="font-size:18px;">${fmtPct(d.roe)}</div><div class="l">ROE</div></div>
        <div class="kpi completati"><div class="n" style="font-size:18px;">${fmtPct(d.roi)}</div><div class="l">ROI</div></div>
        <div class="kpi completati"><div class="n" style="font-size:18px;">${fmtPct(d.ebitdaMargin)}</div><div class="l">EBITDA margin</div></div>
      </div>
      <div style="margin-top:10px;"><button class="btn small" data-action="schcli-apri-bilanci" data-cliente="${cliente.id}">Apri Bilanci & KPI →</button></div>
    </div>`;
  }

  const docCliente = STATE.documenti.filter(d => d.clienteId === cliente.id);
  const docScaduti = docCliente.filter(d => d.dataScadenza && giorniTra(oggiISO(), d.dataScadenza) < 0).length;
  const docInScadenza = docCliente.filter(d => d.dataScadenza && giorniTra(oggiISO(), d.dataScadenza) >= 0 && giorniTra(oggiISO(), d.dataScadenza) <= 30).length;
  const sezDoc = `<div class="card">
    <div class="section-title">Documenti <span class="cnt">${docCliente.length} totali</span></div>
    ${docCliente.length ? `<div class="helptext">${docScaduti} scaduti · ${docInScadenza} in scadenza nei prossimi 30 giorni</div>` : '<div class="empty">Nessun documento tracciato per questo cliente.</div>'}
    <div style="margin-top:10px;display:flex;gap:10px;">
      <button class="btn small" data-action="schcli-apri-documenti" data-cliente="${cliente.id}">Apri Documenti →</button>
      <button class="btn small" data-action="schcli-apri-portale" data-cliente="${cliente.id}">Anteprima Portale cliente →</button>
    </div>
  </div>`;

  const sociCliente = sociDiCliente(cliente.id);
  const sezSoci = `<div class="card">
    <div class="section-title">Soci e referenti <span class="cnt">${sociCliente.length} collegati</span></div>
    ${sociCliente.length ? sociCliente.map(s => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" data-action="modifica-socio" data-id="${s.id}">
        <div style="flex:1;">
          <div style="font-weight:600;font-size:13px;">${escapeHtml(s.nome)}${s.ruolo?' · '+escapeHtml(s.ruolo):''}</div>
          <div class="helptext">${escapeHtml(s.email||'')}${s.email&&s.telefono?' · ':''}${escapeHtml(s.telefono||'')}${(s.clienteIds||[]).length>1?' · collegato ad altri '+((s.clienteIds.length)-1)+' clienti':''}</div>
        </div>
      </div>`).join('') : '<div class="empty">Nessun socio o referente collegato a questo cliente.</div>'}
    <div style="margin-top:10px;"><button class="btn small primary" data-action="nuovo-socio">+ Nuovo socio/referente</button></div>
  </div>`;

  const f24Cliente = (STATE.f24||[]).filter(f => f.clienteId === cliente.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const sezF24 = `<div class="card">
    <div class="section-title">F24 <span class="cnt">${f24Cliente.length} registrati</span></div>
    ${f24Cliente.length ? `<table><thead><tr><th>Data</th><th>Tipo</th><th>Importo</th><th>Descrizione</th></tr></thead><tbody>${f24Cliente.slice(0,5).map(f=>`<tr><td>${fmtDataBreve(f.data)}</td><td><span class="badge ${f.tipo==='Debito'?'stato-errore':'stato-inviato-telematicamente'}">${f.tipo}</span></td><td>${fmtEuro(f.importo)}</td><td>${escapeHtml(f.descrizione||'')}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nessun F24 registrato per questo cliente.</div>'}
    <div style="margin-top:10px;"><button class="btn small" data-action="nav" data-nav="f24">Apri F24 →</button></div>
  </div>`;

  return toolbar + header + sezScadenze + sezAnnuali + sezTask + sezCom + sezContab + sezBilanci + sezDoc + sezSoci + sezF24;
}

/* Adempimenti "applicabili" in anagrafica cliente: uniscono in un'unica lista, raggruppata
   per tipo (imposte dirette/indirette, contabili, ecc. — vedi TIPI_ADEMPIMENTO), sia le voci
   periodiche (checkbox data-flag, generano scadenze puntuali ogni mese/trimestre/anno) sia le
   voci annuali con avanzamento a sotto-task (checkbox data-annuale). Prima erano due fieldset
   separati e non organizzati per tipo. */
function itemsPeriodiciPerAnagrafica(cliente) {
  const custom = (STATE.catalogoPeriodico || []).filter(t => t.personalizzato && t.attivo !== false);
  const out = FLAG_SEMPLICI.map(k => ({
    tipo: tipoFlagPeriodico(k),
    checked: !!(cliente.flags && cliente.flags[k]),
    html: `<label class="checkline"><input type="checkbox" data-flag="${k}" ${cliente.flags && cliente.flags[k] ? 'checked':''}> ${escapeHtml(FLAG_LABELS[k])}</label>`,
  }));
  // Nota: "Diritto camerale" non ha più un checkbox periodico dedicato — è applicabile tramite
  // il checkbox annuale DIRITTO_CAMERALE (in itemsAnnualiPerAnagrafica), la cui scadenza viene
  // comunque calcolata dalla "data scelta dal cliente" qui sotto (SCADENZA_DINAMICA_ANNUALE).
  custom.forEach(t => out.push({
    tipo: tipoFlagPeriodico(t.flag),
    checked: !!(cliente.flags && cliente.flags[t.flag]),
    html: `<label class="checkline"><input type="checkbox" data-flag="${t.flag}" ${cliente.flags && cliente.flags[t.flag] ? 'checked':''}> ${escapeHtml(t.nome)} <span class="helptext">(personalizzata)</span></label>`,
  }));
  return out;
}
function itemsAnnualiPerAnagrafica(cliente) {
  const attive = catalogoAnnualeAttivo();
  const selezionate = cliente.adempimentiAnnualiApplicabili || [];
  const extra = catalogoAnnualeTutti().filter(a => a.attivo === false && selezionate.includes(a.chiave));
  return attive.concat(extra).map(a => ({
    tipo: a.tipo || TIPO_ADEMPIMENTO_DEFAULT,
    checked: selezionate.includes(a.chiave),
    html: `<label class="checkline"><input type="checkbox" data-annuale="${a.chiave}" ${selezionate.includes(a.chiave)?'checked':''}> ${escapeHtml(a.nome)}${a.attivo===false?' <span class="helptext">(disattivato)</span>':''}</label>`,
  }));
}
/* Adempimenti applicabili: raggruppati per categoria fiscale (TIPI_ADEMPIMENTO) e, dentro ogni
   categoria, separati in due sotto-sezioni — "Ricorrenti" (flag periodici: mensili/trimestrali)
   e "Annuali" (dichiarazioni/adempimenti con workflow a più passaggi) — perché sono due cose
   concettualmente diverse anche se condividono la stessa categoria fiscale (es. in "Imposte
   indirette" convivono la Liquidazione IVA mensile, ricorrente, e la Dichiarazione IVA annuale,
   con i suoi 7 step). Ogni categoria mostra anche un conteggio "N selezionati" per capire a
   colpo d'occhio la copertura senza dover leggere ogni singola voce. */
function renderAdempimentiApplicabili(cliente) {
  const periodici = itemsPeriodiciPerAnagrafica(cliente);
  const annuali = itemsAnnualiPerAnagrafica(cliente);
  const perTipo = new Map();
  TIPI_ADEMPIMENTO.forEach(t => perTipo.set(t, { periodici: [], annuali: [] }));
  const metti = (it, chiave) => {
    const tipo = perTipo.has(it.tipo) ? it.tipo : TIPO_ADEMPIMENTO_DEFAULT;
    perTipo.get(tipo)[chiave].push(it);
  };
  periodici.forEach(it => metti(it, 'periodici'));
  annuali.forEach(it => metti(it, 'annuali'));
  const gruppi = Array.from(perTipo.entries()).filter(([, g]) => g.periodici.length || g.annuali.length);
  const sottosezione = (titolo, items) => !items.length ? '' : `
          <div class="adm-sotto-titolo">${titolo} <span class="adm-sotto-cnt">${items.filter(i=>i.checked).length}/${items.length}</span></div>
          <div class="chk-grid">${items.map(i=>i.html).join('')}</div>`;
  return `
    <fieldset>
      <legend>Adempimenti applicabili</legend>
      <div class="helptext" style="margin:-4px 0 12px 0;">Spunta solo ciò che riguarda questo cliente: genera automaticamente le rispettive scadenze. Raggruppati per area fiscale; dentro ogni area, prima le voci ricorrenti (mensili/trimestrali) e poi quelle annuali con workflow a più passaggi.</div>
      ${gruppi.map(([tipo, g]) => {
        const tot = g.periodici.length + g.annuali.length;
        const sel = g.periodici.filter(i=>i.checked).length + g.annuali.filter(i=>i.checked).length;
        return `
        <div class="adm-gruppo">
          <div class="adm-gruppo-titolo">${escapeHtml(tipo)} <span class="adm-gruppo-cnt">${sel}/${tot} selezionati</span></div>
          ${sottosezione('Ricorrenti', g.periodici)}
          ${sottosezione('Annuali', g.annuali)}
        </div>`;
      }).join('')}
    </fieldset>
    <fieldset>
      <legend>Date specifiche per cliente</legend>
      <div class="field">
        <label>Diritto camerale — data scelta dal cliente</label>
        <select id="selDirittoCamScelta">
          <option value="">— nessuna —</option>
          ${SCELTE_DIRITTO_CAMERALE.map(s => `<option ${cliente.dirittoCameraleScelta===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
        </select>
        <div class="helptext">Usata per calcolare in automatico la scadenza dell'adempimento annuale "Diritto camerale" (sopra), se selezionato.</div>
      </div>
      <div class="field" style="margin-top:10px;">
        <label>Saldo/acconto imposte sui redditi — termine di versamento</label>
        <select id="selVersamentoImposteScelta">
          <option value="">— non applicabile —</option>
          ${SCELTE_VERSAMENTO_IMPOSTE.map(s => `<option ${cliente.versamentoImposteScelta===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
        </select>
        <div class="helptext">Genera anche "II acconto imposte sui redditi" (30/11) e, se applicabile, INPS Artig/Comm eccedente e INPS Gestione Separata alla stessa data.</div>
      </div>
    </fieldset>`;
}

function modalCliente(clienteId) {
  const editing = !!clienteId;
  const c = editing ? clienteById(clienteId) : {
    id: uid('cli'), tipo: 'societa_capitali', ragioneSociale: '', codiceFiscale: '', partitaIva: '', atecoCodici: [], naturaGiuridica: '',
    regimeFiscale: 'Ordinario', contatti: { pec: '' }, responsabileStudio: STATE.meta.responsabili[0] || '',
    addebitoF24: 'NOI', contabilita: 'ESTERNA', stato: 'attivo',
    periodicitaIva: 'Mensile', periodicitaIntrastat: 'N.A.', previdenza: 'No previdenza',
    flags: {}, dirittoCameraleScelta: null, versamentoImposteScelta: SCELTE_VERSAMENTO_IMPOSTE[1], adempimentiAnnualiApplicabili: [], note: '',
    settore: '', annoIngresso: new Date().getFullYear(), canaleAcquisizione: '', preventivoAnnuo: '',
  };
  const contatti = c.contatti || {};

  const html = `<div class="modal-backdrop" data-action="chiudi-modal-backdrop">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><h2>${editing?'Modifica cliente':'Nuovo cliente'}</h2><div class="modal-sub">Compila i dati anagrafici e i flag fiscali: generano automaticamente le scadenze.</div></div>
        <button class="icon-x" data-action="chiudi-modal" title="Chiudi">✕</button>
      </div>

      <form id="formCliente" data-id="${c.id}" onsubmit="return false;">
        <fieldset>

  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  // I contatori "N/M selezionati" per gruppo/sotto-sezione sono calcolati solo al render del
  // modale: senza questo listener resterebbero fermi allo stato di apertura mentre l'utente
  // spunta/togli le voci, mostrando numeri sbagliati fino al prossimo salvataggio. Aggiorna solo
  // il testo dei contatori coinvolti, senza toccare il resto del DOM (niente perdita di focus).
  const formEl = document.getElementById('formCliente');
  if (formEl) formEl.addEventListener('change', e => {
    if (e.target.matches('[data-flag], [data-annuale]')) aggiornaContatoriAdempimenti(formEl);
  });
}
function aggiornaContatoriAdempimenti(root) {
  root.querySelectorAll('.adm-gruppo').forEach(gruppo => {
    let selTot = 0, tot = 0;
    gruppo.querySelectorAll('.adm-sotto-titolo').forEach(titolo => {
      const wrap = titolo.nextElementSibling;
      const boxes = wrap ? wrap.querySelectorAll('input[type="checkbox"]') : [];
      const sel = Array.from(boxes).filter(b => b.checked).length;
      const cntEl = titolo.querySelector('.adm-sotto-cnt');
      if (cntEl) cntEl.textContent = `${sel}/${boxes.length}`;
      selTot += sel; tot += boxes.length;
    });
    const gruppoCnt = gruppo.querySelector('.adm-gruppo-cnt');
    if (gruppoCnt) gruppoCnt.textContent = `${selTot}/${tot} selezionati`;
  });
}

/* -------------------- IMPORT/EXPORT CLIENTI DA EXCEL/CSV --------------------
   Permette di caricare tanti clienti in un colpo solo (es. all'avvio, o dopo aver esportato
   l'anagrafica da un altro gestionale) invece di crearli uno per uno dal form. Il template
   scaricabile ha una seconda scheda con i valori ammessi per ogni colonna, così chi lo compila
   sa esattamente cosa scrivere. In import, i valori non riconosciuti non bloccano la riga: viene
   usato un default sensato e l'utente viene avvisato a fine importazione, così non si perde mai
   una riga per un piccolo errore di battitura. */
const COLONNE_IMPORT_CLIENTI = [
  { intestazione: 'Tipo', chiave: 'tipo' },
  { intestazione: 'Ragione sociale / Nome', chiave: 'ragioneSociale' },
  { intestazione: 'Codice fiscale', chiave: 'codiceFiscale' },
  { intestazione: 'Partita IVA', chiave: 'partitaIva' },
  { intestazione: 'Regime fiscale', chiave: 'regimeFiscale' },
  { intestazione: 'Periodicità IVA', chiave: 'periodicitaIva' },
  { intestazione: 'Responsabile studio', chiave: 'responsabileStudio' },
  { intestazione: 'Tenuta contabilità', chiave: 'contabilita' },
  { intestazione: 'Addebito F24', chiave: 'addebitoF24' },
  { intestazione: 'Previdenza', chiave: 'previdenza' },
  { intestazione: 'Email', chiave: 'email' },
  { intestazione: 'PEC', chiave: 'pec' },
  { intestazione: 'Telefono', chiave: 'telefono' },
  { intestazione: 'Indirizzo', chiave: 'indirizzo' },
  { intestazione: 'CAP', chiave: 'cap' },
  { intestazione: 'Località', chiave: 'localita' },
  { intestazione: 'Provincia', chiave: 'provincia' },
  { intestazione: 'Attività / Settore', chiave: 'settore' },
  { intestazione: 'Codici ATECO', chiave: 'ateco' },
  { intestazione: 'Note', chiave: 'note' },
];

function trovaColonnaImport(headerRow, intestazioneAttesa) {
  const norm = s => String(s || '').trim().toLowerCase();
  const target = norm(intestazioneAttesa);
  return (headerRow || []).findIndex(h => norm(h) === target);
}

async function scaricaTemplateClienti() {
  const esempio = {
    tipo: labelTipoCliente('societa_capitali'), ragioneSociale: 'Esempio Impianti SRL',
    codiceFiscale: '01234567890', partitaIva: '01234567890', regimeFiscale: 'Ordinario',
    periodicitaIva: 'Mensile', responsabileStudio: STATE.meta.responsabili[0] || 'Matteo',
    contabilita: (SCELTE_CONTABILITA.find(o => o.v === 'ESTERNA') || {}).l || 'Esterna',
    addebitoF24: (SCELTE_ADDEBITO_F24.find(o => o.v === 'NOI') || {}).l || 'Noi (studio)',
    previdenza: 'No previdenza', email: 'info@esempio.it', pec: 'esempioimpianti@pec.it',
    telefono: '0444 123456', indirizzo: 'Via Roma 1', cap: '36100', localita: 'Vicenza', provincia: 'VI',
    settore: 'Impiantistica elettrica', ateco: '43.21.01', note: 'Riga di esempio: cancellala prima di importare',
  };
  const header = COLONNE_IMPORT_CLIENTI.map(c => c.intestazione);
  const rigaEsempio = COLONNE_IMPORT_CLIENTI.map(c => esempio[c.chiave] || '');
  const righeValoriAmmessi = [
    ['Colonna', 'Valori ammessi'],
    ['Tipo', TIPI_CLIENTE.map(t => t.l).join(' | ')],
    ['Regime fiscale', REGIMI_FISCALI.join(' | ')],
    ['Periodicità IVA', 'Mensile | Trimestrale | N.A.'],
    ['Responsabile studio', STATE.meta.responsabili.join(' | ')],
    ['Tenuta contabilità', SCELTE_CONTABILITA.map(o => o.l).join(' | ')],
    ['Addebito F24', SCELTE_ADDEBITO_F24.map(o => o.l).join(' | ')],
    ['Previdenza', PREVIDENZE.join(' | ')],
    ['', ''],
    ['Nota', 'Le colonne non riconosciute vengono ignorate. Partita IVA e Codice fiscale servono anche a evitare di importare due volte lo stesso cliente.'],
  ];

  if (typeof XLSX !== 'undefined') {
    try {
      const wb = XLSX.utils.book_new();
      const wsClienti = XLSX.utils.aoa_to_sheet([header, rigaEsempio]);
      wsClienti['!cols'] = header.map(() => ({ wch: 22 }));
      XLSX.utils.book_append_sheet(wb, wsClienti, 'Clienti da importare');
      const wsValori = XLSX.utils.aoa_to_sheet(righeValoriAmmessi);
      wsValori['!cols'] = [{ wch: 20 }, { wch: 70 }];
      XLSX.utils.book_append_sheet(wb, wsValori, 'Valori ammessi');
      const arr = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([arr], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const ok = await salvaFileScaricabile('template-clienti.xlsx', blob);
      if (ok) toast('Template Excel scaricato.');
      return;
    } catch (err) {
      console.error('Generazione template Excel non riuscita, provo il CSV', err);
    }
  }
  // Libreria Excel non disponibile (es. offline al primo caricamento): il CSV funziona comunque.
  const righeCsv = [header, rigaEsempio];
  const csv = righeCsv.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const ok = await salvaFileScaricabile('template-clienti.csv', '﻿' + csv);
  if (ok) toast('Template scaricato in CSV (l\'Excel non era disponibile in questo momento).');
}

/* Converte una singola riga del file importato in un oggetto cliente completo, con lo stesso
   shape usato da leggiFormCliente(). Non blocca mai per un valore fuori enum: usa un default
   sensato e restituisce un avviso testuale, così l'utente può correggere con calma dopo. */
function clienteDaRigaImport(valori, numeroRigaFile) {
  const warnings = [];
  const get = chiave => {
    const col = COLONNE_IMPORT_CLIENTI.find(c => c.chiave === chiave);
    const idx = col ? col.idx : -1;
    return (idx != null && idx >= 0 && valori[idx] != null) ? String(valori[idx]).trim() : '';
  };

  const ragioneSociale = get('ragioneSociale');
  if (!ragioneSociale) return { cliente: null, warnings: [`Riga ${numeroRigaFile}: manca la ragione sociale/nome, riga saltata.`] };
  const ctx = `Riga ${numeroRigaFile} (${ragioneSociale})`;

  let tipo = 'societa_capitali';
  const tipoInserito = get('tipo');
  if (tipoInserito) {
    const match = TIPI_CLIENTE.find(t => t.l.toLowerCase() === tipoInserito.toLowerCase() || t.v.toLowerCase() === tipoInserito.toLowerCase());
    if (match) tipo = match.v; else warnings.push(`${ctx}: tipo "${tipoInserito}" non riconosciuto, impostato "${labelTipoCliente('societa_capitali')}" di default.`);
  }

  let regimeFiscale = 'Ordinario';
  const regimeInserito = get('regimeFiscale');
  if (regimeInserito) {
    const match = REGIMI_FISCALI.find(r => r.toLowerCase() === regimeInserito.toLowerCase());
    if (match) regimeFiscale = match; else warnings.push(`${ctx}: regime fiscale "${regimeInserito}" non riconosciuto, impostato "Ordinario" di default.`);
  }

  let periodicitaIva = 'N.A.';
  const periodInserito = get('periodicitaIva');
  if (/^mensile$/i.test(periodInserito)) periodicitaIva = 'Mensile';
  else if (/^trimestrale$/i.test(periodInserito)) periodicitaIva = 'Trimestrale';
  else if (periodInserito && !/^n\.?a\.?$/i.test(periodInserito)) warnings.push(`${ctx}: periodicità IVA "${periodInserito}" non riconosciuta, impostata "N.A." di default.`);

  let responsabileStudio = STATE.meta.responsabili[0] || '';
  const respInserito = get('responsabileStudio');
  if (respInserito) {
    const match = STATE.meta.responsabili.find(r => r.toLowerCase() === respInserito.toLowerCase());
    if (match) responsabileStudio = match; else warnings.push(`${ctx}: responsabile "${respInserito}" non riconosciuto, impostato "${responsabileStudio}" di default.`);
  }

  let contabilita = 'ESTERNA';
  const contabInserito = get('contabilita');
  if (contabInserito) {
    const match = SCELTE_CONTABILITA.find(o => o.l.toLowerCase() === contabInserito.toLowerCase() || o.v.toLowerCase() === contabInserito.toLowerCase());
    if (match) contabilita = match.v; else warnings.push(`${ctx}: tenuta contabilità "${contabInserito}" non riconosciuta, impostata "Esterna" di default.`);
  }

  let addebitoF24 = 'NOI';
  const addInserito = get('addebitoF24');
  if (addInserito) {
    const match = SCELTE_ADDEBITO_F24.find(o => o.l.toLowerCase() === addInserito.toLowerCase() || o.v.toLowerCase() === addInserito.toLowerCase());
    if (match) addebitoF24 = match.v; else warnings.push(`${ctx}: addebito F24 "${addInserito}" non riconosciuto, impostato "Noi (studio)" di default.`);
  }

  let previdenza = 'No previdenza';
  const prevInserito = get('previdenza');
  if (prevInserito) {
    const match = PREVIDENZE.find(p => p.toLowerCase() === prevInserito.toLowerCase());
    if (match) previdenza = match; else warnings.push(`${ctx}: previdenza "${prevInserito}" non riconosciuta, impostata "No previdenza" di default.`);
  }

  const atecoCodici = Array.from(new Set(get('ateco').split(',').map(s => s.trim()).filter(Boolean)));

  const cliente = {
    id: uid('cli'), tipo, ragioneSociale,
    codiceFiscale: get('codiceFiscale'), partitaIva: get('partitaIva'),
    atecoCodici, naturaGiuridica: '', regimeFiscale,
    contatti: {
      email: get('email'), emailAmministrazione: '', pec: get('pec'), telefono: get('telefono'),
      indirizzo: get('indirizzo'), cap: get('cap'), localita: get('localita'), provincia: get('provincia').toUpperCase(),
    },
    responsabileStudio, addebitoF24, contabilita, stato: 'attivo',
    periodicitaIva, periodicitaIntrastat: 'N.A.', previdenza,
    flags: {}, dirittoCameraleScelta: null, versamentoImposteScelta: SCELTE_VERSAMENTO_IMPOSTE[1],
    adempimentiAnnualiApplicabili: [], note: get('note'),
    settore: get('settore'), annoIngresso: new Date().getFullYear(), canaleAcquisizione: '', preventivoAnnuo: null,
    creatoIl: oggiISO(),
  };
  return { cliente, warnings };
}

function elaboraImportClienti(righe) {
  if (!righe || righe.length < 2) { alert('Il file non contiene righe da importare (serve almeno l\'intestazione più una riga di dati).'); return; }
  const header = righe[0];
  COLONNE_IMPORT_CLIENTI.forEach(c => { c.idx = trovaColonnaImport(header, c.intestazione); });
  const colonnaRagioneSociale = COLONNE_IMPORT_CLIENTI.find(c => c.chiave === 'ragioneSociale');
  if (!colonnaRagioneSociale || colonnaRagioneSociale.idx === -1) {
    alert('Non trovo la colonna "Ragione sociale / Nome" nell\'intestazione: verifica di aver usato (o non aver rinominato le colonne del) il template scaricato dall\'app.');
    return;
  }

  const esistenti = new Set();
  STATE.clienti.forEach(c => {
    if (c.partitaIva) esistenti.add('piva:' + c.partitaIva.trim().toLowerCase());
    if (c.codiceFiscale) esistenti.add('cf:' + c.codiceFiscale.trim().toLowerCase());
  });

  const nuoviClienti = [];
  const tuttiWarning = [];
  let saltatiDuplicati = 0, saltatiVuoti = 0;

  for (let i = 1; i < righe.length; i++) {
    const valori = righe[i];
    if (!valori || valori.every(v => String(v || '').trim() === '')) continue; // riga completamente vuota
    const { cliente, warnings } = clienteDaRigaImport(valori, i + 1);
    tuttiWarning.push(...warnings);
    if (!cliente) { saltatiVuoti++; continue; }
    const chiavePiva = cliente.partitaIva ? 'piva:' + cliente.partitaIva.trim().toLowerCase() : null;
    const chiaveCf = cliente.codiceFiscale ? 'cf:' + cliente.codiceFiscale.trim().toLowerCase() : null;
    if ((chiavePiva && esistenti.has(chiavePiva)) || (chiaveCf && esistenti.has(chiaveCf))) { saltatiDuplicati++; continue; }
    if (chiavePiva) esistenti.add(chiavePiva);
    if (chiaveCf) esistenti.add(chiaveCf);
    nuoviClienti.push(cliente);
  }

  if (nuoviClienti.length === 0) {
    alert(`Nessun cliente importato.${saltatiDuplicati ? ` ${saltatiDuplicati} riga/e scartate perché già presenti (stessa P.IVA o CF).` : ''}${saltatiVuoti ? ` ${saltatiVuoti} riga/e senza ragione sociale.` : ''}`);
    return;
  }

  STATE.clienti.push(...nuoviClienti);
  salvaStato();
  render();

  let msg = `Importat${nuoviClienti.length === 1 ? 'o' : 'i'} ${nuoviClienti.length} client${nuoviClienti.length === 1 ? 'e' : 'i'}.`;
  if (saltatiDuplicati) msg += ` ${saltatiDuplicati} già presenti, saltati.`;
  if (saltatiVuoti) msg += ` ${saltatiVuoti} riga/e senza ragione sociale, saltate.`;
  toast(msg);
  if (tuttiWarning.length) {
    console.warn('Import clienti — avvisi:', tuttiWarning);
    setTimeout(() => alert(`Import completato con ${tuttiWarning.length} avviso/i (valori non riconosciuti, sostituiti con un default — puoi correggerli con calma dalla scheda del cliente):\n\n` + tuttiWarning.slice(0, 20).join('\n') + (tuttiWarning.length > 20 ? `\n... e altri ${tuttiWarning.length - 20}.` : '')), 300);
  }
}

function importaClienti(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const nome = file.name.toLowerCase();
  if (nome.endsWith('.csv')) {
    const reader = new FileReader();
    reader.onload = () => {
      try { elaboraImportClienti(parseCSV(reader.result)); }
      catch (err) { alert('File CSV non valido: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
  } else {
    if (typeof XLSX === 'undefined') { alert('Libreria di lettura Excel non disponibile (serve una connessione internet al primo caricamento della pagina). In alternativa scarica il template in CSV: funziona sempre, anche offline.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, { type: 'array' });
        const foglio = wb.Sheets[wb.SheetNames[0]];
        const righe = XLSX.utils.sheet_to_json(foglio, { header: 1, raw: false, defval: '' });
        elaboraImportClienti(righe);
      } catch (err) { alert('File Excel non valido: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  }
  inputEl.value = '';
}

/* -------------------- RENDER: SCADENZE PERIODICHE -------------------- */
let SCAD_FILTRO = { bucket: 'Tutti', stato: 'Tutti', resp: 'Tutti', tipo: 'Tutti', q: '', dataDa: '', dataA: '' };

/* Selezione multipla per le azioni bulk sulla vista Scadenze (vedi scadBulkBar sotto). Un Set di
   id sopravvive volutamente a cambi di filtro/pagina all'interno della stessa visita alla vista —
   "seleziona 15 clienti in ritardo sulla stessa scadenza" spesso richiede scorrere più pagine
   prima di applicare l'azione una volta sola su tutte. Si svuota dopo ogni applicazione bulk. */
let SCAD_SELEZIONATE = new Set();

/* Storico solleciti e Step di controllo (modalSolleciti/modalControlloImposta) sono richiamabili
   sia da un punto qualunque con la scadenza già in tabella (riga di Scadenze periodiche), sia da
   dentro modalDettaglioScadenza (task #110) come approfondimento. Nel secondo caso, prima non c'era
   modo di tornare al dettaglio: "Chiudi" chiudeva tutto il modale, non solo l'approfondimento. Questo
   flag (vero UI, non salvato) ricorda se il sotto-modale attualmente aperto è stato raggiunto dal
   dettaglio — se sì, ci si aggiunge un pulsante "← Indietro"; se aperto direttamente dalla tabella,
   resta come prima (solo Chiudi). Si azzera ad ogni apertura "diretta" e si rialza solo dalle azioni
   dedicate scad-detail-apri-solleciti/scad-detail-apri-controllo. */
let SCAD_SUBMODAL_DA_DETTAGLIO = false;

/* Stessa logica di filtro/ordinamento usata dal render, isolata qui perché serve anche
   all'azione "seleziona tutte le N filtrate" (che deve operare sull'intera lista filtrata,
   non solo sulla pagina visibile). */
function scadenzeFiltrate() {
  const { periodiche } = derivati();
  const { scaduti, inScadenza, futuri, completati } = classificaScadenze(periodiche, oggiISO());
  const buckets = { Tutti: periodiche, Scaduti: scaduti, 'In scadenza': inScadenza, Futuri: futuri, Completati: completati };
  let lista = buckets[SCAD_FILTRO.bucket] || periodiche;
  if (SCAD_FILTRO.stato !== 'Tutti') lista = lista.filter(s => s.stato === SCAD_FILTRO.stato);
  if (SCAD_FILTRO.resp !== 'Tutti') lista = lista.filter(s => s.responsabile === SCAD_FILTRO.resp);
  if (SCAD_FILTRO.tipo !== 'Tutti') lista = lista.filter(s => s.tipo === SCAD_FILTRO.tipo);
  if (SCAD_FILTRO.q) lista = lista.filter(s => nomeCliente(s.clienteId).toLowerCase().includes(SCAD_FILTRO.q.toLowerCase()));
  if (SCAD_FILTRO.dataDa) lista = lista.filter(s => s.data >= SCAD_FILTRO.dataDa);
  if (SCAD_FILTRO.dataA) lista = lista.filter(s => s.data <= SCAD_FILTRO.dataA);
  return lista.slice().sort((a,b) => a.data.localeCompare(b.data) || nomeCliente(a.clienteId).localeCompare(nomeCliente(b.clienteId)));
}

function renderScadenze() {
  if (VIEW_PARAMS.filtro) {
    const map = { scaduti: 'Scaduti', inscadenza: 'In scadenza', futuri: 'Futuri', completati: 'Completati' };
    SCAD_FILTRO.bucket = map[VIEW_PARAMS.filtro] || 'Tutti';
    VIEW_PARAMS = {};
  }
  const { periodiche } = derivati();
  const { scaduti, inScadenza, futuri, completati } = classificaScadenze(periodiche, oggiISO());
  const buckets = { Tutti: periodiche, Scaduti: scaduti, 'In scadenza': inScadenza, Futuri: futuri, Completati: completati };

  // readiness: quante scadenze "in scadenza" (prossimi 30gg, non chiuse) hanno già l'importo
  // impostato — utile per capire se sei pronto prima che arrivi la data, come in Scadero.
  const conImporto = inScadenza.filter(s => s.importo !== null && s.importo !== undefined).length;
  const readinessPct = inScadenza.length ? Math.round((conImporto / inScadenza.length) * 100) : 100;
  const readiness = inScadenza.length ? `<div class="card" style="padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;">
    <span class="badge ${readinessPct===100?'stato-inviato-telematicamente':readinessPct>=50?'stato-da-fare':'stato-errore'}">${readinessPct}%</span>
    <span class="helptext">Pronte per l'invio: <b>${conImporto}/${inScadenza.length}</b> scadenze in arrivo (prossimi 30gg) hanno già l'importo impostato.</span>
  </div>` : '';

  const tipiValori = Array.from(new Set(periodiche.map(s => s.tipo))).sort();
  const tipiGruppi = raggruppaTipiPerCategoria(tipiValori);
  const lista = scadenzeFiltrate();

  const toolbar = `<div class="toolbar">
    <div class="field"><label>Bucket</label><select data-action="scad-filtro-bucket">
      ${Object.keys(buckets).map(b=>`<option value="${b}" ${SCAD_FILTRO.bucket===b?'selected':''}>${b} (${buckets[b].length})</option>`).join('')}
    </select></div>
    <div class="field"><label>Stato</label><select data-action="scad-filtro-stato">
      <option ${SCAD_FILTRO.stato==='Tutti'?'selected':''}>Tutti</option>
      ${STATI_SCADENZA.map(s=>`<option ${SCAD_FILTRO.stato===s?'selected':''}>${s}</option>`).join('')}
    </select></div>
    <div class="field"><label>Responsabile</label><select data-action="scad-filtro-resp">
      <option ${SCAD_FILTRO.resp==='Tutti'?'selected':''}>Tutti</option>
      ${STATE.meta.responsabili.map(r=>`<option ${SCAD_FILTRO.resp===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
    </select></div>
    <div class="field"><label>Tipo</label><select data-action="scad-filtro-tipo">
      <option ${SCAD_FILTRO.tipo==='Tutti'?'selected':''}>Tutti</option>
      ${tipiGruppi.map(([cat, vals])=>`<optgroup label="${escapeHtml(cat)}">
        ${vals.map(t=>`<option ${SCAD_FILTRO.tipo===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}
      </optgroup>`).join('')}
    </select></div>
    <div class="field grow"><label>Cerca cliente</label><input type="text" value="${escapeHtml(SCAD_FILTRO.q)}" data-action="scad-filtro-q" placeholder="Nome cliente..."></div>
    <div class="field"><label>Scadenza da</label><input type="date" value="${escapeHtml(SCAD_FILTRO.dataDa)}" data-action="scad-filtro-data-da"></div>
    <div class="field"><label>Scadenza a</label><input type="date" value="${escapeHtml(SCAD_FILTRO.dataA)}" data-action="scad-filtro-data-a"></div>
    <div class="field"><label>&nbsp;</label><button class="btn small" data-action="scad-seleziona-tutti-filtrati">☑ Seleziona tutte (${lista.length})</button></div>
  </div>`;

  if (periodiche.length === 0) {
    return readiness + toolbar + `<div class="card"><div class="empty"><div class="big">Nessuna scadenza generata</div>Aggiungi clienti con almeno un flag fiscale attivo (es. periodicità IVA) per veder comparire qui le scadenze.</div></div>`;
  }
  if (lista.length === 0) {
    return readiness + toolbar + `<div class="card"><div class="empty">Nessuna scadenza corrisponde ai filtri.</div></div>`;
  }

  // Barra azioni bulk: applica in un colpo solo lo stesso cambio di stato/responsabile/step di
  // controllo, o un identico sollecito, a tutte le scadenze selezionate — invece di dover ripetere
  // la stessa operazione riga per riga (fix da audit "occhi da commercialista" su 150 clienti).
  const bulkBar = SCAD_SELEZIONATE.size > 0 ? `<div id="scadBulkBar" class="card" style="padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--blu-light);">
    <b>${SCAD_SELEZIONATE.size} selezionate</b>
    <button class="btn small" data-action="scad-bulk-deseleziona">Deseleziona tutte</button>
    <span style="width:1px;height:20px;background:var(--border);"></span>
    <select id="scadBulkStato"><option value="">Cambia stato in...</option>${STATI_SCADENZA.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select>
    <button class="btn small" data-action="scad-bulk-stato">Applica</button>
    <select id="scadBulkResp"><option value="">Assegna responsabile...</option>${STATE.meta.responsabili.map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}</select>
    <button class="btn small" data-action="scad-bulk-resp">Applica</button>
    <select id="scadBulkStep"><option value="">Segna step come fatto...</option>${STEP_CONTROLLO_IMPOSTA.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select>
    <button class="btn small" data-action="scad-bulk-step">Applica</button>
    <button class="btn small primary" data-action="scad-bulk-sollecito">🔔 Registra sollecito a tutte</button>
  </div>` : '';

  const pag = paginaLista('scadenze', lista);
  const tutteSelezionateInPagina = pag.pagina.length > 0 && pag.pagina.every(s => SCAD_SELEZIONATE.has(s.id));
  const righe = pag.pagina.map(s => {
    const d = deltaLabel(s.data);
    const chiuso = STATI_SCADENZA_CHIUSI.includes(s.stato);
    const nSolleciti = (s.solleciti || []).length;
    return `<tr class="${SCAD_SELEZIONATE.has(s.id)?'riga-selezionata':''}">
      <td><input type="checkbox" data-action="scad-toggle-sel" data-id="${s.id}" ${SCAD_SELEZIONATE.has(s.id)?'checked':''}></td>
      <td style="white-space:nowrap;">${fmtData(s.data)}</td>
      <td>${escapeHtml(nomeCliente(s.clienteId))}</td>
      <td>${escapeHtml(s.nome)}</td>
      <td>${chiuso?'<span class="helptext">chiusa</span>':`<span class="pill-delta ${d.cls}">${d.txt}</span>`}</td>
      <td><select class="statoSel ${statoBadgeClass(s.stato)}" data-action="scad-cambia-stato" data-id="${s.id}">
        ${STATI_SCADENZA.map(st=>`<option ${s.stato===st?'selected':''}>${st}</option>`).join('')}
      </select></td>
      <td><select data-action="scad-cambia-resp" data-id="${s.id}">
        <option value="">—</option>
        ${STATE.meta.responsabili.map(r=>`<option ${s.responsabile===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
      </select></td>
      <td style="min-width:160px;"><input type="text" value="${escapeHtml(s.nota)}" data-action="scad-cambia-nota" data-id="${s.id}" placeholder="nota..." style="width:100%;border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-size:12px;"></td>
      <td style="white-space:nowrap;min-width:110px;"><input type="number" step="0.01" value="${s.importo!=null?s.importo:''}" data-action="scad-cambia-importo" data-id="${s.id}" placeholder="€" style="width:100%;border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-size:12px;"></td>
      <td style="white-space:nowrap;"><button class="btn small" data-action="scad-apri-solleciti" data-id="${s.id}" title="Storico solleciti">🔔 ${nSolleciti||''}</button></td>
      <td style="white-space:nowrap;">${(() => { const nStep=(s.step||[]).filter(st=>st.completato).length, totStep=(s.step||[]).length; return `<button class="btn small ${nStep===totStep&&totStep?'primary':''}" data-action="scad-apri-controllo" data-id="${s.id}" title="Step di controllo">☑ ${nStep}/${totStep}</button>`; })()}</td>
      <td style="white-space:nowrap;">${s.dataCompletamento?fmtData(s.dataCompletamento):'—'}</td>
    </tr>`;
  }).join('');

  return readiness + toolbar + bulkBar + `<div class="card" style="padding:0;overflow-x:auto;">
    <table class="compact"><thead><tr><th><input type="checkbox" data-action="scad-toggle-sel-pagina" ${tutteSelezionateInPagina?'checked':''} title="Seleziona/deseleziona tutte le righe di questa pagina"></th><th>Data</th><th>Cliente</th><th>Adempimento</th><th>Countdown</th><th>Stato</th><th>Resp.</th><th>Nota</th><th>Importo</th><th>Solleciti</th><th>Controllo</th><th>Completata il</th></tr></thead>
    <tbody>${righe}</tbody></table>
  </div>` + controlliPaginazione(pag);
}

/* -------------------- RENDER: ANTIRICICLAGGIO (task #119) -------------------- */
let AML_SELECTED = null;
function statoRevisioneAml(fascicolo) {
  if (!fascicolo.scadenzaRevisione) return { txt: 'Da pianificare', cls: 'info' };
  const delta = giorniTra(oggiISO(), fascicolo.scadenzaRevisione);
  if (delta < 0) return { txt: 'Scaduta', cls: 'stato-errore' };
  if (delta <= 30) return { txt: 'In scadenza', cls: 'stato-da-fare' };
  return { txt: 'Nel termine', cls: 'stato-inviato-telematicamente' };
}
function classeRischioAml(profilo) {
  if (profilo === 'Alto') return 'stato-errore';
  if (profilo === 'Medio') return 'stato-da-fare';
  if (profilo === 'Basso') return 'stato-inviato-telematicamente';
  return 'info';
}

function leggiDestinatari(prefix) {
  const radioChecked = document.querySelector(`input[name="${prefix}DestModo"]:checked`);
  const modo = radioChecked ? radioChecked.value : 'singolo';
  if (modo === 'tutti') return { modo, clienteIds: STATE.clienti.filter(c=>c.stato!=='cessato').map(c=>c.id) };
  if (modo === 'multi') return { modo, clienteIds: Array.from(document.querySelectorAll(`[data-multi-cliente="${prefix}"]:checked`)).map(cb=>cb.value) };
  const el = document.getElementById(`${prefix}DestSingolo`);
  return { modo, clienteIds: (el && el.value) ? [el.value] : [] };
}

/* Raggruppa le comunicazioni con lo stesso gruppoId (invii broadcast a più clienti) in un'unica
   riga "N destinatari" — la lista resta leggibile anche quando una circolare va a 24 clienti. */
function raggruppaComunicazioni(lista) {
  const gruppi = new Map();
  const righe = [];
  for (const c of lista) {
    if (c.gruppoId) {
      if (!gruppi.has(c.gruppoId)) { const voce = { tipo:'gruppo', gruppoId: c.gruppoId, righe: [], rappresentante: c }; gruppi.set(c.gruppoId, voce); righe.push(voce); }
      gruppi.get(c.gruppoId).righe.push(c);
    } else {
      righe.push({ tipo:'singola', c });
    }
  }
  return righe.sort((a,b) => {
    const da = (a.tipo==='gruppo'?a.rappresentante:a.c).data || '';
    const db = (b.tipo==='gruppo'?b.rappresentante:b.c).data || '';
    return db.localeCompare(da);
  });
}

  const toolbar = `<div class="toolbar">

      ${STATI_COMUNICAZIONE.map(s=>`<option ${COM_FILTRO.stato===s?'selected':''}>${s}</option>`).join('')}
    </select></div>
    <div class="field" style="margin-left:auto;"><label>&nbsp;</label><button class="btn primary" data-action="nuova-comunicazione">+ Nuova comunicazione</button></div>
  </div>`;

  const ricorrenti = renderComunicazioniRicorrenti();

  if (STATE.clienti.length === 0) {
    return `<div class="card"><div class="empty"><div class="big">Aggiungi prima un cliente</div>Le comunicazioni sono sempre legate a un'anagrafica cliente.</div></div>`;
  }
  if (lista.length === 0) {
    return ricorrenti + toolbar + `<div class="card"><div class="empty"><div class="big">Nessuna comunicazione pubblicata</div>Le comunicazioni che crei qui appaiono nel portale del cliente al posto dell'email — a un cliente solo, a più clienti insieme, o ricorrenti.</div></div>`;
  }
  if (filtrata.length === 0) {
    return avvisoDaLeggere + ricorrenti + toolbar + `<div class="card"><div class="empty">Nessuna comunicazione corrisponde ai filtri.</div></div>`;
  }

  const rigaSingola = (c) => {
    const dalCliente = c.direzione === 'cliente';
    const nUltimaRisposta = (c.risposte || []).length ? (c.risposte[c.risposte.length - 1].autore) : null;
    const daLeggere = (dalCliente || nUltimaRisposta === 'cliente') && c.vistaStudio === false;
    return `<tr${daLeggere ? ' style="font-weight:700;"' : ''}>
    <td style="white-space:nowrap;">${fmtData(c.data)}${daLeggere ? ' <span class="badge" style="background:var(--rosso-bg);color:var(--rosso);">Da leggere</span>' : ''}</td>
    <td>${escapeHtml(nomeCliente(c.clienteId))}</td>
    <td><span class="badge info">${escapeHtml(categoriaComunicazione(c))}</span>${dalCliente ? ' <span class="badge" style="background:var(--viola-bg);color:var(--viola);">Dal cliente</span>' : ''}${dalCliente && c.richiestaChiusa ? ' <span class="badge" style="background:var(--verde-bg);color:var(--verde);">Chiusa</span>' : ''}${c.visibilePortale===false?' <span class="badge">solo interno</span>':''}</td>
    <td><span style="cursor:pointer;" data-action="com-apri-thread" data-id="${c.id}" title="Apri il thread">${escapeHtml(c.oggetto)}${c.filePercorso ? ` <a href="${linkScaricaFileReale(c.filePercorso)}" target="_blank" title="Apri l'allegato" onclick="event.stopPropagation()">📎</a>` : ''}${(c.risposte||[]).length ? ` <span class="badge">${c.risposte.length} risp.</span>` : ''}</span></td>
    <td><select data-action="com-cambia-stato" data-id="${c.id}">${STATI_COMUNICAZIONE.map(s=>`<option ${c.stato===s?'selected':''}>${s}</option>`).join('')}</select></td>

  </tr>`;
  };

  const rigaGruppo = (g) => {
    const rap = g.rappresentante;
    const expanded = COM_GRUPPI_EXPANDED.has(g.gruppoId);
    const dettaglio = expanded ? `<tr><td colspan="6" style="background:var(--blu-light);"><div class="helptext" style="padding:4px 0;">Destinatari: ${g.righe.map(r=>escapeHtml(nomeCliente(r.clienteId))).join(', ')}</div></td></tr>` : '';
    return `<tr>
      <td style="white-space:nowrap;">${fmtData(rap.data)}</td>
      <td><span class="badge viola">📢 ${g.righe.length} destinatari</span> <span data-action="com-toggle-gruppo" data-id="${g.gruppoId}" style="cursor:pointer;">${expanded?'▾':'▸'}</span></td>
      <td><span class="badge info">${escapeHtml(categoriaComunicazione(rap))}</span></td>
      <td>${escapeHtml(rap.oggetto)}</td>
      <td><select data-action="com-cambia-stato-gruppo" data-id="${g.gruppoId}">${STATI_COMUNICAZIONE.map(s=>`<option ${rap.stato===s?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><button class="btn small danger" data-action="elimina-comunicazione-gruppo" data-id="${g.gruppoId}">Elimina</button></td>
    </tr>${dettaglio}`;
  };

  const gruppi = raggruppaComunicazioni(filtrata);
  const pag = paginaLista('comunicazioni', gruppi);
  const righe = pag.pagina.map(v => v.tipo==='gruppo' ? rigaGruppo(v) : rigaSingola(v.c)).join('');

  return avvisoDaLeggere + ricorrenti + toolbar + `<div class="card" style="padding:0;overflow-x:auto;">
    <table class="compact"><thead><tr><th>Data</th><th>Cliente</th><th>Categoria</th><th>Oggetto</th><th>Stato</th><th></th></tr></thead>
    <tbody>${righe}</tbody></table>
  </div>` + controlliPaginazione(pag);
}

    ? risposte.map(r => `<div class="subtask-row" style="align-items:flex-start;">

          <div style="font-size:12.5px;white-space:pre-wrap;line-height:1.4;">${escapeHtml(r.testo)}</div>
          ${r.filePercorso ? `<div style="margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">

          </div>` : ''}
        </div>
      </div>`).join('')

    ? `<div class="helptext" style="margin-bottom:10px;">📎 Riferita alla scadenza: <strong>${escapeHtml(c.scadenzaRif.nome)}</strong> (entro il ${fmtData(c.scadenzaRif.data)})</div>`

  // Task #140: solo le richieste ARRIVATE dal cliente si possono chiudere/riaprire (una comunicazione
