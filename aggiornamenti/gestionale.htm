/* Porta un oggetto stato "grezzo" (da localStorage o dal documento condiviso, vedi SYNC CONDIVISO
   più sotto) alla forma completa che il resto dell'app si aspetta: riempie i campi mancanti con i
   default, fonde il catalogo aggiornato, applica le migrazioni legacy. Isolata in una funzione a
   parte perché serve in due punti (caricamento da localStorage E applicazione di un aggiornamento
   arrivato dal backend condiviso) e deve comportarsi identicamente in entrambi i casi. */
/* Redesign contabilità (set. 2026): 'bilancinoPaghe' come tipo a sé è sparito, sostituito da un
   mastrino taggato su un conto ponte retribuzioni (stesso meccanismo degli altri conti). I mastrini
   vecchi senza contoId (creati prima dell'introduzione del registro conti) finiscono in un conto
   "Non specificato" così non si perde nessun dato già registrato. */
function migraDocumentiContabiliConti(stato) {
  if (!stato.documentiContabili) return 0;
  if (!stato.contiCliente) stato.contiCliente = {};
  let migrati = 0;
  const contoPerNome = (clienteId, nome) => {
    if (!stato.contiCliente[clienteId]) stato.contiCliente[clienteId] = [];
    let conto = stato.contiCliente[clienteId].find(c => c.nome.toLowerCase() === nome.toLowerCase());
    if (!conto) { conto = { id: uid('conto'), nome }; stato.contiCliente[clienteId].push(conto); }
    return conto;
  };
  Object.keys(stato.documentiContabili).forEach(clienteId => {
    (stato.documentiContabili[clienteId] || []).forEach(doc => {
      if (doc.tipo === 'bilancinoPaghe') {
        doc.tipo = 'mastrino';
        doc.contoId = contoPerNome(clienteId, 'Conto ponte retribuzioni').id;
        migrati++;
      } else if (doc.tipo === 'mastrino' && !doc.contoId) {
        doc.contoId = contoPerNome(clienteId, 'Non specificato').id;
        migrati++;
      }
    });
  });
  return migrati;
}

/* Task #114: i Task Team avevano un campo "note" a testo singolo, sovrascrivibile - diventato ora
   uno storico "noteStorico" (append-only, con autore e data per ogni voce). Un task già salvato da
   Matteo con la vecchia "note" non deve perdere quel testo: diventa la prima voce dello storico.
   L'autore esatto di quella nota vecchia non è mai stato registrato (il campo non lo prevedeva),
   quindi usiamo l'assegnatario del task come attribuzione più plausibile piuttosto che lasciarla
   vuota o inventare "Matteo" a prescindere. */
function migraNoteTaskTeam(stato) {
  if (!Array.isArray(stato.taskTeam)) return 0;
  let migrati = 0;
  stato.taskTeam.forEach(t => {
    if (!Array.isArray(t.noteStorico)) t.noteStorico = [];
    if (t.note && String(t.note).trim() && !t.noteStorico.length) {
      t.noteStorico.push({ id: uid('nota'), testo: String(t.note).trim(), autore: t.assegnatoA || null, data: t.creatoIl || oggiISO() });
      migrati++;
    }
    delete t.note;
  });
  return migrati;
}

function normalizzaStatoCaricato(parsed) {
  const stato = Object.assign(statoIniziale(), parsed);
  stato.meta = Object.assign(statoIniziale().meta, parsed.meta || {});
  sincronizzaCatalogoConDefault(stato);
  migraTipoClienteLegacy(stato);
  migraAtecoClienteLegacy(stato);
  migraAdempimentiDuplicati(stato);
  migraDocumentiContabiliConti(stato);
  migraNoteTaskTeam(stato);
  return stato;
}

function caricaStato() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) { STATE = statoIniziale(); return; }
    const parsed = JSON.parse(raw);
    STATE = normalizzaStatoCaricato(parsed);
  } catch (e) {
    console.error('Errore caricamento stato: dati salvati non leggibili (probabile corruzione)', e);
    // NON si riparte silenziosamente da zero senza avvisare: i dati grezzi (JSON non valido, ma
    // potenzialmente ancora recuperabili a mano da chi sa cosa cercare) vengono preservati sotto
    // una chiave separata PRIMA di azzerare lo stato in memoria — altrimenti la primissima
    // salvaStato() lanciata da un qualsiasi click successivo sovrascriverebbe per sempre l'unica
    // copia esistente dei dati con uno stato vuoto, senza che l'utente se ne accorga mai (un
    // semplice toast qui non basterebbe: usiamo un alert bloccante apposta, perché è uno scenario
    // raro e grave che l'utente deve notare subito, non un'informazione di passaggio).
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) localStorage.setItem(LS_KEY + '_corrotto_' + Date.now(), raw);
    } catch (e2) { /* localStorage non disponibile: non c'è nulla da preservare, si prosegue comunque */ }
    STATE = statoIniziale();
    alert('Attenzione: i dati salvati risultano corrotti e non leggibili. È stata conservata una copia dei dati grezzi in localStorage (sotto una chiave che inizia con "' + LS_KEY + '_corrotto_"), ma l\'app riparte ora da uno stato vuoto. Non procedere con nuove registrazioni prima di aver verificato/recuperato quella copia.');
  }
}
function salvaStato() {
  // salvaStato() viene chiamata dopo QUALSIASI mutazione in tutta l'app: se localStorage
  // lancia un'eccezione (quota esaurita, storage disabilitato/bloccato dal browser, modalità
  // privata su alcuni browser) senza questo try/catch l'errore risalirebbe fino al gestore
  // click/change in corso, interrompendolo a metà (modale che non si chiude, render() mai
  // eseguita) — e soprattutto l'utente non saprebbe MAI che i suoi dati non si sono salvati,
  // rischiando di perdere silenziosamente il lavoro. Meglio avvisare chiaramente e lasciare
  // che il resto del gestore (chiudiModal/render/toast di successo) prosegua comunque.
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(STATE));
  } catch (e) {
    console.error('Salvataggio in localStorage fallito:', e);
    toast('⚠️ Salvataggio non riuscito (spazio esaurito o storage bloccato dal browser). Esporta subito un backup da Impostazioni per non perdere le modifiche.', true);
  }
  pianificaSalvataggioCondiviso();
}

/* -------------------- SYNC CONDIVISO (studio multi-postazione) --------------------
   Il localStorage sopra resta SEMPRE la persistenza di base, e continua a funzionare da solo
   quando questo file è aperto come semplice .html locale (window.location.protocol === 'file:':
   ogni funzione qui sotto se ne accorge e si disattiva in silenzio — nessuna differenza di
   comportamento per chi lo usa così). Quando invece la pagina è servita via http/https, lo stato
   viene anche letto/scritto su un backend condiviso, in uno di due modi alternativi (mai insieme):
     1) claude.ai — pagina pubblicata come Artifact con la capability "db": il documento condiviso
        vive sull'infrastruttura di Anthropic, raggiungibile da chi ha accesso al link.
     2) server locale — questa stessa pagina servita da server.js sulla rete dello studio (vedi
        quel file): il documento condiviso vive su un file JSON sul PC che fa da server, letto via
        fetch()/aggiornato via Server-Sent Events. Zero account esterni richiesti, dati che restano
        sull'hardware dello studio.
   La pagina capisce da sola quale dei due usare (o nessuno) in base a dove è aperta: non serve
   nessuna configurazione manuale, lo stesso identico file funziona in tutti e tre i contesti.
   Limite onesto da conoscere, valido per ENTRAMBI i modi condivisi: è un solo documento condiviso
   con scrittura "ultimo vince", non un merge campo per campo — se due persone modificano la stessa
   scheda nello stesso istante, l'una può sovrascrivere l'altra (motivo per cui il salvataggio è
   raggruppato/debounced: vedi pianificaSalvataggioCondiviso). Non è un editing collaborativo in
   tempo reale campo per campo. */
const DB_DOC_PATH = 'studio/state';
let DB_REF = null;
let DB_SALVATAGGIO_TIMER = null;
let DB_STATO_REMOTO_PENDENTE = null;
let HTTP_SYNC_ATTIVO = false;
const HTTP_CLIENT_ID = 'client_' + Math.random().toString(36).slice(2) + Date.now().toString(36);

/* -------------------- "Chi sei" (task #98): identità locale, NON un vero login --------------------
   Con il server locale acceso (server.js), tutti i colleghi sulla rete dello studio che aprono
   l'indirizzo del PC condividono gli stessi dati e hanno OGGI accesso pieno, senza restrizioni -
   questo resta così di proposito (studio piccolo, fiducia sulla rete interna). Quello che manca è
   sapere CHI ha fatto cosa: chi ha risposto a un cliente nel thread, chi ha creato una
   comunicazione. Questa sezione risolve solo quello: un nome scelto una volta per browser/PC
   (nessuna password), salvato in una chiave di localStorage SEPARATA da LS_KEY - deve restare
   locale a questo dispositivo, non sincronizzarsi mai via server.js/db condiviso, altrimenti "chi
   sono io" diventerebbe "chi era l'ultimo ad aver salvato da un altro PC". Se in Impostazioni c'è
   un solo responsabile configurato non ha senso chiedere nulla: si assume sia lui, senza friction. */
const LS_KEY_OPERATORE = 'gestionaleOperatoreLocale_v1';
let OPERATORE = null;
function caricaOperatoreLocale() {
  try {
    const salvato = (typeof localStorage !== 'undefined') && localStorage.getItem(LS_KEY_OPERATORE);
    OPERATORE = salvato || null;
  } catch (err) { OPERATORE = null; }
}
// Si auto-corregge se il nome scelto non è (più) tra i responsabili configurati (es. rinominato o
// rimosso in Impostazioni) - meglio tornare a "nessuno" che continuare ad attribuire a un nome che
// nel frattempo è cambiato.
function operatoreCorrente() {
  if (OPERATORE && !STATE.meta.responsabili.includes(OPERATORE)) OPERATORE = null;
  return OPERATORE;
}
function impostaOperatore(nome) {
  OPERATORE = (nome && STATE.meta.responsabili.includes(nome)) ? nome : null;
  try {
    if (typeof localStorage === 'undefined') { /* niente da fare, es. ambiente di test senza DOM */ }
    else if (OPERATORE) localStorage.setItem(LS_KEY_OPERATORE, OPERATORE);
    else localStorage.removeItem(LS_KEY_OPERATORE);
  } catch (err) { /* storage non disponibile: l'attribuzione resta solo per questa sessione */ }
  render();
}
function aggiornaBadgeOperatore() {
  const el = typeof document !== 'undefined' && document.getElementById('operatoreBadge');
  if (!el) return;
  if (STATE.meta.responsabili.length < 2) { el.style.display = 'none'; return; }
  el.style.display = '';
  const nome = operatoreCorrente();
  el.textContent = nome ? ('👤 ' + nome) : '👤 Chi sei?';
  el.title = nome ? `Stai usando il gestionale come ${nome}. Clicca per cambiare.` : 'Scegli chi sta usando questo PC (solo per sapere chi ha fatto cosa, nessuna restrizione).';
}
// Mostrato una volta per browser (finché non si scegli un nome, o se i responsabili passano da 1 a
// 2+): niente da fare se c'è un solo responsabile configurato, o se qui è già stato scelto un nome.
function eventualeSelettoreOperatore() {
  if (STATE.meta.responsabili.length < 2) return;
  if (operatoreCorrente()) return;
  modalSelettoreOperatore();
}
function modalSelettoreOperatore() {
  const html = `<div class="modal-backdrop" data-action="chiudi-modal-backdrop">
    <div class="modal" style="max-width:380px;">
      <h2>Chi sta usando questo PC?</h2>
      <div class="modal-sub">Serve solo per sapere chi ha risposto a un cliente o creato una comunicazione — non è un vero login: chiunque sulla rete dello studio ha comunque accesso completo, come oggi.</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin:14px 0;">
        ${STATE.meta.responsabili.map(r => `<button class="btn" data-action="operatore-scegli" data-nome="${escapeHtml(r)}" style="text-align:left;">${escapeHtml(r)}</button>`).join('')}
      </div>
      <div class="modal-actions"><button class="btn" data-action="chiudi-modal">Non ora</button></div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

function impostaBadgeSync(testo, titolo) {
  const el = typeof document !== 'undefined' && document.getElementById('syncBadge');
  if (!el) return;
  el.textContent = testo;
  el.title = titolo || '';
}

/* Applica l'ultimo stato remoto ricevuto, MA solo se in questo momento non si sta scrivendo in un
   campo di testo — altrimenti un aggiornamento in arrivo da un collega cancellerebbe a metà quello
   che si sta digitando. Se si sta scrivendo, resta in coda: un listener globale di blur (in
   init()) la riprova appena il campo perde il focus. */
function applicaStatoRemotoSeLibero() {
  if (!DB_STATO_REMOTO_PENDENTE) return;
  const el = document.activeElement;
  const staScrivendo = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && document.body.contains(el);
  if (staScrivendo) return;
  const remoto = DB_STATO_REMOTO_PENDENTE;
  DB_STATO_REMOTO_PENDENTE = null;
  STATE = normalizzaStatoCaricato(remoto);
  render();
  toast('🔄 Dati aggiornati da un\'altra postazione.');
}

/* Scrive lo stato condiviso (su claude.ai o sul server locale, quello dei due che è attivo)
   raggruppando le mutazioni ravvicinate in un solo invio (es. mentre si digita una nota, o durante
   un'azione bulk su decine di scadenze): scrivere ad ogni singolo tasto premuto sarebbe sia
   inutile sia a rischio di limiti di frequenza/carico sul backend. */
function pianificaSalvataggioCondiviso() {
  if (!DB_REF && !HTTP_SYNC_ATTIVO) return;
  clearTimeout(DB_SALVATAGGIO_TIMER);
  DB_SALVATAGGIO_TIMER = setTimeout(() => {
    if (DB_REF) {
      DB_REF.set(STATE).then(() => {
        impostaBadgeSync('🟢 Sincronizzato', 'Dati condivisi con lo studio, aggiornati.');
      }).catch(err => {
        console.error('Sync condiviso: scrittura non riuscita', err);
        impostaBadgeSync('🟠 Sync in errore', 'Scrittura sui dati condivisi non riuscita. I dati restano comunque salvati in locale su questo dispositivo.');
      });
    } else if (HTTP_SYNC_ATTIVO) {
      fetch('/api/stato', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Client-Id': HTTP_CLIENT_ID }, body: JSON.stringify(STATE) })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); impostaBadgeSync('🟢 Sincronizzato (rete locale)', 'Dati condivisi con lo studio via server locale, aggiornati.'); })
        .catch(err => {
          console.error('Sync via server locale: scrittura non riuscita', err);
          impostaBadgeSync('🟠 Sync in errore', 'Scrittura sul server locale non riuscita. Verifica che il server (server.js) sia ancora acceso. I dati restano comunque salvati in locale su questo dispositivo.');
        });
      aggiornaVistaMCPInTempoReale();
    }
  }, 800);
}

/* Tiene aggiornata "in tempo reale" (nei limiti del debounce di pianificaSalvataggioCondiviso, quindi
   entro ~800ms da ogni modifica) la vista che il server MCP locale legge, quando il gestionale gira
   via server.js (HTTP_SYNC_ATTIVO): ricalcola esportaVistaMCP() - l'UNICA fonte della logica di
   classificazione, resta sempre e solo qui - e la manda al server, che la scrive nello stesso file
   che "Esporta per MCP" scarica a mano. Volutamente "fire and forget": se fallisce (es. server.js
   di una versione precedente senza questo endpoint, o richiesta persa) non deve interrompere né
   segnalare nulla all'utente - il salvataggio vero dei dati (sopra) non dipende da questo, e la
   vista MCP resta comunque disponibile con l'ultimo export manuale o l'ultimo push riuscito. */
function aggiornaVistaMCPInTempoReale() {
  try {
    const vista = esportaVistaMCP();
    fetch('/api/mcp-vista', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(vista) }).catch(() => {});
  } catch (err) { /* mai bloccante */ }
}

async function inizializzaSyncCondiviso() {
  try {
    if (typeof window === 'undefined' || window.location.protocol === 'file:') return; // file locale: nessun backend condiviso possibile né necessario

    if (window.claude && typeof window.claude.use === 'function') {
      const db = await window.claude.use('db');
      if (db) { await inizializzaSyncViaClaudeDB(db); return; }
    }
    await inizializzaSyncViaServerLocale();
  } catch (err) {
    console.error('Sync condiviso: inizializzazione non riuscita', err);
    impostaBadgeSync('🟠 Sync non disponibile', 'Impossibile collegarsi ai dati condivisi dello studio in questo momento. I dati restano salvati in locale su questo dispositivo.');
  }
}

async function inizializzaSyncViaClaudeDB(db) {
  DB_REF = db.doc(DB_DOC_PATH);
  impostaBadgeSync('🔵 Connessione...', 'Connessione ai dati condivisi dello studio in corso.');

  const snap = await DB_REF.get();
  if (snap && snap.exists && typeof snap.data === 'function') {
    const remoto = snap.data();
    if (remoto && typeof remoto === 'object' && Array.isArray(remoto.clienti)) {
      STATE = normalizzaStatoCaricato(remoto);
      render();
      // Il popup "chi sei" a init() ha ragionato sui responsabili di default/locali, non ancora
      // su quelli veri appena arrivati dal sync - si ricontrolla ora che STATE è quello giusto
      // (es. un responsabile aggiunto da un collega non era ancora nell'elenco al primo avvio).
      eventualeSelettoreOperatore();
    }
  } else {
    // primo utilizzo di questo link condiviso: lo stato locale attuale diventa la base di partenza
    await DB_REF.set(STATE);
  }
  impostaBadgeSync('🟢 Sincronizzato', 'Dati condivisi con lo studio, aggiornati.');

  DB_REF.onSnapshot((snap) => {
    if (!snap || !snap.exists || typeof snap.data !== 'function') return;
    if (snap.metadata && snap.metadata.hasPendingWrites) return; // eco della propria scrittura in corso: si aspetta la conferma dal server
    DB_STATO_REMOTO_PENDENTE = snap.data();
    applicaStatoRemotoSeLibero();
  });
}

/* Sync via il piccolo server locale (server.js) che gira sulla rete dello studio: legge/scrive lo
   stato via HTTP invece che via window.claude.db, e usa Server-Sent Events (EventSource) per gli
   aggiornamenti in tempo reale — stesso ruolo di onSnapshot sopra, tecnologia diversa perché qui
   non c'è alcuna capability della piattaforma, solo un server scritto ad hoc. Se fetch('/api/stato')
   fallisce (nessun server in ascolto a questo indirizzo — es. il file è servito da un web server
   qualunque senza server.js dietro) si esce in silenzio: nessun badge, nessun errore per l'utente,
   esattamente come un file locale normale. */
async function inizializzaSyncViaServerLocale() {
  let risp;
  try {
    risp = await fetch('/api/stato', { method: 'GET' });
  } catch (err) {
    return; // nessun server raggiungibile a questo indirizzo
  }
  if (!risp || !risp.ok) return;
  const remoto = await risp.json().catch(() => null);
  if (remoto && typeof remoto === 'object' && Array.isArray(remoto.clienti)) {
    STATE = normalizzaStatoCaricato(remoto);
    render();
    // Il popup "chi sei" a init() ha ragionato sui responsabili di default/locali, non ancora su
    // quelli veri appena arrivati dal sync - si ricontrolla ora che STATE è quello giusto (es. un
    // responsabile aggiunto da un collega, o su un altro PC, non era ancora nell'elenco al primo
    // avvio: caso tipico con l'app Electron, che parte sempre con una finestra "vergine" senza
    // nulla ancora salvato in locale finché non arriva la prima sincronizzazione).
    eventualeSelettoreOperatore();
  } else {
    // primo avvio del server: lo stato locale attuale diventa la base di partenza condivisa
    await fetch('/api/stato', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Client-Id': HTTP_CLIENT_ID }, body: JSON.stringify(STATE) });
  }
  HTTP_SYNC_ATTIVO = true;
  impostaBadgeSync('🟢 Sincronizzato (rete locale)', 'Dati condivisi con lo studio via server locale, aggiornati.');

  try {
    const es = new EventSource('/api/eventi');
    es.onmessage = (ev) => {
      let dati = null;
      try { dati = JSON.parse(ev.data); } catch (e) { return; }
      if (dati && dati.tipo === 'comandoMcp') { eseguiComandoMCP(dati.comando); return; }
      if (dati && dati.origine === HTTP_CLIENT_ID) return; // eco della propria scrittura: già applicata in locale
      fetch('/api/stato').then(r => r.json()).then(remoto => {
        if (remoto && Array.isArray(remoto.clienti)) {
          DB_STATO_REMOTO_PENDENTE = remoto;
          applicaStatoRemotoSeLibero();
        }
      }).catch(() => {});
    };
    es.onerror = () => {
      impostaBadgeSync('🟠 Connessione persa', 'Connessione al server locale interrotta (verifica che sia ancora acceso). I dati restano salvati in questo browser; il collegamento riprova da solo.');
    };
  } catch (err) {
    console.error('Sync via server locale: impossibile aprire la connessione di aggiornamento in tempo reale', err);
  }
}

/* -------------------- UPLOAD FILE REALI (solo via server locale) --------------------
   Il file vero e proprio (non solo il nome/data che si registra come metadato) puo' essere
   salvato su disco SOLO quando la pagina gira via server.js (HTTP_SYNC_ATTIVO): e' l'unico dei
   tre contesti (file:// locale, Artifact claude.ai, server locale) in cui esiste un backend che
   puo' scrivere un file in una cartella vera. Negli altri due contesti l'upload resta disabilitato
   e si registra solo il metadato, esattamente come prima di questa funzione — nessuna perdita di
   dati, solo una funzionalita' in piu' quando disponibile. */
function uploadFileReale(file, clienteId, clienteNome, sottocartella) {
  return new Promise((resolve, reject) => {
    if (!HTTP_SYNC_ATTIVO) { reject(new Error('Upload file reale disponibile solo con il server locale (server.js) attivo.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Errore di lettura del file.'));
    reader.onload = () => {
      const base64 = String(reader.result).split(',')[1] || '';
      fetch('/api/documenti/carica', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clienteId, clienteNome, sottocartella: sottocartella || '', nomeFile: file.name, contenutoBase64: base64 }),
      })
        .then(r => r.json())
        .then(esito => { if (esito && esito.ok) resolve(esito); else reject(new Error((esito && esito.errore) || 'Upload non riuscito.')); })
        .catch(err => reject(err));
    };
    reader.readAsDataURL(file);
  });
}
function eliminaFileReale(percorso) {
  if (!HTTP_SYNC_ATTIVO || !percorso) return;
  fetch('/api/documenti/elimina', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ percorso }) }).catch(() => {});
}
function linkScaricaFileReale(percorso) {
  return '/api/documenti/scarica?percorso=' + encodeURIComponent(percorso);
}
/* Apre in Esplora risorse (o Finder) la cartella che contiene il file, con il file selezionato -
   così dal gestionale si arriva dritti al file vero sul disco, non solo alla sua anteprima nel
   browser. Disponibile solo con server.js attivo (stesso limite di uploadFileReale: solo lì esiste
   un file vero da poter mostrare). */
function apriCartellaDocumento(percorso) {
  if (!HTTP_SYNC_ATTIVO || !percorso) return;
  fetch('/api/documenti/apri-cartella', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ percorso }) })
    .then(r => r.json()).then(esito => { if (esito && esito.ok === false) toast('⚠️ ' + (esito.errore || 'Impossibile aprire la cartella.'), true); })
    .catch(() => toast('⚠️ Impossibile contattare il server locale per aprire la cartella.', true));
}

/* -------------------- PONTE COMANDI PER L'MCP LOCALE (Claude) --------------------
   Quando l'MCP locale (server.js/mcp-server, vedi tools.js) riceve un tool "scrittura" (crea/
   modifica/elimina cliente, task, ecc.), manda un comando a server.js, che lo inoltra qui via SSE
   (vedi onmessage sopra). Ogni azione è mappata SULLA STESSA funzione che usa già il resto
   dell'app (aggiungiCliente, aggiornaTaskTeam, ecc.) - MAI una copia parallela della logica: se
   domani "creare un cliente" cambia (nuovo campo obbligatorio, nuova validazione...), cambia qui
   una volta sola, in gestionale.htm, e sia il form sia l'MCP la vedono aggiornata.
   Ogni voce riceve i "parametri" così come arrivano dal tool MCP (già validati lato Node con Zod
   per i campi obbligatori) e ritorna il valore che verrà rimandato a Claude come esito. */
const AZIONI_MCP = {
  creaCliente: (p) => aggiungiCliente(p),
  modificaCliente: (p) => { const c = aggiornaCliente(p.id, p.patch || {}); if (!c) throw new Error('Cliente non trovato: ' + p.id); return c; },
  eliminaCliente: (p) => { if (!clienteById(p.id)) throw new Error('Cliente non trovato: ' + p.id); eliminaCliente(p.id); return { eliminato: true }; },

  creaTask: (p) => { aggiungiTaskTeam(p); return { creato: true }; },
  modificaTask: (p) => { if (!STATE.taskTeam.find(t => t.id === p.id)) throw new Error('Task non trovato: ' + p.id); aggiornaTaskTeam(p.id, p.patch || {}); return { aggiornato: true }; },
  eliminaTask: (p) => { if (!STATE.taskTeam.find(t => t.id === p.id)) throw new Error('Task non trovato: ' + p.id); eliminaTaskTeam(p.id); return { eliminato: true }; },

  creaComunicazione: (p) => { aggiungiComunicazione(p); return { creata: true }; },
  modificaComunicazione: (p) => { if (!STATE.comunicazioni.find(c => c.id === p.id)) throw new Error('Comunicazione non trovata: ' + p.id); aggiornaComunicazione(p.id, p.patch || {}); return { aggiornata: true }; },
  eliminaComunicazione: (p) => { if (!STATE.comunicazioni.find(c => c.id === p.id)) throw new Error('Comunicazione non trovata: ' + p.id); eliminaComunicazione(p.id); return { eliminata: true }; },

  creaSocio: (p) => { aggiungiSocio(p); return { creato: true }; },
  modificaSocio: (p) => { if (!STATE.soci.find(s => s.id === p.id)) throw new Error('Socio non trovato: ' + p.id); aggiornaSocio(p.id, p.patch || {}); return { aggiornato: true }; },
  eliminaSocio: (p) => { if (!STATE.soci.find(s => s.id === p.id)) throw new Error('Socio non trovato: ' + p.id); eliminaSocio(p.id); return { eliminato: true }; },

  creaF24: (p) => { aggiungiF24(p); return { creato: true }; },
  modificaF24: (p) => { if (!STATE.f24.find(f => f.id === p.id)) throw new Error('F24 non trovato: ' + p.id); aggiornaF24(p.id, p.patch || {}); return { aggiornato: true }; },
  eliminaF24: (p) => { if (!STATE.f24.find(f => f.id === p.id)) throw new Error('F24 non trovato: ' + p.id); eliminaF24(p.id); return { eliminato: true }; },

  modificaScadenza: (p) => { aggiornaScadenza(p.id, p.patch || {}); return { aggiornata: true }; },
  aggiornaStepScadenza: (p) => { aggiornaStepScadenza(p.scadenzaId, p.nomeStep, p.patch || {}); return { aggiornato: true }; },
  aggiornaSottoAdempimento: (p) => { aggiornaSottoAdempimento(p.annualeId, p.nomeSotto, p.patch || {}); return { aggiornato: true }; },

  // Preventivi/mandati (task #143): "attivitaIds" (facoltativo) sono id del catalogo attività dello
  // studio - qui si trasformano nello snapshot {id,nome,prezzo,richiedeMandato} come farebbe il
  // form, e se non viene passato un importo esplicito si somma quello delle attività scelte.
  creaPreventivo: (p) => {
    const attivitaScelte = Array.isArray(p.attivitaIds) ? p.attivitaIds.map(aid => {
      const a = STATE.catalogoAttivitaStudio.find(x => x.id === aid);
      if (!a) throw new Error('Attività a listino non trovata: ' + aid);
      return { id: a.id, nome: a.nome, prezzo: a.prezzo != null ? a.prezzo : null, richiedeMandato: !!a.richiedeMandato };
    }) : [];
    const importoFinale = p.importo != null ? p.importo : (attivitaScelte.length ? attivitaScelte.reduce((s, a) => s + (a.prezzo || 0), 0) : null);
    const valoriCustomFinale = Object.assign({}, p.valoriCustom || {});
    if (attivitaScelte.length && !valoriCustomFinale.dettaglioAttivita) valoriCustomFinale.dettaglioAttivita = testoElencoAttivita(attivitaScelte);
    return creaPreventivoDaModello({ clienteId: p.clienteId, modelloId: p.modelloId, oggetto: p.oggetto, importo: importoFinale, dataEmissione: p.dataEmissione, validoFino: p.validoFino, stato: p.stato, note: p.note, valoriCustom: valoriCustomFinale, attivitaScelte });
  },
  modificaPreventivo: (p) => { if (!STATE.preventivi.find(x => x.id === p.id)) throw new Error('Preventivo/mandato non trovato: ' + p.id); aggiornaPreventivo(p.id, p.patch || {}); return { aggiornato: true }; },
  eliminaPreventivo: (p) => { if (!STATE.preventivi.find(x => x.id === p.id)) throw new Error('Preventivo/mandato non trovato: ' + p.id); eliminaPreventivo(p.id); return { eliminato: true }; },
};

async function eseguiComandoMCP(comando) {
  let ok = true, risultato = null, errore = null;
  try {
    const fn = comando && AZIONI_MCP[comando.azione];
    if (!fn) throw new Error('Azione MCP sconosciuta: ' + (comando && comando.azione));
    risultato = fn(comando.parametri || {});
    render();
    toast('🤖 Claude ha eseguito: ' + comando.azione);
  } catch (err) {
    ok = false;
    errore = (err && err.message) ? err.message : String(err);
    console.error('Comando MCP fallito', comando, err);
    toast('⚠️ Comando da Claude fallito (' + (comando && comando.azione) + '): ' + errore, true);
  }
  if (comando && comando.id) {
    fetch('/api/comando-risultato', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: comando.id, ok, risultato, errore }),
    }).catch(() => {});
  }
}

/* -------------------- 3) UTILS -------------------- */
function uid(prefix) {
  return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}
function oggiISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtData(iso) {
  if (!iso) return '—';
  const [y,m,g] = iso.split('-');
  return `${g}/${m}/${y}`;
}
function fmtDataBreve(iso) {
  if (!iso) return '—';
  const [y,m,g] = iso.split('-');
  return `${g} ${MESI_IT[Number(m)-1]}`;
}
function fmtDataOra(isoDataOra) {
  if (!isoDataOra) return '—';
  const d = new Date(isoDataOra);
  if (isNaN(d.getTime())) return '—';
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slug(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function statoBadgeClass(stato) {
  return 'stato-' + slug(stato);
}
function clienteById(id) {
  return STATE.clienti.find(c => c.id === id);
}
function nomeCliente(id) {
  const c = clienteById(id);
  return c ? c.ragioneSociale : '(cliente eliminato)';
}
function deltaLabel(dataISO) {
  const d = giorniTra(oggiISO(), dataISO);
  if (d < 0) return { txt: `Scaduto ${Math.abs(d)}gg fa`, cls: 'scaduto' };
  if (d === 0) return { txt: 'OGGI', cls: 'oggi' };
  if (d <= 7) return { txt: `Tra ${d}gg`, cls: 'vicino' };
  if (d <= 30) return { txt: `Tra ${d}gg`, cls: 'vicino' };
  return { txt: `Tra ${d}gg`, cls: 'lontano' };
}
function toast(msg, isError) {
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, isError ? 6000 : 2600);
}
function confermaAzione(msg) {
  return window.confirm(msg);
}
/* Copia negli appunti con ripiego: l'API moderna (navigator.clipboard) richiede un contesto
   sicuro (HTTPS o localhost) e potrebbe non essere disponibile su una rete studio raggiunta via
   http:// semplice da un indirizzo IP — in quel caso si ripiega sul vecchio execCommand('copy') via
   una textarea temporanea, che funziona ovunque anche se deprecato. */
function copiaTestoNegliAppunti(testo, messaggioOk) {
  if (!testo) return;
  const msg = messaggioOk || 'Link copiato negli appunti.';
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = testo;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast(msg);
    } catch (e) {
      toast('Non sono riuscito a copiare automaticamente: seleziona il testo a mano.', true);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(testo).then(() => toast(msg)).catch(fallback);
  } else {
    fallback();
  }
}

/* -------------------- DERIVED: ricalcola tutto per l'anno corrente -------------------- */
function derivati() {
  const anno = STATE.annoCorrente;
  const periodiche = generaScadenzePeriodiche(STATE.clienti, anno, STATE.scadenzeOverrides);
  const righeRitenuteAnno = STATE.ritenuteRighe.filter(r => new Date(r.dataPagamento+'T00:00:00').getFullYear() === anno
    || new Date(r.dataPagamento+'T00:00:00').getFullYear() === anno - 1); // includiamo dicembre anno prec. che può slittare a gennaio anno corrente
  const { scadenze: ritenuteScad } = generaScadenzeRitenute(STATE.ritenuteRighe, STATE.scadenzeOverrides);
  const ritenuteScadAnno = ritenuteScad.filter(s => s.data.startsWith(String(anno)));
  const tutte = periodiche.concat(ritenuteScadAnno);
  const annuali = generaAdempimentiAnnuali(STATE.clienti, anno, STATE.annualiOverrides);
  return { periodiche, ritenuteScad: ritenuteScadAnno, tutteScadenze: tutte, annuali };
}

/* -------------------- MUTAZIONI (aggiornano STATE + salvano) -------------------- */
function aggiornaScadenza(id, patch) {
  const cur = STATE.scadenzeOverrides[id] || {};
  const next = Object.assign({}, cur, patch);
  if (patch.stato && STATI_SCADENZA_DEFINITIVI.includes(patch.stato) && !next.dataCompletamento) {
    next.dataCompletamento = oggiISO();
  }
  if (patch.stato && !STATI_SCADENZA_DEFINITIVI.includes(patch.stato) && patch.stato !== 'Non applicabile') {
    // se si torna indietro da uno stato definitivo, non cancelliamo la data automaticamente per non perdere lo storico
  }
  STATE.scadenzeOverrides[id] = next;
  salvaStato();
}
/* Aggiorna un singolo step di controllo (Calcolato/Comunicato al cliente/Versamento
   predisposto/Inviato) di una scadenza periodica — stessa meccanica di aggiornaSottoAdempimento
   per gli adempimenti annuali: gli step sono indipendenti tra loro (nessuna esclusività) e la
   data viene impostata automaticamente al primo completamento. */
function aggiornaStepScadenza(scadenzaId, nomeStep, patch) {
  const cur = STATE.scadenzeOverrides[scadenzaId] || {};
  const step = Object.assign({}, cur.step || {});
  const curStep = step[nomeStep] || {};
  step[nomeStep] = Object.assign({}, curStep, patch);
  if (patch.completato && !step[nomeStep].data) step[nomeStep].data = oggiISO();
  STATE.scadenzeOverrides[scadenzaId] = Object.assign({}, cur, { step });
  salvaStato();
}
/* Log di annotazioni testuali e datate su una scadenza — diverso dalla "nota" (una riga sola,
   sempre in chiaro nella tabella Scadenze, si sovrascrive): qui ogni voce resta con la sua data,
   non si perde mai la precedente. Serve per casi come "bilancio depositato in ritardo, il cliente
   vuole compensare le imposte col credito IVA che deriverà dal modello TR in corso di invio" — un
   dettaglio operativo che matura nel tempo, non un singolo stato. Vive nello "Step di controllo"
   della scadenza (modalControlloImposta), non in tabella: lì c'è spazio per leggerlo davvero. */
function aggiungiAnnotazioneScadenza(scadenzaId, testo) {
  const t = (testo || '').trim();
  if (!t) return;
  const cur = STATE.scadenzeOverrides[scadenzaId] || {};
  const annotazioni = (cur.annotazioni || []).concat([{ id: uid('nota'), data: oggiISO(), testo: t, autore: operatoreCorrente() || null }]);
  STATE.scadenzeOverrides[scadenzaId] = Object.assign({}, cur, { annotazioni });
  salvaStato();
}
function eliminaAnnotazioneScadenza(scadenzaId, annotazioneId) {
  const cur = STATE.scadenzeOverrides[scadenzaId] || {};
  const annotazioni = (cur.annotazioni || []).filter(a => a.id !== annotazioneId);
  STATE.scadenzeOverrides[scadenzaId] = Object.assign({}, cur, { annotazioni });
  salvaStato();
}
/* Canali usati per registrare un sollecito manuale (telefonata, email, ecc.) verso il cliente,
   così da vedere lo storico prima di rimandarne un altro — non invia nulla, è solo un log. */
const CANALI_SOLLECITO = ['Email', 'Telefono', 'WhatsApp', 'Di persona', 'Altro'];

/* Testo di default per il messaggio di sollecito, precompilato ma sempre modificabile prima di
   aprire email/WhatsApp — non viene mai inviato nulla in automatico, apre solo il client di posta
   o WhatsApp Web/app con il messaggio già pronto: l'invio vero resta un click dell'utente lì. */
function testoSollecitoDefault(cliente, scadenza) {
  return `Gentile ${cliente ? cliente.ragioneSociale : ''}, le ricordiamo che il ${fmtData(scadenza.data)} è in scadenza "${scadenza.nome}". Restiamo a disposizione per qualsiasi chiarimento.`;
}
/* Costruisce un mailto: con oggetto e corpo precompilati. Nessuna dipendenza esterna: è lo stesso
   meccanismo di un link "scrivici" su un sito, apre il client di posta predefinito dell'utente. */
function linkMailtoSollecito(email, oggetto, corpo) {
  return `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(oggetto)}&body=${encodeURIComponent(corpo)}`;
}
/* Costruisce un link wa.me con testo precompilato (WhatsApp Web o app, in base al dispositivo).
   Il numero va ripulito da spazi/simboli: wa.me vuole solo cifre (con prefisso internazionale se
   presente, senza lo 00/+ iniziale). Se manca il prefisso internazionale il link comunque prova ad
   aprire la chat con quel numero così com'è: meglio un tentativo che nessun link. */
function linkWhatsappSollecito(telefono, testo) {
  const numero = (telefono || '').replace(/[^\d+]/g, '').replace(/^\+/, '').replace(/^00/, '');
  return `https://wa.me/${numero}?text=${encodeURIComponent(testo)}`;
}
function registraSollecitoScadenza(id, canale, nota) {
  const cur = STATE.scadenzeOverrides[id] || {};
  const solleciti = (cur.solleciti || []).slice();
  const sollecito = { id: uid('sollecito'), data: oggiISO(), canale: canale || CANALI_SOLLECITO[0], nota: (nota || '').trim() };
  solleciti.push(sollecito);
  STATE.scadenzeOverrides[id] = Object.assign({}, cur, { solleciti });
  salvaStato();
  return sollecito;
}

/* -------------------- MOTORE MODELLI DOCUMENTO (task #122-128) --------------------
   Un "modello" è testo libero con segnaposto {{così}}. Quelli NOTI (dati cliente/studio/data,
   vedi PLACEHOLDER_AUTO_LEGENDA) si compilano da soli da STATE; qualunque altro segnaposto
   inventato nel testo del modello diventa automaticamente un campo da compilare quando si crea
   un documento da quel modello — nessuno schema fisso da mantenere, funziona identico per
   Preventivi/Mandati/Lettere di incarico e per i documenti Antiriciclaggio (categoria che inizia
   per "AML"). Il testo generato viene SALVATO come istantanea sul documento (non ricalcolato in
   automatico ogni volta): modificare il modello in seguito non altera i documenti già emessi,
   com'è corretto per un contratto o una dichiarazione già firmata. Un pulsante "Rigenera dal
   modello" nel dettaglio del documento permette di aggiornare volutamente una bozza non ancora
   inviata se il modello o i dati del cliente sono cambiati. */
const PLACEHOLDER_AUTO_LEGENDA = [
  { chiave: 'cliente.ragioneSociale', label: 'Ragione sociale / nome del cliente' },
  { chiave: 'cliente.indirizzo', label: 'Indirizzo completo del cliente' },
  { chiave: 'cliente.piva', label: 'Partita IVA del cliente' },
  { chiave: 'cliente.codiceFiscale', label: 'Codice fiscale del cliente' },
  { chiave: 'cliente.pec', label: 'PEC del cliente' },
  { chiave: 'cliente.email', label: 'Email del cliente' },
  { chiave: 'cliente.telefono', label: 'Telefono del cliente' },
  { chiave: 'studio.nome', label: 'Nome dello studio' },
  { chiave: 'studio.qualifica', label: 'Qualifica professionale (es. Esperto Contabile)' },
  { chiave: 'studio.iscrizione', label: 'Iscrizione albo/ordine' },
  { chiave: 'studio.indirizzo', label: 'Indirizzo dello studio' },
  { chiave: 'studio.cf', label: 'Codice fiscale del professionista' },
  { chiave: 'studio.citta', label: 'Città dello studio (es. per il foro competente)' },
  { chiave: 'data.oggi', label: 'Data odierna (gg/mm/aaaa)' },
  { chiave: 'data.luogoOggi', label: 'Luogo e data odierna (es. "Vicenza, 14/09/2026")' },
];
function valoriAutomaticiPlaceholder(clienteId) {
  const cliente = clienteId ? clienteById(clienteId) : null;
  const contatti = (cliente && cliente.contatti) || {};
  const rigaIndirizzo = [contatti.indirizzo, [contatti.cap, contatti.localita, contatti.provincia].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const oggi = oggiISO();
  return {
    'cliente.ragioneSociale': cliente ? cliente.ragioneSociale : '',
    'cliente.indirizzo': rigaIndirizzo,
    'cliente.piva': cliente ? (cliente.partitaIva || '') : '',
    'cliente.codiceFiscale': cliente ? (cliente.codiceFiscale || '') : '',
    'cliente.pec': contatti.pec || '',
    'cliente.email': contatti.email || '',
    'cliente.telefono': contatti.telefono || '',
    'studio.nome': STATE.meta.studioNome || '',
    'studio.qualifica': STATE.meta.qualifica || '',
    'studio.iscrizione': STATE.meta.iscrizione || '',
    'studio.indirizzo': STATE.meta.indirizzoStudio || '',
    'studio.cf': STATE.meta.cfStudio || '',
    'studio.citta': STATE.meta.citta || 'Vicenza',
    'data.oggi': fmtData(oggi),
    'data.luogoOggi': `${STATE.meta.citta || 'Vicenza'}, ${fmtData(oggi)}`,
  };
}
/* Estrae, nell'ordine di prima comparsa, tutti i segnaposto {{chiave}} presenti in un testo. */
function estraiPlaceholder(corpo) {
  const trovati = [];
  const visti = new Set();
  const re = /\{\{\s*([a-zA-Z0-9_.]+)\s*\}\}/g;
  let m;
  while ((m = re.exec(corpo || '')) !== null) {
    if (!visti.has(m[1])) { visti.add(m[1]); trovati.push(m[1]); }
  }
  return trovati;
}
/* Segnaposto "riservati": corrispondono a campi dedicati del documento (Oggetto, Importo, Data
   emissione, Valido fino), inseriti tramite i loro input specifici nel form e NON come campo
   personalizzato — anche se il modello li referenzia con {{oggetto}} ecc. si risolvono da soli. */
const PLACEHOLDER_RISERVATI = ['oggetto', 'importo', 'dataEmissione', 'validoFino'];
/* Solo i segnaposto del modello che NON sono tra quelli automatici o riservati: sono questi a
   diventare campi del form quando si crea un documento da quel modello. */
function placeholderPersonalizzatiModello(corpo) {
  const auto = new Set(PLACEHOLDER_AUTO_LEGENDA.map(p => p.chiave));
  const riservati = new Set(PLACEHOLDER_RISERVATI);
  return estraiPlaceholder(corpo).filter(k => !auto.has(k) && !riservati.has(k));
}
/* Sostituisce tutti i segnaposto: quelli noti con i valori automatici, quelli personalizzati con
   il valore fornito dall'utente; un segnaposto personalizzato non ancora compilato resta visibile
   tra parentesi quadre invece di sparire in silenzio — meglio un vuoto evidente in una bozza che
   un contratto con un buco invisibile. */
function risolviTemplateDocumento(corpo, clienteId, valoriCustom) {
  const auto = valoriAutomaticiPlaceholder(clienteId);
  const custom = valoriCustom || {};
  return (corpo || '').replace(/\{\{\s*([a-zA-Z0-9_.]+)\s*\}\}/g, (match, chiave) => {
    if (Object.prototype.hasOwnProperty.call(auto, chiave)) return auto[chiave];
    if (Object.prototype.hasOwnProperty.call(custom, chiave) && custom[chiave] !== '') return custom[chiave];
    return `[${chiave}]`;
  });
}
/* Una categoria che inizia per "AML" è trattata come documento antiriciclaggio: vocabolario di
   stato più semplice (Bozza/Firmato) e comparirà nella sezione Documenti del fascicolo
   Antiriciclaggio invece che nella vista Preventivi e mandati. Convenzione di naming, non un
   elenco fisso: basta far iniziare così anche una categoria personalizzata per ottenere lo stesso
   comportamento. */
/* Testo pronto per il campo personalizzato "dettaglioAttivita" del modello (task #138): i modelli
   Preventivo/Mandato di Matteo hanno già {{dettaglioAttivita}} nel punto giusto, quindi qui non
   serve inventare un nuovo tipo di segnaposto — basta compilare quel campo esistente con l'elenco
   delle attività scelte dal catalogo invece di farlo scrivere a mano ogni volta. */
function testoElencoAttivita(elenco) {
  const voci = (elenco || []).filter(a => a && a.nome);
  if (!voci.length) return '';
  const righe = voci.map(a => `- ${a.nome}${a.prezzo != null ? ' — ' + fmtEuro(a.prezzo) : ''}`).join('\n');
  const conPrezzo = voci.some(a => a.prezzo != null);
  if (!conPrezzo) return righe;
  const totale = voci.reduce((s, a) => s + (Number(a.prezzo) || 0), 0);
  return righe + `\nTotale: ${fmtEuro(totale)}`;
}
function categoriaEAml(categoria) { return /^AML/i.test((categoria || '').trim()); }
function statiPerCategoriaDocumento(categoria) {
  return categoriaEAml(categoria) ? ['Bozza', 'Firmato'] : ['Bozza', 'Inviato', 'Accettato', 'Rifiutato'];
}
function classeDocumentoStato(stato) {
  if (stato === 'Accettato' || stato === 'Firmato') return 'stato-inviato-telematicamente';
  if (stato === 'Rifiutato') return 'stato-errore';
  if (stato === 'Inviato') return 'stato-da-fare';
  return 'info'; // Bozza

  const corpo = risolviTemplateDocumento(modello.corpo, clienteId, Object.assign({}, valoriRiservati, valoriCustom || {}));
  return aggiungiPreventivo({
    clienteId, categoria: modello.categoria, modelloId, nomeModello: modello.nome,
    oggetto, importo: importo != null ? importo : null, dataEmissione: dataEm, validoFino: validoFino || null,

/* -------------------- PRECOMPILAZIONE IMPORTI STATUTARI --------------------
   Alcuni importi (diritto camerale, tassa vidimazione libri sociali...) sono fissati dalla legge
   e variano in modo prevedibile in base a dati anagrafici del cliente (capitale sociale, numero di
   sedi secondarie) — non c'è motivo di ridigitarli ogni volta a mano. A differenza di un semplice
   automatismo però questi importi CAMBIANO nel tempo (decreti, aggiornamenti normativi) ed è lo
   studio a doverli tenere aggiornati: qui c'è quindi un motore di REGOLE configurabili (in
   Impostazioni), non valori fissi nel codice. Ogni regola calcola un importo suggerito, mai
   applicato in automatico senza che l'utente lo veda e possa correggerlo. */
function clonaRegoleImportiStatutariDefault() {
  // Seed di partenza, NON dati di legge verificati per l'anno corrente: solo la struttura tipica
  // (soglia di capitale sociale per la tassa vidimazione libri, maggiorazione per sede secondaria
  // sul diritto camerale) da compilare/correggere in Impostazioni con gli importi in vigore.
  return [

      importoBase: 200.00, sogliaCapitaleSociale: 516456.90, importoSopraSoglia: 309.87, importoPerSedeAggiuntiva: 0,
      nota: 'Struttura a due scaglioni in base al capitale sociale (soglia storica € 516.456,90) — verifica sempre gli importi in vigore prima di affidarti al suggerimento.' },
    { id: uid('regstat'), chiave: 'DIRITTO_CAMERALE', nome: 'Diritto camerale',

      nota: 'Varia per fascia di fatturato/tipo società (delibera annuale delle Camere di Commercio): compila importoBase e l\'eventuale maggiorazione per sede secondaria con i valori correnti.' },
  ];

/* Calcola l'importo suggerito per una chiave adempimento e un cliente, secondo la prima regola
   configurata che corrisponde. Torna null se non c'è nessuna regola per quella chiave, o se la
   regola esiste ma non ha ancora un importoBase compilato (evita di suggerire "€0,00" come se
   fosse un valore vero). */
function calcolaImportoStatutario(chiave, cliente) {
  if (!chiave || !cliente) return null;
  const regola = (STATE.regoleImportiStatutari || []).find(r => r.chiave === chiave);
  if (!regola) return null;
  const capitale = cliente.capitaleSociale;
  let importo = (regola.sogliaCapitaleSociale != null && capitale != null && capitale > regola.sogliaCapitaleSociale)
    ? regola.importoSopraSoglia
    : regola.importoBase;
  if (importo == null || (importo === 0 && !(regola.importoPerSedeAggiuntiva > 0))) return null;
  importo += (regola.importoPerSedeAggiuntiva || 0) * (cliente.numeroSedi || 0);
  return Math.round(importo * 100) / 100;
}

  STATE.regoleImportiStatutari.push(Object.assign({ id: uid('regstat') }, r));

}

/* Cancellazione cliente con cascata sui dati personali collegati (gap GDPR individuato dall'audit
   compliance: prima questa funzione toglieva SOLO il cliente da STATE.clienti, lasciando orfani
   documenti, comunicazioni, ritenute, task, F24, contabilità e le note storiche su scadenze/annuali
   — tutti dati che possono contenere informazioni personali su persone fisiche (titolare, soci,
   dipendenti nelle buste paga) e che un "cancella cliente" deve portare via con sé, non lasciare
   in giro senza più un'anagrafica a cui sono collegati). Non tocca STATE.soci: una persona lì può
   essere collegata anche ad altri clienti (clienteIds è un array), quindi si toglie solo il
   collegamento con QUESTO cliente, non l'intera scheda socio/referente. */
function eliminaCliente(id) {
  // File fisici (se server.js è attivo): stessa logica "non cancellare se condiviso" già usata da
  // eliminaComunicazione/eliminaF24 per non rompere link incrociati tra le due entità.
  STATE.documenti.filter(d => d.clienteId === id).forEach(d => { if (d.filePercorso) eliminaFileReale(d.filePercorso); });
  STATE.comunicazioni.filter(c => c.clienteId === id).forEach(c => {
    if (c.filePercorso && !STATE.f24.some(f => f.filePercorso === c.filePercorso && f.clienteId !== id)) eliminaFileReale(c.filePercorso);
  });
  STATE.f24.filter(f => f.clienteId === id).forEach(f => {
    if (f.filePercorso && !STATE.comunicazioni.some(c => c.filePercorso === f.filePercorso && c.clienteId !== id)) eliminaFileReale(f.filePercorso);
  });
  (STATE.documentiContabili[id] || []).forEach(d => { if (d.filePercorso) eliminaFileReale(d.filePercorso); });

  // Entità in array, filtrate via clienteId diretto sull'oggetto.
  STATE.documenti = STATE.documenti.filter(d => d.clienteId !== id);
  STATE.comunicazioni = STATE.comunicazioni.filter(c => c.clienteId !== id);
  STATE.f24 = STATE.f24.filter(f => f.clienteId !== id);
  STATE.ritenuteRighe = STATE.ritenuteRighe.filter(r => r.clienteId !== id);
  STATE.taskTeam = STATE.taskTeam.filter(t => t.clienteId !== id);
  STATE.preventivi = STATE.preventivi.filter(p => p.clienteId !== id);

  // Entità tenute in oggetti indicizzati per clienteId: basta togliere la chiave.
  delete STATE.onboarding[id];
  delete STATE.antiriciclaggio[id];
  delete STATE.bilanci[id];
  delete STATE.contoMappings[id];
  delete STATE.movimentiContabili[id];
  delete STATE.fattureContabili[id];
  delete STATE.importProfili[id];
  delete STATE.documentiContabili[id];
  delete STATE.contiCliente[id];

  // scadenzeOverrides/annualiOverrides sono chiavi composite "campo1|clienteId|campo3" (vedi
  // chiaveScadenza e generaAdempimentiAnnuali): il clienteId è sempre il secondo segmento, quindi
  // si individuano senza dover ricostruire le scadenze/annuali derivate per ogni anno passato.
  Object.keys(STATE.scadenzeOverrides).forEach(k => { if (k.split('|')[1] === id) delete STATE.scadenzeOverrides[k]; });
  Object.keys(STATE.annualiOverrides).forEach(k => { if (k.split('|')[1] === id) delete STATE.annualiOverrides[k]; });

  // Soci/referenti: si scollega il cliente eliminato, non si tocca la persona (può essere
  // collegata ad altri clienti, o restare come contatto anche senza incarichi attivi).
  STATE.soci.forEach(s => { s.clienteIds = (s.clienteIds || []).filter(cid => cid !== id); });

  STATE.clienti = STATE.clienti.filter(c => c.id !== id);
  salvaStato();
}
/* Token di accesso al portale cliente reale (task #87): a differenza di uid() — pensato per id
   interni dove conta evitare collisioni, non l'imprevedibilità — questo è un vero token di
   sicurezza che finisce in un link mandato al cliente, quindi serve un generatore
   crittograficamente robusto (Math.random() NON lo è). 24 byte casuali = 192 bit, ampiamente
   sufficiente perché indovinarlo per tentativi sia impraticabile. */
function generaTokenPortale() {
  const cripto = (typeof window !== 'undefined' && window.crypto) || (typeof crypto !== 'undefined' ? crypto : null);
  const bytes = new Uint8Array(24);
  if (cripto && cripto.getRandomValues) {
    cripto.getRandomValues(bytes);
  } else {
    // Ripiego solo per ambienti senza Web Crypto (non dovrebbe mai servire in un browser vero):
    // meglio di niente, ma va sostituito se questo ramo viene davvero eseguito.
    for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  }
  return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
}
/* Attiva (o rigenera) l'accesso portale per un cliente: un nuovo token rende ISTANTANEAMENTE
   inutilizzabile qualunque link mandato in precedenza (il vecchio token non corrisponde più a
   nessun cliente), quindi "rigenera" è anche il modo per revocare un link che si teme sia finito
   nelle mani sbagliate senza disattivare del tutto l'accesso. */
function attivaPortaleCliente(id) {
  const c = clienteById(id);
  if (!c) return null;
  c.portaleToken = generaTokenPortale();
  if (!c.portaleAttivatoIl) c.portaleAttivatoIl = oggiISO();
  salvaStato();
  return c;
}
function disattivaPortaleCliente(id) {
  const c = clienteById(id);
  if (!c) return null;
  c.portaleToken = null;
  salvaStato();
  return c;
}

function renderNav() {
  const nav = document.getElementById('navMenu');
  let html = '';
  for (const g of NAV) {
    html += `<div class="navgroup">${escapeHtml(g.group)}</div>`;
    for (const it of g.items) {
      html += `<div class="navitem ${VIEW===it.id?'active':''}" data-nav="${it.id}"><span class="ic">${it.ic||''}</span>${escapeHtml(it.label)}</div>`;
    }
  }
  nav.innerHTML = html;
  document.getElementById('brandSub').textContent = STATE.meta.studioNome || 'Studio';
  document.getElementById('sidebarFoot').textContent = `${STATE.clienti.length} clienti · ${STATE.annoCorrente}`;
}

function renderAnnoSelect() {
  const sel = document.getElementById('annoSelect');
  const annoOggi = new Date().getFullYear();
  const anni = new Set([annoOggi-1, annoOggi, annoOggi+1, STATE.annoCorrente, ...(STATE.meta.anniExtra||[])]);
  sel.innerHTML = Array.from(anni).sort().map(a => `<option value="${a}" ${a===STATE.annoCorrente?'selected':''}>${a}</option>`).join('');
}

function setView(view, params) {
  VIEW = view;
  VIEW_PARAMS = params || {};
  render();
  try { window.scrollTo(0,0); } catch (e) {}
}

function render() {
  renderNav();
  renderAnnoSelect();
  aggiornaBadgeOperatore();
  const [title, sub] = PAGE_TITLES[VIEW] || ['', ''];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;
  const content = document.getElementById('content');
  switch (VIEW) {
    case 'dashboard': content.innerHTML = renderDashboard(); break;
    case 'calendario': content.innerHTML = renderCalendario(); break;
    case 'clienti': content.innerHTML = renderClienti(); break;
    case 'azioni': content.innerHTML = renderAzioni(); break;
    case 'rubrica': content.innerHTML = renderRubrica(); break;
    case 'schedacliente': content.innerHTML = renderSchedaCliente(); break;
    case 'soci': content.innerHTML = renderSoci(); break;
    case 'scadenze': content.innerHTML = renderScadenze(); break;
    case 'ritenute': content.innerHTML = renderRitenute(); break;
    case 'annuali': content.innerHTML = renderAnnuali(); break;
    case 'f24': content.innerHTML = renderF24(); break;
    case 'taskteam': content.innerHTML = renderTaskTeam(); break;
    case 'onboarding': content.innerHTML = renderOnboarding(); break;
    case 'antiriciclaggio': content.innerHTML = renderAntiriciclaggio(); break;

let DASH_RESP = 'Tutti';
function renderDashboard() {
  if (STATE.clienti.length === 0) {

  const { tutteScadenze, annuali } = derivati();

  const { scaduti, inScadenza, futuri, completati } = classificaScadenze(filtrate, oggiISO());

  const respOptions = ['Tutti'].concat(STATE.meta.responsabili);
  const filtroHtml = `<div class="toolbar"><div class="field"><label>Filtra per responsabile</label>
    <select data-action="dash-resp">${respOptions.map(r=>`<option value="${escapeHtml(r)}" ${r===DASH_RESP?'selected':''}>${escapeHtml(r)}</option>`).join('')}</select>

  const kpi = `<div class="kpi-grid">

    <div class="kpi inscadenza" data-action="goto-scadenze" data-filtro="inscadenza"><div class="n">${inScadenza.length}</div><div class="l">IN SCADENZA (30GG)</div></div>

  </div>`;

  const rigaScadenza = (s) => {

  const sezioneScaduti = scaduti.length ? `<div class="card">

  const sezioneInScadenza = `<div class="card">
    <div class="section-title">🟡 In scadenza nei prossimi 30 giorni <span class="cnt">${inScadenza.length}</span></div>

    <tbody>${inScadenza.slice(0,8).sort((a,b)=>a.data.localeCompare(b.data)).map(rigaScadenza).join('')}</tbody></table>
    ${inScadenza.length>8?`<div style="margin-top:10px;"><button class="btn small" data-action="goto-scadenze" data-filtro="inscadenza">Vedi tutte le ${inScadenza.length} →</button></div>`:''}`

  </div>`;

  const annualiIncompleti = annuali.filter(a => !a.completato).sort((a,b)=>b.percentuale-a.percentuale).slice(0,6);

  const sezioneOnboarding = `<div class="card">
