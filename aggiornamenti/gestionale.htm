/* Task #88 nell'anteprima: stessa area cliente interattiva del portale VERO (portale-cliente.htm —
   box "scrivi allo studio", "Chiedi info su questa scadenza", risposte ai thread), riproposta qui
   dentro l'anteprima così Matteo può vedere/provare esattamente cosa vedrebbe il cliente, senza
   dover attivare un accesso portale reale né avere server.js acceso (l'anteprima gira sempre,
   legge/scrive direttamente STATE in memoria). */
let PORTAL_PREVIEW_PREFILL_SCAD = null; // {id, nome} - riferimento scadenza pre-compilato dal box "scrivi"
let PORTAL_PREVIEW_RISPOSTA_APERTA = null; // id della comunicazione con il box risposta espanso, o null

/* Stessa validazione/creazione di aggiungiMessaggioPortaleClienteEsterno più sotto, ma senza il
   livello di token: qui il "chiamante" è Matteo dentro il proprio gestionale, non un cliente
   esterno da verificare. Le due funzioni condividono lo stesso nucleo (_creaMessaggioCliente) così
   la logica di creazione non è mai duplicata - solo il modo in cui si risolve il cliente cambia. */
// fileInfo (task #108): { percorso, nomeFile, dimensione } se il cliente ha allegato un file al
// messaggio (es. il documento che lo studio gli aveva chiesto) - null/omesso altrimenti. Chi
// chiama si occupa SEMPRE di salvare il file reale (uploadFileReale in anteprima, il server via
// server.js per il portale vero) PRIMA di arrivare qui: questa funzione si limita ad attaccarne i
// metadati al messaggio, esattamente come già succede per gli allegati lato studio.
function _creaMessaggioCliente(cliente, testo, scadenzaIdRif, fileInfo) {
  if (!cliente) return null;
  const t = (testo || '').trim().slice(0, 4000);
  if (!t) return null;
  let rif = null;
  if (scadenzaIdRif) {
    const scad = derivati().tutteScadenze.find(s => s.id === scadenzaIdRif && s.clienteId === cliente.id);
    if (scad) rif = { id: scad.id, nome: scad.nome, data: scad.data };
  }
  const msg = {
    id: uid('com'), clienteId: cliente.id, data: oggiISO(), direzione: 'cliente',
    categoria: rif ? 'Richiesta su scadenza' : 'Domanda dal cliente',
    oggetto: rif ? ('Richiesta su: ' + rif.nome) : 'Domanda dal portale cliente',
    corpo: t, stato: 'Inviata', visibilePortale: true, vistaPortale: true, vistaStudio: false,
    scadenzaRif: rif, risposte: [],
  };
  if (fileInfo && fileInfo.percorso) {
    msg.filePercorso = fileInfo.percorso; msg.fileNome = fileInfo.nomeFile; msg.fileDimensione = fileInfo.dimensione;
  }
  STATE.comunicazioni.push(msg);
  salvaStato();
  return msg;
}
function messaggioClientePreview(clienteId, testo, scadenzaIdRif, fileInfo) {
  return _creaMessaggioCliente(clienteById(clienteId), testo, scadenzaIdRif, fileInfo);
}
function rispostaClientePreview(clienteId, comunicazioneId, testo, fileInfo) {
  const c = STATE.comunicazioni.find(x => x.id === comunicazioneId && x.clienteId === clienteId && x.visibilePortale !== false);
  if (!c) return null;
  return aggiungiRispostaComunicazione(comunicazioneId, testo, 'cliente', fileInfo);
}

/* Dati del portale per un cliente, calcolati una volta e usati dalla vista desktop a schermo intero
   (contenutoDesktopPortale) - isolati qui in una funzione a parte così, se in futuro si aggiunge
   un'altra presentazione della stessa vista, i dati restano un'unica fonte di verità. */
function datiPortaleCliente(cliente) {
  const { tutteScadenze, annuali } = derivati();
  const scadenzeClienteTutte = tutteScadenze.filter(s => s.clienteId === cliente.id && !STATI_SCADENZA_CHIUSI.includes(s.stato))
    .sort((a,b) => a.data.localeCompare(b.data));
  const scadenzeCliente = scadenzeClienteTutte.slice(0, 5);
  const annualiCliente = annuali.filter(a => a.clienteId === cliente.id);
  const annualiIncompleti = annualiCliente.filter(a => !a.completato).length;
  const comClienteTutte = STATE.comunicazioni.filter(c => c.clienteId === cliente.id && c.stato === 'Inviata' && c.visibilePortale !== false)
    .sort((a,b) => (b.data||'').localeCompare(a.data||''));
  const comCliente = comClienteTutte.filter(c => !c.archiviataPortale);
  const comClienteArchiviate = comClienteTutte.filter(c => c.archiviataPortale);
  const comClienteNonLette = comCliente.filter(c => !c.vistaPortale).length;
  const docCliente = STATE.documenti.filter(d => d.clienteId === cliente.id).sort((a,b)=>(b.dataCaricamento||'').localeCompare(a.dataCaricamento||''));
  const pctOnboarding = percentualeOnboarding(STATE.onboarding[cliente.id]);
  const anniBilancioPortale = anniBilancioCliente(cliente.id);
  return { scadenzeClienteTutte, scadenzeCliente, annualiCliente, annualiIncompleti, comClienteTutte, comCliente, comClienteArchiviate, comClienteNonLette, docCliente, pctOnboarding, anniBilancioPortale };
}

/* -------------------- PORTALE CLIENTE ESTERNO (accesso reale, task #87) --------------------
   Le funzioni sopra (datiPortaleCliente, contenutoDesktopPortale) sono
   pensate per l'ANTEPRIMA interna: girano dentro il gestionale, che ha già l'intero STATE in
   memoria (tutti i clienti) — lì va benissimo, perché a usarle è personale dello studio.
   Per un cliente esterno che accede tramite link con token (vedi attivaPortaleCliente) la
   situazione è diversa: quel browser NON deve mai ricevere un solo byte relativo ad altri
   clienti, nemmeno dentro una risposta di rete che poi "semplicemente non viene mostrata a
   schermo" — è la differenza tra un filtro estetico e un isolamento vero. Per questo:
     - server.js NON manda mai gestionale.htm né l'intero dati-studio.json a un cliente esterno;
       carica invece questo stesso file in un motore headless (jsdom, già usato per i test) e
       chiama SOLO costruisciVistaPortaleClienteEsterna(token), che ritorna già il JSON minimo e
       filtrato da spedire — vedi window.costruisciVistaPortaleClienteEsterna più sotto.
     - i documenti/allegati non espongono mai il percorso reale sul disco (filePercorso): la vista
       ritorna solo un "documentoToken" opaco, che il cliente-facing (portale-cliente.htm) rimanda
       al server per il download; risolviDocumentoPortaleEsterno verifica che quel documento
       appartenga DAVVERO al cliente del token prima di risolverlo a un percorso reale.
     - se il token non corrisponde a nessun cliente attivo (mai attivato, rigenerato, disattivato)
       si ritorna null: chi chiama risponde con un errore generico, senza indizi su "perché". */
function costruisciVistaPortaleClienteEsterna(token) {
  if (!token || typeof token !== 'string') return null;
  const cliente = STATE.clienti.find(c => c.portaleToken && c.portaleToken === token);
  if (!cliente) return null;

  const { scadenzeClienteTutte, annualiCliente, annualiIncompleti, comCliente, comClienteArchiviate, comClienteNonLette, docCliente, pctOnboarding, anniBilancioPortale } = datiPortaleCliente(cliente);
  const contattiC = cliente.contatti || {};

  const azienda = {
    ragioneSociale: cliente.ragioneSociale,
    tipo: labelTipoCliente(cliente.tipo),
    regimeFiscale: cliente.regimeFiscale || null,
    settore: cliente.settore || null,
    clienteDal: cliente.annoIngresso || null,
    partitaIva: cliente.partitaIva || null,
    codiceFiscale: cliente.codiceFiscale || null,
    sede: [contattiC.indirizzo, [contattiC.cap, contattiC.localita].filter(Boolean).join(' '), contattiC.provincia].filter(Boolean).join(', ') || null,
    email: contattiC.email || null,
    telefono: contattiC.telefono || null,
    pec: contattiC.pec || null,
    referenteStudio: cliente.responsabileStudio || null,
    nomeStudio: STATE.meta.studioNome || 'Studio',
  };

  const mappaCom = (c) => ({
    id: c.id,
    oggetto: c.oggetto,
    data: c.data,
    categoria: categoriaComunicazione(c),
    corpo: c.corpo || null,
    nuova: !c.vistaPortale,
    direzione: c.direzione === 'cliente' ? 'cliente' : 'studio',
    richiestaChiusa: c.direzione === 'cliente' ? !!c.richiestaChiusa : false,
    scadenzaRif: c.scadenzaRif || null,
    risposte: (c.risposte || []).map(r => ({
      autore: r.autore === 'cliente' ? 'cliente' : 'studio', testo: r.testo, data: r.data,
      allegato: r.filePercorso ? { nome: r.fileNome || 'Allegato', documentoToken: 'risp_' + r.id } : null,
    })),
    allegato: c.filePercorso ? { nome: c.fileNome || 'Allegato', documentoToken: 'com_' + c.id } : null,
  });
  const comunicazioni = comCliente.map(mappaCom);
  const comunicazioniArchiviate = comClienteArchiviate.map(mappaCom);

  const scadenze = scadenzeClienteTutte.map(s => ({
    id: s.id,
    nome: s.nome,
    tipo: s.tipo || null,
    data: s.data,
    importo: (typeof s.importo === 'number') ? s.importo : null,
    stato: s.stato,
    delta: deltaLabel(s.data),
  }));

  const documenti = docCliente.map(d => ({
    id: d.id,
    nome: d.nome,
    categoria: d.categoria,
    dataCaricamento: d.dataCaricamento || null,
    dataScadenza: d.dataScadenza || null,
    documentoToken: d.filePercorso ? ('doc_' + d.id) : null,
  }));

  let andamento = null;
  if (anniBilancioPortale.length > 0) {
    const ultimoAnno = anniBilancioPortale[anniBilancioPortale.length - 1];
    const dB = calcolaDerivatiBilancio(STATE.bilanci[cliente.id][ultimoAnno]);
    andamento = {
      etichettaUltimoPeriodo: etichettaEstesaBilancio(ultimoAnno),
      ricavi: (typeof dB.ricavi === 'number') ? dB.ricavi : null,
      utileNetto: (typeof dB.utileNetto === 'number') ? dB.utileNetto : null,
      roe: (typeof dB.roe === 'number') ? dB.roe : null,
      serieRicavi: anniBilancioPortale.map(a => ({ etichetta: etichettaBreveBilancio(a), valore: STATE.bilanci[cliente.id][a].ricavi || 0 })),
      serieUtile: anniBilancioPortale.map(a => ({ etichetta: etichettaBreveBilancio(a), valore: calcolaDerivatiBilancio(STATE.bilanci[cliente.id][a]).utileNetto || 0 })),
    };
  }

  return {
    azienda,
    numeri: {
      scadenzeAperte: scadenzeClienteTutte.length,
      comunicazioniDaLeggere: comClienteNonLette,
      documentiCondivisi: docCliente.length,
      percorsoOnboardingCompletato: pctOnboarding,
      adempimentiAnnualiCompletati: annualiCliente.length - annualiIncompleti,
      adempimentiAnnualiTotali: annualiCliente.length,
    },
    comunicazioni,
    comunicazioniArchiviate,
    scadenze,
    documenti,
    andamento,
  };
}

/* Risolve un download richiesto dal portale esterno: dato il token di accesso del cliente e un
   "documentoToken" opaco (mai il percorso reale sul disco — vedi sopra), ritorna il percorso solo
   se il documento/allegato appartiene DAVVERO al cliente di quel token. Usata da server.js prima
   di servire il file: senza questo controllo, un cliente che conoscesse/indovinasse l'id interno
   di un documento altrui potrebbe scaricarlo passando solo il proprio token valido. */
function risolviDocumentoPortaleEsterno(token, documentoToken) {
  if (!token || !documentoToken || typeof documentoToken !== 'string') return null;
  const cliente = STATE.clienti.find(c => c.portaleToken && c.portaleToken === token);
  if (!cliente) return null;
  if (documentoToken.indexOf('doc_') === 0) {
    const docId = documentoToken.slice(4);
    const d = STATE.documenti.find(x => x.id === docId && x.clienteId === cliente.id);
    if (d && d.filePercorso) return { filePercorso: d.filePercorso, nomeFile: d.nome };
  } else if (documentoToken.indexOf('com_') === 0) {
    const comId = documentoToken.slice(4);
    const c = STATE.comunicazioni.find(x => x.id === comId && x.clienteId === cliente.id && x.visibilePortale !== false);
    if (c && c.filePercorso) return { filePercorso: c.filePercorso, nomeFile: c.fileNome || 'Allegato' };
  } else if (documentoToken.indexOf('risp_') === 0) {
    // Allegato su UNA RISPOSTA (task #108, non sulla comunicazione originale): va cercato dentro
    // le risposte di una comunicazione che appartenga davvero a questo cliente e sia visibile nel
    // portale — stessa cautela di sopra, solo un livello più in profondità.
    const rispId = documentoToken.slice(5);
    const comCandidata = STATE.comunicazioni.find(x => x.clienteId === cliente.id && x.visibilePortale !== false && (x.risposte || []).some(r => r.id === rispId));
    const risp = comCandidata ? comCandidata.risposte.find(r => r.id === rispId) : null;
    if (risp && risp.filePercorso) return { filePercorso: risp.filePercorso, nomeFile: risp.fileNome || 'Allegato' };
  }
  return null;
}

/* Aggiunge una risposta a un thread di comunicazione (task #88): usata sia dallo studio (dentro
   gestionale.htm, dal modale del thread) sia — tramite aggiungiRispostaPortaleClienteEsterno più
   sotto — da un cliente esterno che risponde dal portale. Una risposta dello studio segna il
   thread come "letto per il cliente" di nuovo da leggere (vistaPortale=false, torna "Nuova" nel
   suo portale) e come letto per lo studio (vistaStudio=true, l'ha appena scritta lui); una
   risposta del cliente fa l'esatto opposto - riapre il thread come "da leggere" per lo studio. */
function aggiungiRispostaComunicazione(id, testo, autore, fileInfo) {
  const c = STATE.comunicazioni.find(x => x.id === id);
  if (!c) return null;
  const t = (testo || '').trim().slice(0, 4000);
  if (!t) return null;
  if (!Array.isArray(c.risposte)) c.risposte = [];
  // operatore (task #98): solo attribuzione/audit di CHI dello studio ha risposto - null se su
  // questo browser non è stato scelto un nome, o se a rispondere è il cliente (non pertinente).
  const risp = { id: uid('risp'), autore: autore === 'cliente' ? 'cliente' : 'studio', testo: t, data: oggiISO() };
  if (risp.autore === 'studio') risp.operatore = operatoreCorrente() || null;
  // fileInfo (task #108): un cliente che risponde a un thread — tipicamente perché lo studio gli
  // ha chiesto un documento — può allegare un file. Stessa idea degli allegati sulle comunicazioni:
  // qui arrivano già i metadati di un file già salvato per davvero da chi ha chiamato.
  if (fileInfo && fileInfo.percorso) {
    risp.filePercorso = fileInfo.percorso; risp.fileNome = fileInfo.nomeFile; risp.fileDimensione = fileInfo.dimensione;
  }
  c.risposte.push(risp);
  if (autore === 'cliente') { c.vistaStudio = false; }
  else { c.vistaStudio = true; c.vistaPortale = false; }
  salvaStato();
  return c;
}

/* -------------------- AREA CLIENTE INTERATTIVA (task #88) --------------------
   Fin qui (task #87) il portale esterno era di sola lettura: il cliente vedeva i propri dati ma
   non poteva scrivere nulla. Qui si apre la direzione opposta - un cliente che scrive un messaggio
   nuovo (una domanda generica, o legata a una scadenza specifica: "a che punto siamo con l'IVA di
   agosto?") o risponde a un thread esistente. Stessa cautela di sicurezza di tutto il resto del
   portale esterno: il chiamante (server.js, tramite il motore headless) passa SEMPRE un token, non
   un clienteId - è la funzione stessa a risolvere il cliente e a verificare che qualunque cosa
   referenziata (una scadenza, un thread) appartenga davvero a lui, non fidandosi di id passati da
   fuori. Il testo viene comunque troncato a una lunghezza ragionevole: qui non è un limite di
   sicurezza (non è codice eseguibile), solo per evitare che un campo libero cresca senza limiti. */
function aggiungiMessaggioPortaleClienteEsterno(token, testo, scadenzaIdRif, fileInfo) {
  if (!token || typeof token !== 'string') return null;
  const cliente = STATE.clienti.find(c => c.portaleToken && c.portaleToken === token);
  // La creazione vera e propria (validazione testo, ricalcolo scadenzaRif dal motore di
  // derivazione - mai fidandosi di nome/data passati dall'esterno) è condivisa con l'anteprima
  // interna (messaggioClientePreview più sopra): vedi _creaMessaggioCliente. fileInfo (task #108)
  // arriva già scritto su disco da server.js - qui si limita ad essere attaccato al messaggio.
  return _creaMessaggioCliente(cliente, testo, scadenzaIdRif, fileInfo);
}

/* Risposta di un cliente esterno a un thread ESISTENTE (una comunicazione che lo studio gli ha
   mandato, o una sua stessa domanda precedente). Verifica che quel thread appartenga davvero al
   cliente del token e sia effettivamente visibile nel portale - altrimenti un cliente non potrebbe
   in nessun modo rispondere a/scoprire l'esistenza di comunicazioni di altri clienti anche
   indovinandone l'id. */
function aggiungiRispostaPortaleClienteEsterno(token, comunicazioneId, testo, fileInfo) {
  if (!token || !comunicazioneId) return null;
  const cliente = STATE.clienti.find(c => c.portaleToken && c.portaleToken === token);
  if (!cliente) return null;
  const c = STATE.comunicazioni.find(x => x.id === comunicazioneId && x.clienteId === cliente.id && x.visibilePortale !== false);
  if (!c) return null;
  return aggiungiRispostaComunicazione(comunicazioneId, testo, 'cliente', fileInfo);
}

  let corpoAndamento;
  if (anniBilancioPortale.length === 0) {
    corpoAndamento = `<div class="pd-empty">Non appena carichiamo i dati del bilancio, qui trovi un riepilogo semplice dell'andamento — ricavi, utile e qualche indicatore chiave.</div>`;
  } else {
    const ultimoAnnoP = anniBilancioPortale[anniBilancioPortale.length - 1];
    const dP = calcolaDerivatiBilancio(STATE.bilanci[cliente.id][ultimoAnnoP]);
    const puntiRicaviP = anniBilancioPortale.map(a => ({ label: etichettaBreveBilancio(a), valore: STATE.bilanci[cliente.id][a].ricavi || 0 }));
    const puntiUtileP = anniBilancioPortale.map(a => ({ label: etichettaBreveBilancio(a), valore: calcolaDerivatiBilancio(STATE.bilanci[cliente.id][a]).utileNetto }));
    corpoAndamento = `
      <div style="font-size:11px;font-weight:700;color:var(--text-mut);text-transform:uppercase;margin:0 0 10px;">${escapeHtml(etichettaEstesaBilancio(ultimoAnnoP))} · Ricavi ${fmtEuro(dP.ricavi)} · Utile netto ${fmtEuro(dP.utileNetto)} · ROE ${fmtPct(dP.roe)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">
        <div><div style="font-size:10.5px;font-weight:700;color:var(--text-mut);text-transform:uppercase;margin:0 0 6px;">Andamento ricavi</div>${graficoBarreSvg(puntiRicaviP)}</div>
        <div><div style="font-size:10.5px;font-weight:700;color:var(--text-mut);text-transform:uppercase;margin:0 0 6px;">Andamento utile netto</div>${graficoBarreSvg(puntiUtileP)}</div>
      </div>`;
  }
  const panelAndamento = `<div class="pd-panel span2">${panelHeader(PD_ICONE.and, 'var(--verde-bg)', 'var(--verde)', 'Andamento')}${corpoAndamento}</div>`;

  let corpo;
  if (PORTAL_DESKTOP_TAB === 'comunicazioni') corpo = panelCom;
  else if (PORTAL_DESKTOP_TAB === 'scadenze') corpo = panelScad;
  else if (PORTAL_DESKTOP_TAB === 'documenti') corpo = panelDoc;
  else if (PORTAL_DESKTOP_TAB === 'andamento') corpo = panelAndamento;
  else corpo = panelAzienda + panelComBreakdown + panelNumeri;

  return `<div class="pd-hero">
    <div class="eyebrow">Il tuo spazio con ${escapeHtml(nomeStudio)}</div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;">${escapeHtml(iniziali)}</div>
      <div>
        <h1>Ciao, ${escapeHtml(cliente.ragioneSociale)}</h1>
        <div class="sub">Qui trovi in un colpo d'occhio le comunicazioni, i documenti e le scadenze che ti riguardano — sempre aggiornato, senza dover scrivere per chiedere.</div>
      </div>
    </div>
    <div class="pd-stats">${stats}</div>
  </div>
  ${nav}
  <div class="pd-body">${corpo}</div>`;
}

/* Task #111: tabella "Accesso di tutti i clienti" in cima alla pagina, per
   attivare/copiare/rigenerare/disattivare il link di QUALSIASI cliente con un click, senza doverlo
   prima selezionare nel menu qui sotto. */
function tabellaAccessoPortaleClienti(attivi) {
  if (!HTTP_SYNC_ATTIVO) {
    return `<div class="helptext" style="margin-bottom:14px;">Per attivare un link vero (raggiungibile da fuori dal gestionale) serve il server locale acceso — vedi Impostazioni → Server e sincronizzazione. Nel frattempo l'anteprima qui sotto funziona comunque.</div>`;
  }
  const righe = attivi.map(c => {
    const link = c.portaleToken ? (location.origin + '/portale/' + c.portaleToken) : '';
    const azioni = c.portaleToken
      ? `<button class="btn small" data-action="portale-copia-link" data-link="${escapeHtml(link)}">Copia link</button>
         <button class="btn small" data-action="portale-rigenera-link" data-id="${c.id}" title="Genera un nuovo link: quello vecchio smette subito di funzionare">Rigenera</button>
         <button class="btn small danger" data-action="portale-disattiva-accesso" data-id="${c.id}">Disattiva</button>`
      : `<button class="btn small primary" data-action="portale-attiva-accesso" data-id="${c.id}">Attiva accesso</button>`;
    return `<tr>
      <td>${escapeHtml(c.ragioneSociale)}</td>
      <td>${c.portaleToken ? '<span class="badge stato-inviato-telematicamente">Attivo</span>' : '<span class="badge">Non attivo</span>'}</td>
      <td style="white-space:nowrap;">${c.portaleToken && c.portaleAttivatoIl ? fmtData(c.portaleAttivatoIl) : '—'}</td>
      <td style="white-space:nowrap;">${azioni}</td>
    </tr>`;
  }).join('');
  return `<div class="card" style="padding:0;overflow-x:auto;margin-bottom:16px;">
    <table class="compact"><thead><tr><th>Cliente</th><th>Accesso portale</th><th>Attivo dal</th><th>Gestisci</th></tr></thead>
    <tbody>${righe}</tbody></table>
  </div>`;
}

function renderPortaleCliente() {
  const attivi = STATE.clienti.filter(c => c.stato !== 'cessato').sort((a,b)=>a.ragioneSociale.localeCompare(b.ragioneSociale));
  if (attivi.length === 0) {
    return `<div class="card"><div class="empty"><div class="big">Nessun cliente attivo</div>Aggiungi un cliente per vedere l'anteprima del portale.</div></div>`;
  }
  if (!PORTAL_CLIENTE || !attivi.find(c=>c.id===PORTAL_CLIENTE)) PORTAL_CLIENTE = attivi[0].id;

  const banner = `<div class="portal-banner"><span class="tag-anteprima">Anteprima</span> Per dare a un cliente un accesso VERO (un link che apre solo i suoi dati, utilizzabile da computer o telefono) usa la tabella qui sopra, o scegli il cliente qui sotto per il suo link e — se vuoi vedere esattamente cosa vedrebbe lui — l'anteprima a schermo intero.</div>`;

  const toolbar = `<div class="toolbar">
    <div class="field grow"><label>Cliente</label><select data-action="portal-seleziona-cliente">

/* Card "Accesso portale reale" (task #87): a differenza dell'anteprima sopra (che gira SEMPRE,
   anche senza server.js, perché legge STATE già in memoria nel browser dello studio), questa
   richiede il server locale attivo — è lui che, tramite il motore headless in server.js, serve
   /portale/<token> ai clienti esterni senza mai mandare loro l'intero archivio. Senza server.js
   acceso il link non porterebbe da nessuna parte, quindi qui lo diciamo chiaramente invece di

function cardAccessoPortaleReale(cliente) {

    </div>`;
  }
  const link = cliente.portaleToken ? (location.origin + '/portale/' + cliente.portaleToken) : '';

      <div style="display:flex;gap:8px;margin-bottom:10px;">

        <button class="btn small" data-action="portale-copia-link" data-link="${escapeHtml(link)}">Copia link</button>

        <button class="btn small danger" data-action="portale-disattiva-accesso" data-id="${cliente.id}">Disattiva accesso</button>
      </div>`
    : `<div class="helptext" style="margin-bottom:12px;">${escapeHtml(cliente.ragioneSociale)} non ha ancora un accesso al portale. Attivandolo genera un link personale (con un token di sicurezza, non indovinabile) da mandargli via email o chat: da lì vede solo i propri dati, mai quelli di altri clienti.</div>

/* -------------------- RENDER: CALENDARIO -------------------- */
let CAL_MESE = new Date().getMonth();

/* Colore per categoria di adempimento (le stesse 7 di TIPI_ADEMPIMENTO) più una categoria dedicata
   ai task team con scadenza (task #131): così il calendario non è più tutto blu, e i task interni
   sono visivamente distinti dagli adempimenti fiscali. "colore" qui serve solo per il puntino
   nella legenda/nel modal (dove serve un valore esadecimale diretto, non una classe). */
const CATEGORIA_TASK_TEAM_CAL = 'Task team';
const COLORE_CATEGORIA_CALENDARIO = {
  'Imposte dirette':                { classe: 'cat-imposte-dirette',   colore: '#B3261E' },
  'Imposte indirette':              { classe: 'cat-imposte-indirette', colore: '#2E63C7' },
  'Adempimenti contabili':          { classe: 'cat-contabili',         colore: '#5b2d90' },
  'Adempimenti previdenziali':      { classe: 'cat-previdenziali',     colore: '#1B7A43' },
  'Adempimenti del lavoro':         { classe: 'cat-lavoro',            colore: '#9C6500' },
  'Adempimenti camerali/societari': { classe: 'cat-camerali',          colore: '#0E7C86' },
  'Altri tributi':                  { classe: 'cat-altri',             colore: '#C2540A' },
  [CATEGORIA_TASK_TEAM_CAL]:        { classe: 'cat-task-team',         colore: '#565E6D' },
};
function infoCategoriaCalendario(categoria) {
  return COLORE_CATEGORIA_CALENDARIO[categoria] || COLORE_CATEGORIA_CALENDARIO['Altri tributi'];
}
/* Un evento è "chiuso" con vocabolari di stato diversi a seconda della provenienza: scadenze
   periodiche/annuali usano STATI_SCADENZA_CHIUSI, i task team solo "Fatto". */
function eventoCalendarioChiuso(kind, stato) {
  return kind === 'task' ? stato === 'Fatto' : STATI_SCADENZA_CHIUSI.includes(stato);
}
/* Etichetta del "titolare" dell'evento: nome cliente, oppure un'etichetta esplicita per i task
   team senza cliente collegato (non "(cliente eliminato)", che ha senso solo se l'id punta
   davvero a un cliente rimosso). */
function etichettaClienteEvento(kind, clienteId) {
  if (clienteId) return nomeCliente(clienteId);
  return kind === 'task' ? 'Task interno (studio)' : '(cliente eliminato)';
}

/* Costruisce la mappa data ISO -> EVENTI GREZZI del mese: scadenze periodiche, adempimenti
   annuali, E i task team con una scadenza impostata (task #131 - prima non comparivano affatto in
   calendario). Ogni evento porta kind/categoria/titolo SEPARATI dal nome cliente (a differenza
   della versione precedente, che li concatenava in "label"): serve per poterli raggruppare per
   tipo (vedi raggruppaEventiGiorno) prima di renderizzarli. Usata sia dalla griglia mensile sia dal
   modal "espandi giorno", così le due viste non possono mai mostrare dati diversi per lo stesso
   giorno. */
function eventiCalendarioPerGiorno() {
  const { tutteScadenze, annuali } = derivati();
  const eventiPerGiorno = {};
  const aggiungiEvento = (dataISO, evento) => {
    if (!dataISO) return;
    if (!eventiPerGiorno[dataISO]) eventiPerGiorno[dataISO] = [];
    eventiPerGiorno[dataISO].push(evento);
  };
  tutteScadenze.forEach(s => aggiungiEvento(s.data, {
    kind: 'scadenza', id: s.id, clienteId: s.clienteId, titolo: s.nome, stato: s.stato,
    categoria: tipoCategoriaScadenzaPeriodica(s.tipo),
  }));
  annuali.forEach(a => { if (a.scadenza) aggiungiEvento(a.scadenza, {
    kind: 'annuale', clienteId: a.clienteId, titolo: a.tipoNome, stato: a.completato?'Inviato telematicamente':'Da fare',
    categoria: a.tipo || TIPO_ADEMPIMENTO_DEFAULT,
  }); });
  (STATE.taskTeam || []).forEach(t => { if (t.scadenza) aggiungiEvento(t.scadenza, {
    kind: 'task', id: t.id, clienteId: t.clienteId || null, titolo: t.titolo, stato: t.stato || 'Da fare',
    categoria: CATEGORIA_TASK_TEAM_CAL, assegnatoA: t.assegnatoA,
  }); });
  return eventiPerGiorno;
}

/* Raggruppa gli eventi di UN giorno per (kind + categoria + titolo): con 100+ clienti in studio
   "IVA mensile" ricorre identica per decine di anagrafiche nello stesso giorno - senza
   raggruppamento sia la cella del calendario sia il modal "espandi giorno" diventerebbero una
   lista illeggibile di righe quasi identiche ("Cliente A — IVA mensile", "Cliente B — IVA
   mensile"...). Un gruppo con un solo evento si comporta esattamente come prima (nessuna novità
   per il caso comune, che resta la maggioranza); un gruppo con più eventi diventa una riga sola
   col conteggio, espandibile nel modal giorno. L'ordine segue quello della legenda (le 7 categorie
   fiscali, poi Task team), poi il titolo: prevedibile e coerente con le altre viste. */
function raggruppaEventiGiorno(eventi) {
  const ordineCategoria = TIPI_ADEMPIMENTO.concat([CATEGORIA_TASK_TEAM_CAL]);
  const gruppi = new Map();
  eventi.forEach(e => {
    const chiave = `${e.kind}::${e.categoria}::${e.titolo}`;
    if (!gruppi.has(chiave)) gruppi.set(chiave, { kind: e.kind, categoria: e.categoria, titolo: e.titolo, items: [] });
    gruppi.get(chiave).items.push(e);
  });
  return Array.from(gruppi.values()).sort((a, b) => {
    const ia = ordineCategoria.indexOf(a.categoria), ib = ordineCategoria.indexOf(b.categoria);
    if (ia !== ib) return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    return a.titolo.localeCompare(b.titolo);
  });
}

function renderCalendario() {
  const anno = STATE.annoCorrente;
  const eventiPerGiorno = eventiCalendarioPerGiorno();

  const primoDelMese = new Date(anno, CAL_MESE, 1);
  const ultimoDelMese = new Date(anno, CAL_MESE + 1, 0);
  let offsetInizio = primoDelMese.getDay(); // 0=domenica
  offsetInizio = offsetInizio === 0 ? 6 : offsetInizio - 1; // lun=0
  const nGiorniMese = ultimoDelMese.getDate();
  const oggi = oggiISO();

  const celle = [];
  for (let i = 0; i < offsetInizio; i++) celle.push(null);
  for (let g = 1; g <= nGiorniMese; g++) celle.push(g);
  while (celle.length % 7 !== 0) celle.push(null);

  const nav = `<div class="toolbar" style="align-items:center;">
    <button class="btn" data-action="cal-prev">← Mese prec.</button>
    <div style="font-weight:700;font-size:15px;min-width:160px;text-align:center;">${MESI_COMPLETI[CAL_MESE]} ${anno}</div>
    <button class="btn" data-action="cal-next">Mese succ. →</button>
    <button class="btn ghost" data-action="cal-oggi">Vai a oggi</button>
  </div>`;

  const legenda = `<div class="cal-legenda">${TIPI_ADEMPIMENTO.concat([CATEGORIA_TASK_TEAM_CAL]).map(t => {
    const info = infoCategoriaCalendario(t);
    return `<div class="voce"><span class="dot" style="background:${info.colore};"></span>${escapeHtml(t)}</div>`;
  }).join('')}</div>`;

  const testate = GIORNI_IT.map(g => `<div class="cal-head">${g}</div>`).join('');
  const giorni = celle.map(g => {
    if (g === null) return `<div class="cal-day altromese"></div>`;
    const dataISO = toISO(anno, CAL_MESE + 1, g);
    const eventi = eventiPerGiorno[dataISO] || [];
    const gruppi = raggruppaEventiGiorno(eventi);
    const isOggi = dataISO === oggi;
    const evHtml = gruppi.slice(0, 4).map(gr => {
      const chiusi = gr.items.filter(it => eventoCalendarioChiuso(gr.kind, it.stato)).length;
      const tutteChiuse = chiusi === gr.items.length;
      const scaduto = !tutteChiuse && gr.items.some(it => !eventoCalendarioChiuso(gr.kind, it.stato) && giorniTra(oggi, dataISO) < 0);
      const info = infoCategoriaCalendario(gr.categoria);
      const cls = [info.classe, tutteChiuse ? 'completato' : '', scaduto ? 'scaduto' : ''].filter(Boolean).join(' ');
      const nomiClienti = gr.items.map(it => etichettaClienteEvento(it.kind, it.clienteId));
      const etichettaCorta = gr.items.length > 1 ? `${gr.titolo} · ${gr.items.length} clienti` : `${nomiClienti[0]} — ${gr.titolo}`;
      const tooltip = gr.items.length > 1 ? `${gr.categoria} — ${gr.titolo} (${gr.items.length}): ${nomiClienti.join(', ')}` : `${gr.categoria} — ${etichettaCorta}`;
      return `<div class="ev ${cls}" title="${escapeHtml(tooltip)}">${tutteChiuse?'✓ ':''}${escapeHtml(etichettaCorta)}</div>`;
    }).join('');
    const extra = gruppi.length > 4 ? `<div class="cal-piu">+${gruppi.length-4} altre</div>` : '';
    const hasEventi = eventi.length > 0;
    const azione = hasEventi ? `data-action="cal-espandi-giorno" data-data="${dataISO}"` : '';
    return `<div class="cal-day ${isOggi?'oggi':''} ${hasEventi?'has-eventi':''}" ${azione}><div class="num">${g}</div>${evHtml}${extra}</div>`;
  }).join('');

  return nav + legenda + `<div class="card"><div class="cal-grid">${testate}${giorni}</div></div>`;
}

/* Pulsante di dettaglio nel modal giorno: scadenze periodiche aprono il dettaglio della scadenza
   stessa (Stato/Nota/Importo/storico solleciti — vedi modalDettaglioScadenza), i task team aprono
   il modale del task (stesso pattern del Task team), gli adempimenti annuali (niente modello
   dettaglio proprio) restano sulla scheda cliente, dove già si gestiscono. */
function pulsanteEventoCalendario(it) {
  if (it.kind === 'scadenza' && it.id) return `<button class="btn small" data-action="apri-dettaglio-scadenza" data-id="${it.id}">Apri scadenza</button>`;
  if (it.kind === 'task') return `<button class="btn small" data-action="modifica-task-team" data-id="${it.id}">Apri task</button>`;
  return `<button class="btn small" data-action="apri-cliente" data-id="${it.clienteId}">Apri cliente</button>`;
}
/* Una riga evento nel modal giorno: "compatto" (gruppo con un solo evento) mostra "Cliente —
   Titolo" com'era prima del raggruppamento; le righe espanse di un gruppo multiplo mostrano solo
   il nome del cliente/titolare (il titolo è già nell'intestazione del gruppo) più, per i task,
   l'assegnatario. */
function rigaEventoCalendario(it, gr, dataISO, oggi, compatto) {
  const chiuso = eventoCalendarioChiuso(it.kind, it.stato);
  const scaduto = !chiuso && giorniTra(oggi, dataISO) < 0;
  const titolo = compatto
    ? `${escapeHtml(etichettaClienteEvento(it.kind, it.clienteId))} — ${escapeHtml(gr.titolo)}`
    : escapeHtml(etichettaClienteEvento(it.kind, it.clienteId));
  const sottotitoloParti = [];
  if (compatto) sottotitoloParti.push(escapeHtml(gr.categoria));
  if (it.kind === 'task' && it.assegnatoA) sottotitoloParti.push(`assegnato a ${escapeHtml(it.assegnatoA)}`);
  if (scaduto) sottotitoloParti.push(`<span style="color:var(--rosso);font-weight:700;">${it.kind === 'task' ? 'scaduto' : 'scaduta'}</span>`);
  return `<div class="voce ${chiuso?'completato':''}" style="${compatto?'':'padding-left:26px;'}">
    ${compatto ? `<span class="dot" style="background:${infoCategoriaCalendario(gr.categoria).colore};"></span>` : ''}
    <div style="flex:1;min-width:0;">
      <div class="titolo" style="font-weight:600;">${titolo}</div>

}

/* Espansione dei gruppi multipli nel modal giorno: chiave "dataISO::indiceGruppo" (l'ordine dei
   gruppi è deterministico a parità di STATE/giorno, quindi l'indice torna sempre a puntare allo
   stesso gruppo quando si riapre lo stesso giorno) — persiste per tutta la sessione, non solo
   mentre il modal è aperto, comodo se lo si riapre più volte sullo stesso giorno affollato. */
let CAL_GRUPPI_ESPANSI = new Set();

/* Modal "espandi giorno": lista completa (non troncata a 4, e ora RAGGRUPPATA per tipo — task
   #131) degli eventi di una data. Un gruppo con un solo evento è una riga singola cliccabile come
   prima; un gruppo con più eventi (tipicamente una scadenza periodica ricorrente su tanti clienti)
   è un'intestazione con conteggio "N/M completate", espandibile per vedere/agire sui singoli
   clienti. */
function apriModalGiornoCalendario(dataISO) {
  const eventiPerGiorno = eventiCalendarioPerGiorno();
  const eventi = eventiPerGiorno[dataISO] || [];
  if (eventi.length === 0) return;
  const oggi = oggiISO();
  const gruppi = raggruppaEventiGiorno(eventi);
  const righe = gruppi.map((gr, idx) => {
    const items = gr.items.slice().sort((a,b) => etichettaClienteEvento(a.kind, a.clienteId).localeCompare(etichettaClienteEvento(b.kind, b.clienteId)));
    if (items.length === 1) return rigaEventoCalendario(items[0], gr, dataISO, oggi, true);
    const chiave = `${dataISO}::${idx}`;
    const chiusi = items.filter(it => eventoCalendarioChiuso(gr.kind, it.stato)).length;
    const espanso = CAL_GRUPPI_ESPANSI.has(chiave);
    const info = infoCategoriaCalendario(gr.categoria);
    return `<div class="cal-gruppo">
      <div class="voce" style="cursor:pointer;" data-action="cal-toggle-gruppo" data-chiave="${chiave}">
        <span class="dot" style="background:${info.colore};"></span>
        <div style="flex:1;min-width:0;">
          <div class="titolo" style="font-weight:600;">${escapeHtml(gr.titolo)}</div>
          <div class="helptext">${escapeHtml(gr.categoria)} · ${items.length} eventi</div>
        </div>
        <span class="badge ${chiusi===items.length?'stato-inviato-telematicamente':'info'}">${chiusi}/${items.length} completate</span>
        <span style="padding:0 4px;">${espanso?'▾':'▸'}</span>
      </div>
      ${espanso ? items.map(it => rigaEventoCalendario(it, gr, dataISO, oggi, false)).join('') : ''}
    </div>`;
  }).join('');
  const html = `<div class="modal-backdrop" data-action="chiudi-modal-backdrop">
    <div class="modal" style="max-width:640px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><h2>${escapeHtml(fmtData(dataISO))}</h2><div class="modal-sub">${eventi.length} ${eventi.length===1?'evento':'eventi'} in questa data${gruppi.length!==eventi.length?` · ${gruppi.length} ${gruppi.length===1?'voce':'voci'} in elenco`:''}</div></div>
        <button class="icon-x" data-action="chiudi-modal" title="Chiudi">✕</button>
      </div>
      <div class="cal-giorno-lista" style="max-height:420px;overflow-y:auto;margin-top:6px;">${righe}</div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

/* Backup automatici lato server (8:00/12:00/16:00 + a ogni avvio, storico 30 giorni - vedi
   server.js): esistono SOLO quando il gestionale gira via server locale (HTTP_SYNC_ATTIVO), quindi
   l'elenco va caricato con un fetch asincrono invece che essere già dentro STATE. Cache semplice a
   livello di modulo: null = non ancora caricato, 'errore' = richiesta fallita, altrimenti l'array
   ricevuto dal server. Si aggiorna da sola (nuovo fetch) ogni volta che torna a null. */
let BACKUP_SERVER_ELENCO = null;
let BACKUP_SERVER_CARICAMENTO = false;
function caricaElencoBackupServer() {
  // BACKUP_SERVER_ELENCO !== null è fondamentale: cardBackupAutomatici() chiama questa funzione a
  // OGNI suo render (compreso quello scatenato dal render() qui sotto, una volta arrivata la
  // risposta) - senza questo controllo si innescherebbe un fetch nuovo a ogni giro, all'infinito.
  // Per ricaricare (es. dopo un ripristino) si azzera BACKUP_SERVER_ELENCO altrove, non si richiama
  // mai questa funzione "forzando" un nuovo fetch qui dentro.
  if (!HTTP_SYNC_ATTIVO || BACKUP_SERVER_CARICAMENTO || BACKUP_SERVER_ELENCO !== null) return;
  BACKUP_SERVER_CARICAMENTO = true;
  fetch('/api/backup/elenco')
    .then(r => r.json())
    .then(lista => { BACKUP_SERVER_ELENCO = Array.isArray(lista) ? lista : 'errore'; })
    .catch(() => { BACKUP_SERVER_ELENCO = 'errore'; })
    .finally(() => {
      BACKUP_SERVER_CARICAMENTO = false;
      if (VIEW === 'impostazioni') render();
    });
}
function ripristinaBackupServer(file) {
  if (!HTTP_SYNC_ATTIVO || !file) return;
  if (!confermaAzione('Ripristinare i dati da questo backup? Sostituirà i dati attuali su tutti i dispositivi collegati (viene comunque salvata automaticamente una copia di quelli di adesso prima di sovrascrivere, quindi anche questa operazione è reversibile).')) return;
  fetch('/api/backup/ripristina', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file }) })
    .then(r => r.json())
    .then(esito => {
      if (esito && esito.ok) { toast('✅ Dati ripristinati dal backup.'); BACKUP_SERVER_ELENCO = null; }
      else toast('⚠️ ' + ((esito && esito.errore) || 'Ripristino non riuscito.'), true);
    })
    .catch(() => toast('⚠️ Impossibile contattare il server locale per il ripristino.', true));
}
/* Indirizzi di rete per far collegare i colleghi in studio da un altro PC (task #132): stesso
   pattern di caricaElencoBackupServer sopra - cache a livello di modulo, un fetch alla volta,
   nessun nuovo fetch finché non si azzera esplicitamente altrove. */
let INDIRIZZI_RETE_CACHE = null;
let INDIRIZZI_RETE_CARICAMENTO = false;
function caricaIndirizziRete() {
  if (!HTTP_SYNC_ATTIVO || INDIRIZZI_RETE_CARICAMENTO || INDIRIZZI_RETE_CACHE !== null) return;
  INDIRIZZI_RETE_CARICAMENTO = true;
  // timeout difensivo: questa chiamata non deve MAI restare appesa (es. rete instabile) e bloccare
  // il resto della UI di Impostazioni - dopo pochi secondi si arrende e mostra l'errore.
  const controllerIndirizzi = new AbortController();
  const timerIndirizzi = setTimeout(() => controllerIndirizzi.abort(), 4000);
  fetch('/api/indirizzi-rete', { signal: controllerIndirizzi.signal })
    .then(r => { clearTimeout(timerIndirizzi); return r.json(); })
    .then(info => { INDIRIZZI_RETE_CACHE = (info && info.ok) ? info : 'errore'; })
    .catch(() => { INDIRIZZI_RETE_CACHE = 'errore'; })
    .finally(() => {
      INDIRIZZI_RETE_CARICAMENTO = false;
      if (VIEW === 'impostazioni') render();
    });
}
/* Blocco "Accesso da altri PC dello studio" dentro la card Responsabili: indirizzi copiabili +
   download del file di collegamento auto-connettente (vedi scriviLauncherCollegamento in
   server.js). Riusa l'azione generica "portale-copia-link" (copia el.dataset.link), già usata per
   il link del portale cliente - stesso meccanismo, nessun nuovo case nel dispatcher. */
function cardAccessoColleghi() {
  if (!HTTP_SYNC_ATTIVO) {
    return `<div class="helptext" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">Per far accedere i colleghi da un altro PC dello studio serve il server locale acceso (server.js): apri il gestionale dall'indirizzo del server (es. http://localhost:8420) invece che come file, poi torna in questa pagina.</div>`;
  }
  caricaIndirizziRete();
  let corpo;
  if (INDIRIZZI_RETE_CACHE === null || INDIRIZZI_RETE_CARICAMENTO) {
    corpo = `<div class="helptext">Caricamento indirizzi di rete…</div>`;
  } else if (INDIRIZZI_RETE_CACHE === 'errore') {
    corpo = `<div class="helptext">⚠️ Non sono riuscito a leggere gli indirizzi di rete dal server locale.</div>`;
  } else {
    const info = INDIRIZZI_RETE_CACHE;
    const urlHostname = `http://${info.hostname}:${info.porta}/`;
    const urlIp = (info.indirizzi || []).map(ip => `http://${ip}:${info.porta}/`);
    const tuttiGliUrl = [urlHostname].concat(urlIp);
    corpo = `<div class="helptext" style="margin-bottom:8px;">Dagli altri PC dello studio, sulla stessa rete WiFi/LAN, si collegano a Prisma aprendo uno di questi indirizzi (il primo di solito è il più stabile):</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
        ${tuttiGliUrl.map(u => `<div style="display:flex;align-items:center;gap:8px;">
          <code style="background:var(--bg);border-radius:6px;padding:4px 8px;font-size:12.5px;">${escapeHtml(u)}</code>
          <button class="btn small ghost" data-action="portale-copia-link" data-link="${escapeHtml(u)}">Copia</button>
        </div>`).join('')}
      </div>
      <div class="helptext" style="margin-bottom:8px;">In alternativa, manda loro (una volta sola, via email/chat) questo file: a ogni doppio click provano a collegarsi da soli a questo PC, e se il server non è acceso lo dicono chiaramente invece di un errore tecnico.</div>
      <a class="btn small" href="/api/link-colleghi" download="Apri Gestionale (rete studio).html">⬇ Scarica il link da inviare ai colleghi</a>`;
  }
  return `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
    <div style="font-weight:600;font-size:13.5px;margin-bottom:6px;">Accesso da altri PC dello studio</div>
    ${corpo}
  </div>`;
}
/* -------------------- Aggiornamenti e log (task #158) --------------------
   Stesso schema di caching di BACKUP_SERVER_ELENCO qui sopra: un fetch alla volta, non a ogni
   render. Il controllo versione è SEMPRE manuale (bottone "Verifica aggiornamenti") - Prisma non
   contatta mai internet da solo/in background, solo quando l'utente lo chiede esplicitamente. */
let AGGIORNAMENTI_CACHE = null; // null = non ancora controllato, 'errore', 'caricamento', oppure l'oggetto risposta
let AGGIORNAMENTI_IN_CORSO = false; // true mentre si sta scaricando/applicando l'aggiornamento vero e proprio
let AGGIORNAMENTI_RISULTATO = null; // esito dell'ultima applicazione: {ok, messaggio} - mostrato una volta, poi si può richiudere
function verificaAggiornamenti() {
  if (!HTTP_SYNC_ATTIVO) return;
  AGGIORNAMENTI_CACHE = 'caricamento';
  render();
  fetch('/api/aggiornamenti/verifica').then(r => r.json()).then(info => {
    AGGIORNAMENTI_CACHE = (info && info.ok) ? info : 'errore';
  }).catch(() => { AGGIORNAMENTI_CACHE = 'errore'; })
    .finally(() => { if (VIEW === 'impostazioni') render(); });
}
async function applicaAggiornamentoConferma() {
  if (!confermaAzione('Installare la nuova versione ora? "gestionale.htm" si aggiorna subito (basta ricaricare la pagina); se anche "server.js" cambia, serve chiudere e riaprire Prisma perché la modifica abbia effetto.')) return;
  AGGIORNAMENTI_IN_CORSO = true;
  AGGIORNAMENTI_RISULTATO = null;
  render();
  try {
    const r = await fetch('/api/aggiornamenti/applica', { method: 'POST' });
    const info = await r.json();
    if (info && info.ok) {
      AGGIORNAMENTI_RISULTATO = { ok: true, messaggio: 'Aggiornati: ' + info.file.join(', ') + '. Ricarica la pagina (F5) per usare la nuova versione; se è cambiato anche server.js, chiudi e riapri Prisma.' };
      AGGIORNAMENTI_CACHE = null; // il prossimo controllo rileggerà la versione appena installata
    } else {
      AGGIORNAMENTI_RISULTATO = { ok: false, messaggio: (info && info.errore) || 'Errore sconosciuto.' };
    }
  } catch (err) {
    AGGIORNAMENTI_RISULTATO = { ok: false, messaggio: 'Aggiornamento non riuscito: ' + err.message };
  } finally {
    AGGIORNAMENTI_IN_CORSO = false;
    render();
  }
}

  } else if (AGGIORNAMENTI_CACHE.aggiornamentoDisponibile) {

/* -------------------- STRUMENTI: convertitore Word <-> PDF (task #133) -------------------- */
// Stessa cache-a-livello-di-modulo già usata per backup automatici/indirizzi di rete: un fetch
// alla volta, non richiamato a ogni render.
let CONVERSIONE_STATO_CACHE = null;
let CONVERSIONE_STATO_CARICAMENTO = false;
function caricaStatoConversione() {
  if (!HTTP_SYNC_ATTIVO || CONVERSIONE_STATO_CARICAMENTO || CONVERSIONE_STATO_CACHE !== null) return;
  CONVERSIONE_STATO_CARICAMENTO = true;
  fetch('/api/conversione-stato')
    .then(r => r.json())
    .then(info => { CONVERSIONE_STATO_CACHE = (info && info.ok) ? info : 'errore'; })
    .catch(() => { CONVERSIONE_STATO_CACHE = 'errore'; })
    .finally(() => {
      CONVERSIONE_STATO_CARICAMENTO = false;
      if (VIEW === 'strumenti') render();
    });
}
// Coppie di conversione lato client (stesse dell'endpoint /api/converti in server.js): serve solo
// per decidere le opzioni del pulsante e rifiutare un file non supportato PRIMA di caricarlo.
// Un .pdf ha DUE possibili destinazioni (Word modificabile, oppure PDF/A per l'archiviazione a
// norma - task #136): "opzioni" elenca le scelte, la prima è quella preselezionata.
const CONVERSIONI_SUPPORTATE_CLIENT = {
  docx: { opzioni: [{ verso: 'pdf', label: 'PDF' }] },
  doc: { opzioni: [{ verso: 'pdf', label: 'PDF' }] },
  odt: { opzioni: [{ verso: 'pdf', label: 'PDF' }] },
  pdf: { opzioni: [
    { verso: 'docx', label: 'Word (.docx)' },
    { verso: 'pdfa', label: 'PDF/A (archiviazione a norma)' },
  ] },
};
function opzioniConversionePer(estensione) {
  const c = CONVERSIONI_SUPPORTATE_CLIENT[estensione];
  return c ? c.opzioni : null;
}
const MIME_STRUMENTI = { pdf: 'application/pdf', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };

let STRUMENTI_FILE = null;       // { nome, estensione, base64, dimensione }
let STRUMENTI_FORMATO_SCELTO = null; // 'pdf' | 'docx' | 'pdfa' - quale delle opzioni sopra è selezionata
let STRUMENTI_RISULTATO = null;  // { nomeFile, base64 }
let STRUMENTI_ERRORE = null;
let STRUMENTI_IN_CORSO = false;

function blobDaBase64(base64, mime) {
  const byteChars = atob(base64 || '');
  const bytes = new Uint8Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function resetStrumentiFile() {
  STRUMENTI_FILE = null;
  STRUMENTI_FORMATO_SCELTO = null;
  STRUMENTI_RISULTATO = null;
  STRUMENTI_ERRORE = null;
  STRUMENTI_IN_CORSO = false;
  render();
}
function selezionaFileConversione(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  STRUMENTI_RISULTATO = null;
  STRUMENTI_ERRORE = null;
  const estensione = (file.name.split('.').pop() || '').toLowerCase();
  const opzioni = opzioniConversionePer(estensione);
  if (!opzioni) {
    STRUMENTI_FILE = null;
    STRUMENTI_ERRORE = `Formato ".${estensione}" non supportato: carica un file .docx, .doc, .odt oppure .pdf.`;
    render();
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => { STRUMENTI_ERRORE = 'Errore di lettura del file.'; render(); };
  reader.onload = () => {
    const base64 = String(reader.result).split(',')[1] || '';
    STRUMENTI_FILE = { nome: file.name, estensione, base64, dimensione: file.size };
    STRUMENTI_FORMATO_SCELTO = opzioni[0].verso;
    render();
  };
  reader.readAsDataURL(file);
}
function avviaConversione() {
  if (!STRUMENTI_FILE || STRUMENTI_IN_CORSO) return;
  STRUMENTI_IN_CORSO = true;
  STRUMENTI_ERRORE = null;
  STRUMENTI_RISULTATO = null;
  render();
  const opzioni = opzioniConversionePer(STRUMENTI_FILE.estensione);
  const formatoDestinazione = STRUMENTI_FORMATO_SCELTO || (opzioni && opzioni[0].verso);
  fetch('/api/converti', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nomeFile: STRUMENTI_FILE.nome, contenutoBase64: STRUMENTI_FILE.base64, formatoDestinazione }),
  })
    .then(r => r.json())
    .then(esito => {
      if (esito && esito.ok) STRUMENTI_RISULTATO = { nomeFile: esito.nomeFile, base64: esito.contenutoBase64 };
      else STRUMENTI_ERRORE = (esito && esito.errore) || 'Conversione non riuscita.';
    })
    .catch(() => { STRUMENTI_ERRORE = 'Impossibile contattare il server locale per la conversione.'; })
    .finally(() => { STRUMENTI_IN_CORSO = false; render(); });
}
async function scaricaRisultatoConversione() {
  if (!STRUMENTI_RISULTATO) return;
  const ext = (STRUMENTI_RISULTATO.nomeFile.split('.').pop() || '').toLowerCase();
  const blob = blobDaBase64(STRUMENTI_RISULTATO.base64, MIME_STRUMENTI[ext] || 'application/octet-stream');
  try {
    const ok = await salvaFileScaricabile(STRUMENTI_RISULTATO.nomeFile, blob);
    if (ok) toast('File convertito scaricato.');
  } catch (err) {
    console.error('Download file convertito non riuscito', err);
    alert('Impossibile scaricare il file convertito in questo browser.');
  }
}
function renderStrumenti() {
  if (!HTTP_SYNC_ATTIVO) {
    return `<div class="card"><div class="section-title">Convertitore Word ↔ PDF</div>
      <div class="helptext">Serve il server locale acceso (server.js): apri il gestionale dall'indirizzo del server (es. http://localhost:8420) invece che come file, poi torna in questa pagina.</div>
    </div>`;
  }
  caricaStatoConversione();
  if (CONVERSIONE_STATO_CACHE === null || CONVERSIONE_STATO_CARICAMENTO) {
    return `<div class="card"><div class="section-title">Convertitore Word ↔ PDF</div><div class="helptext">Verifica dello strumento in corso…</div></div>`;
  }
  if (CONVERSIONE_STATO_CACHE === 'errore') {
    return `<div class="card"><div class="section-title">Convertitore Word ↔ PDF</div><div class="helptext">⚠️ Non sono riuscito a verificare se il convertitore è disponibile su questo PC.</div></div>`;
  }
  if (!CONVERSIONE_STATO_CACHE.disponibile) {
    return `<div class="card"><div class="section-title">Convertitore Word ↔ PDF</div>
      <div class="helptext">Per convertire i file serve <b>LibreOffice</b> installato sul PC dove gira il server locale — gratuito, e la conversione resta tutta in locale: nessun documento del cliente esce verso servizi online.</div>
      <div class="helptext" style="margin-top:10px;">1) Scarica e installa LibreOffice da <a href="https://www.libreoffice.org/download/download/" target="_blank" rel="noopener">libreoffice.org</a> (pochi minuti).<br>2) Riavvia il server locale (chiudi e riapri "Avvia Gestionale").<br>3) Torna in questa pagina: lo strumento si attiva da solo, nessuna configurazione.</div>
    </div>`;
  }
  const f = STRUMENTI_FILE;
  const opzioni = f ? opzioniConversionePer(f.estensione) : null;
  const etichettaScelta = opzioni ? (opzioni.find(o => o.verso === STRUMENTI_FORMATO_SCELTO) || opzioni[0]).label : '';
  return `<div class="card" style="max-width:640px;">
    <div class="section-title">Convertitore Word ↔ PDF ↔ PDF/A</div>
    <div class="helptext" style="margin-bottom:12px;">Carica un file .docx/.doc/.odt per convertirlo in PDF, oppure un .pdf per renderlo modificabile in Word o per trasformarlo in PDF/A (formato di archiviazione a norma, adatto alla conservazione digitale). Conversione locale su questo PC — i documenti non escono verso servizi online.</div>
    <label class="btn" style="margin:0;display:inline-block;">📄 Scegli file...<input type="file" accept=".doc,.docx,.odt,.pdf" style="display:none;" data-action="strumenti-scegli-file"></label>
    ${f ? `<div style="margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:8px;">
      <div style="font-weight:600;font-size:13.5px;">${escapeHtml(f.nome)}</div>
      <div class="helptext">${(f.dimensione/1024).toFixed(1)} KB</div>
      ${opzioni.length > 1 ? `<div class="field" style="margin-top:8px;max-width:280px;"><label>Converti in</label><select data-action="strumenti-scegli-formato">${opzioni.map(o => `<option value="${o.verso}" ${STRUMENTI_FORMATO_SCELTO===o.verso?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>` : ''}
    </div>
    <button class="btn primary" style="margin-top:10px;" data-action="strumenti-converti" ${STRUMENTI_IN_CORSO?'disabled':''}>${STRUMENTI_IN_CORSO?'Conversione in corso…':'Converti in ' + escapeHtml(etichettaScelta)}</button>
    <button class="btn ghost" style="margin-top:10px;margin-left:8px;" data-action="strumenti-reset">Annulla</button>` : ''}
    ${STRUMENTI_ERRORE ? `<div class="helptext" style="margin-top:10px;color:var(--rosso);">⚠️ ${escapeHtml(STRUMENTI_ERRORE)}</div>` : ''}
    ${STRUMENTI_RISULTATO ? `<div style="margin-top:14px;padding:12px;background:var(--verde-bg);border-radius:8px;">
      <div style="font-weight:600;font-size:13.5px;color:var(--verde);">✅ Conversione completata: ${escapeHtml(STRUMENTI_RISULTATO.nomeFile)}</div>
      <button class="btn primary small" style="margin-top:8px;" data-action="strumenti-scarica">⬇ Scarica</button>
    </div>` : ''}
  </div>`;
}

   gira il server locale (vedi cifraCredenziale/decifraCredenziale in server.js): qui in STATE e a

function generaPasswordCasuale() {
  const alfabeto = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*';
  let out = '';
  for (let i = 0; i < 16; i++) out += alfabeto[Math.floor(Math.random() * alfabeto.length)];
  return out;
}

/* -------------------- IMPOSTAZIONI: catalogo attività/tariffario dello studio (task #138) -------------------- */
function renderCatalogoAttivitaStudio() {
  const attivita = STATE.catalogoAttivitaStudio || [];
  const righe = attivita.map(a => `<tr>
      <td>${escapeHtml(a.nome)}</td>
      <td class="helptext">${escapeHtml(a.descrizione||'')}</td>
      <td style="text-align:right;white-space:nowrap;">${a.prezzo != null ? fmtEuro(a.prezzo) : '—'}</td>
      <td>${a.richiedeMandato ? '<span class="badge info">Sì</span>' : '<span class="badge">No</span>'}</td>
      <td style="white-space:nowrap;">
        <button class="btn small" data-action="modifica-attivita-catalogo" data-id="${a.id}">Modifica</button>
        <button class="btn small danger" data-action="elimina-attivita-catalogo" data-id="${a.id}">Elimina</button>
      </td>
    </tr>`).join('');
  return `<div class="card">
    <div class="section-title">Attività e tariffario dello studio</div>
    <div class="helptext" style="margin-bottom:12px;">Il "listino" usato in Preventivi e Mandati: selezionando un'attività da qui, il documento calcola da solo l'importo e (se il modello prevede il campo "dettaglioAttivita") anche l'elenco voci. "Richiede mandato" distingue una gestione continuativa (contabilità, paghe: dopo l'accettazione del preventivo va firmato anche un mandato) da una pratica singola una tantum, per cui basta il preventivo.</div>
    ${attivita.length === 0 ? '<div class="helptext">Nessuna attività configurata.</div>' : `<div class="card" style="padding:0;overflow-x:auto;">
      <table class="compact"><thead><tr><th>Attività</th><th>Descrizione</th><th>Prezzo</th><th>Richiede mandato</th><th></th></tr></thead>
      <tbody>${righe}</tbody></table>
    </div>`}
    <button class="btn small" style="margin-top:10px;" data-action="nuova-attivita-catalogo">+ Nuova attività</button>
  </div>`;
}

/* -------------------- IMPOSTAZIONI: regole per la precompilazione degli importi statutari -------------------- */
function renderRegoleImportiStatutari() {
  const regole = STATE.regoleImportiStatutari || [];
  const righe = regole.map(r => {
    const chiaveDef = catalogoAnnualeTutti().find(c => c.chiave === r.chiave);
    return `<tr>
      <td>${escapeHtml(r.nome)}</td>
      <td>${escapeHtml(chiaveDef ? chiaveDef.nome : r.chiave)}</td>
      <td style="text-align:right;">${r.importoBase!=null && r.importoBase>0 ? fmtEuro(r.importoBase) : '—'}</td>
      <td style="text-align:right;">${r.sogliaCapitaleSociale!=null ? fmtEuro(r.sogliaCapitaleSociale) : '—'}</td>
      <td style="text-align:right;">${r.importoSopraSoglia!=null ? fmtEuro(r.importoSopraSoglia) : '—'}</td>
      <td style="text-align:right;">${r.importoPerSedeAggiuntiva ? fmtEuro(r.importoPerSedeAggiuntiva) : '—'}</td>
      <td>
        <button class="btn small" data-action="modifica-regola-importo" data-id="${r.id}">Modifica</button>
        <button class="btn small danger" data-action="elimina-regola-importo" data-id="${r.id}">Elimina</button>
      </td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="section-title">Precompilazione importi statutari</div>
    <div class="helptext" style="margin-bottom:12px;">Importi fissati dalla legge che variano in modo prevedibile (capitale sociale, numero di sedi secondarie): quando registri un F24 collegato a uno di questi adempimenti, il gestionale suggerisce l'importo — sempre da verificare, mai applicato senza che tu lo veda. Tienili aggiornati qui quando cambia la normativa.</div>
    ${regole.length === 0 ? '<div class="helptext">Nessuna regola configurata.</div>' : `<div class="card" style="padding:0;overflow-x:auto;">

    </div>`}
    <button class="btn small" style="margin-top:10px;" data-action="nuova-regola-importo">+ Nuova regola</button>
  </div>`;
}

function h(id) { return document.getElementById(id); }

function chiudiModal() { h('modalRoot').innerHTML = ''; }

function onClickDelegato(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case 'nuovo-cliente': modalCliente(null); break;
    case 'apri-cliente': chiudiModal(); SCHEDA_CLIENTE = id; setView('schedacliente'); break;
    case 'modifica-cliente': modalCliente(id); break;
    case 'elimina-cliente':
      if (confermaAzione('Eliminare definitivamente questo cliente? Verranno cancellati anche tutti i dati collegati: documenti, comunicazioni, ritenute, task, F24, contabilità e note sulle scadenze. Operazione irreversibile.')) {
        eliminaCliente(id);
        chiudiModal(); render(); toast('Cliente eliminato.');
      }
      break;
    case 'salva-cliente': {
      const editing = el.dataset.editing === '1';
      const { cliente, valido } = leggiFormCliente(id, editing);
      if (!valido) { toast('Inserisci almeno la ragione sociale.'); return; }
      if (editing && clienteById(id)) {
        // sostituzione completa del record (comportamento storico del form): il record esistente
        // viene rimpiazzato, non fuso campo per campo - aggiornaCliente() invece fa un merge, quindi
        // qui restiamo sull'assegnazione diretta per non cambiare comportamento a chi usa il form.
        const idx = STATE.clienti.findIndex(c => c.id === id);
        STATE.clienti[idx] = cliente;
        salvaStato();
      } else {
        aggiungiCliente(cliente);
      }
      chiudiModal(); render(); toast(editing ? 'Cliente aggiornato.' : 'Cliente aggiunto.');
      break;
    }
    case 'chiudi-modal': chiudiModal(); break;
    case 'pagina-prev': { const v = el.dataset.vista; PAGINE[v] = Math.max(1, (PAGINE[v]||1) - 1); render(); break; }
    case 'pagina-next': { const v = el.dataset.vista; const tot = Number(el.dataset.tot)||1; PAGINE[v] = Math.min(tot, (PAGINE[v]||1) + 1); render(); break; }
    case 'apri-ricerca-globale': modalRicercaGlobale(); break;
    case 'apri-selettore-operatore': modalSelettoreOperatore(); break;
    case 'operatore-scegli': impostaOperatore(el.dataset.nome); chiudiModal(); break;
    case 'ricerca-apri': { const r = RICERCA_RISULTATI[Number(el.dataset.idx)]; if (r && r.azione) r.azione(); break; }
    case 'azioni-apri': { const r = AZIONI_RISULTATI[Number(el.dataset.idx)]; if (r && r.azione) r.azione(); break; }
    case 'chiudi-modal-backdrop': if (e.target === el) chiudiModal(); break;

    case 'goto-scadenze': setView('scadenze', { filtro: el.dataset.filtro }); break;
    case 'nav': setView(el.dataset.nav); break;
    case 'nav-onboarding-cliente': setView('onboarding', { clienteId: id }); break;
    /* Dashboard "Adempimenti annuali in corso" (task #116): in dashboard non c'è un modale di
       dettaglio dedicato (l'unica UI per lavorarci è il pannello espandibile già nella vista
       Adempimenti annuali stessa - stesso pattern di ann-toggle-expand più sotto) — quindi da qui
       si naviga a quella vista, filtrando per il cliente giusto (così la riga è in cima e non
       persa in paginazione tra magari centinaia di adempimenti) e la si apre già espansa. */
    case 'dash-apri-annuale': {
      const annD = derivati().annuali.find(x => x.id === id);
      if (annD) {
        ANN_FILTRO = { tipo: 'Tutti', resp: 'Tutti', stato: 'Tutti', q: nomeCliente(annD.clienteId) };
        ANN_EXPANDED.add(id);
        resetPagina('annuali');
      }
      setView('annuali');
      break;
    }

    case 'nuova-ritenuta': modalRitenuta(); break;
    case 'elimina-ritenuta':
      if (confermaAzione('Eliminare questa riga ritenuta?')) {
        STATE.ritenuteRighe = STATE.ritenuteRighe.filter(r => r.id !== id);
        salvaStato(); render(); toast('Riga eliminata.');
      }
      break;
    case 'salva-ritenuta': {
      const clienteId = h('rCliente').value;
      const percipiente = h('rPercipiente').value.trim();
      const dataFattura = h('rDataFattura').value;
      const dataPagamento = h('rDataPagamento').value;
      const numeroFattura = h('rNumeroFattura').value.trim();
      const importo = parseFloat(h('rImporto').value);
      // La data pagamento non è più obbligatoria: se manca, la riga viene salvata come
      // placeholder ("in attesa di pagamento") e non genera scadenza finché non le si imposta
      // una data (vedi calcolaScadenzeRitenute e l'azione "rit-imposta-pagamento").
      if (!clienteId || !percipiente || !dataFattura || !importo) { toast('Compila tutti i campi obbligatori (*).'); return; }
      STATE.ritenuteRighe.push({ id: uid('rit'), clienteId, percipiente, dataFattura, dataPagamento: dataPagamento || null, numeroFattura, importo, statoRit: dataPagamento ? 'Da pagare' : 'In attesa di pagamento' });
      salvaStato(); chiudiModal(); render(); toast(dataPagamento ? 'Ritenuta registrata.' : 'Ritenuta registrata come placeholder: imposta la data di pagamento quando arriva.');
      break;
    }

    case 'nuova-comunicazione': modalComunicazione(el.dataset.cliente || null); break;
    case 'elimina-comunicazione':
      if (confermaAzione('Eliminare questa comunicazione?')) { eliminaComunicazione(id); render(); toast('Comunicazione eliminata.'); }
      break;
    case 'elimina-comunicazione-gruppo':
      if (confermaAzione('Eliminare questa comunicazione per tutti i destinatari?')) {
        STATE.comunicazioni.filter(c => c.gruppoId === id && c.filePercorso).forEach(c => eliminaFileReale(c.filePercorso));
        STATE.comunicazioni = STATE.comunicazioni.filter(c => c.gruppoId !== id);
        salvaStato(); render(); toast('Comunicazione eliminata per tutti i destinatari.');
      }
      break;
    case 'com-toggle-gruppo':
      if (COM_GRUPPI_EXPANDED.has(id)) COM_GRUPPI_EXPANDED.delete(id); else COM_GRUPPI_EXPANDED.add(id);
      render();
      break;
    case 'com-apri-thread': modalThreadComunicazione(id); break;
    case 'com-rispondi': {
      const campo = h('threadRispostaTesto');
      if (!campo || !campo.value.trim()) { toast('Scrivi qualcosa prima di rispondere.', true); return; }
      aggiungiRispostaComunicazione(id, campo.value, 'studio');
      modalThreadComunicazione(id);
      toast('Risposta inviata: il cliente la vedrà nel suo portale.');
      break;
    }
    case 'com-salva-risposta-doc': {
      const comId = el.dataset.com;
      const rispId = el.dataset.risp;
      const doc = salvaDocumentoDaComunicazione(comId, rispId);
      if (doc) {
        modalThreadComunicazione(comId);
        toast('Documento salvato nella cartella del cliente (' + doc.categoria + ').');
      } else {
        toast('Impossibile salvare: allegato non trovato o già salvato.', true);
      }
      break;
    }
    case 'com-chiudi-richiesta': {
      aggiornaComunicazione(id, { richiestaChiusa: true });
      render();
      modalThreadComunicazione(id);
      toast('Richiesta segnata come chiusa.');
      break;
    }
    case 'com-riapri-richiesta': {
      aggiornaComunicazione(id, { richiestaChiusa: false });
      render();
      modalThreadComunicazione(id);
      toast('Richiesta riaperta.');
      break;
    }
    case 'salva-comunicazione': {
      const { clienteIds } = leggiDestinatari('c');
      const data = h('cData').value;
      const categoria = h('cCategoria').value;
      const stato = h('cStato').value;
      const visibilePortale = h('cVisibilePortale').checked;
      const oggetto = h('cOggetto').value.trim();
      const corpo = h('cCorpo').value.trim();
      const note = h('cNote').value.trim();
      if (clienteIds.length === 0 || !data || !oggetto) { toast('Seleziona almeno un destinatario e compila i campi obbligatori (*).'); return; }
      const gruppoId = clienteIds.length > 1 ? uid('comgrp') : null;
      // Task #105: se il destinatario è UN solo cliente e la spunta "Riguarda un F24" è attiva,
      // registriamo automaticamente anche un F24 nella sezione dedicata di quel cliente (con lo
      // stesso eventuale allegato) — un pre-id per la comunicazione ci permette di far comparire
      // lo stesso id come comunicazioneRif sull'F24, per tracciabilità.
      const cIsF24El = h('cIsF24');
      const isF24 = clienteIds.length === 1 && !!(cIsF24El && cIsF24El.checked);
      let f24TipoVal = null, f24ImportoVal = null, comIdPreassegnato = null;
      if (isF24) {
        f24TipoVal = h('cF24Tipo') ? h('cF24Tipo').value : 'Debito';
        f24ImportoVal = (h('cF24Importo') && h('cF24Importo').value !== '') ? Number(h('cF24Importo').value) : null;
        if (f24ImportoVal === null || isNaN(f24ImportoVal)) { toast("Inserisci l'importo dell'F24 (obbligatorio per registrarlo nella sezione F24)."); return; }
        comIdPreassegnato = uid('com');
      }
      // creatoDa (task #98): solo attribuzione/audit di chi ha scritto questa comunicazione da
      // tastiera in questo momento - null se su questo browser non è stato scelto un operatore
      // (nessuna restrizione, la comunicazione si crea comunque).
      const categoriaDocRichiestaEl = h('cCategoriaDocRichiesta');
      const categoriaDocumentoRichiesta = (categoria === 'Raccolta documentale' && categoriaDocRichiestaEl) ? categoriaDocRichiestaEl.value : null;
      const datiComuni = { data, categoria, stato, oggetto, corpo, note, visibilePortale, gruppoId, categoriaDocumentoRichiesta, creatoDa: operatoreCorrente() || null };
      const inputFileCom = h('cFile');
      const fileCom = (inputFileCom && inputFileCom.files && inputFileCom.files[0]) || null;
      if (fileCom) {
        // allegato: una copia per ciascun destinatario, nella sua cartella (stessa logica di Documenti/Contabilità)
        Promise.all(clienteIds.map(clienteId => {
          const cliente = clienteById(clienteId);
          return uploadFileReale(fileCom, clienteId, cliente.ragioneSociale, 'Comunicazioni')
            .then(esito => ({ clienteId, esito }))
            .catch(err => ({ clienteId, errore: err.message }));

          let nFalliti = 0;
          risultati.forEach(({ clienteId, esito, errore }) => {
            const extra = esito ? { filePercorso: esito.percorso, fileNome: esito.nomeFile, fileDimensione: esito.dimensione } : {};
            const extraId = (isF24 && clienteId === clienteIds[0]) ? { id: comIdPreassegnato } : {};
            aggiungiComunicazione(Object.assign({ clienteId }, datiComuni, extra, extraId));
            if (isF24 && clienteId === clienteIds[0]) {
              aggiungiF24(Object.assign({ clienteId, tipo: f24TipoVal, data, importo: f24ImportoVal, descrizione: oggetto, comunicazioneRif: comIdPreassegnato }, extra));
            }
            if (!esito) { nFalliti++; console.error('Upload allegato comunicazione non riuscito:', errore); }
          });
          chiudiModal(); render();
          if (nFalliti === 0) toast(clienteIds.length > 1 ? `Comunicazione e allegato pubblicati per ${clienteIds.length} clienti.` : (isF24 ? 'Comunicazione, allegato e F24 registrati.' : 'Comunicazione e allegato registrati.'));
          else toast(`Comunicazione registrata; l'allegato non è stato caricato per ${nFalliti} ${nFalliti===1?'destinatario':'destinatari'}.`, true);
        });
      } else {
        clienteIds.forEach(clienteId => {
          const extraId = (isF24 && clienteId === clienteIds[0]) ? { id: comIdPreassegnato } : {};
          aggiungiComunicazione(Object.assign({ clienteId }, datiComuni, extraId));
        });
        if (isF24) {
          aggiungiF24({ clienteId: clienteIds[0], tipo: f24TipoVal, data, importo: f24ImportoVal, descrizione: oggetto, comunicazioneRif: comIdPreassegnato });
        }
        chiudiModal(); render(); toast(clienteIds.length > 1 ? `Comunicazione pubblicata per ${clienteIds.length} clienti.` : (isF24 ? 'Comunicazione e F24 registrati.' : 'Comunicazione registrata.'));

      break;
