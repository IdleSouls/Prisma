<!-- SheetJS: lettura/scrittura file Excel (.xlsx) lato client. Usata solo per l'import bilanci
     e l'import contabilità/prima nota; se manca internet o il CDN è bloccato, l'app resta
     comunque utilizzabile al 100% con i file .csv (nessuna dipendenza esterna richiesta). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blu-scuro:#132A4C; --blu-mid:#2E63C7; --blu-light:#E7EEFC; --blu-accent:#4F7CFF;
  --verde:#1B7A43; --verde-bg:#DEF5E7;
  --giallo:#9C6500; --giallo-bg:#FFF1CC;
  --rosso:#B3261E; --rosso-bg:#FBE2E1;
  --viola:#5b2d90; --viola-bg:#EFE3F9;
  --grigio:#565E6D; --grigio-bg:#EAECF0;
  --arancio:#C2540A; --arancio-bg:#FCE6D3;
  --ciano:#0E7C86; --ciano-bg:#DAF1F0;
  --bg:#F3F5F9; --card-bg:#ffffff; --border:#E4E8F0; --text:#161B26; --text-mut:#6B7385;
  --sidebar-w:230px;
  --shadow-sm:0 1px 2px rgba(19,42,76,.06);
  --shadow-md:0 6px 20px rgba(19,42,76,.08);
  --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
a{color:var(--blu-mid);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c9d0dd;border-radius:20px;}

/* layout */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,#0B1226 0%,#05070F 100%);color:#fff;display:flex;flex-direction:column;padding:18px 0;overflow-y:auto;}
#sidebar .brand{padding:0 22px 18px 22px;font-weight:800;font-size:17px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-.015em;color:#fff;}
#sidebar .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--blu-accent);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;overflow:hidden;}
#sidebar .brand .logo img{width:100%;height:100%;object-fit:cover;display:block;}
#sidebar .brand small{display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:2px;letter-spacing:.01em;color:#c3d1e8;}
#sidebar nav{flex:1;}
#sidebar .navitem{display:flex;align-items:center;gap:10px;padding:9px 22px;margin:1px 10px;border-radius:8px;color:#e3eaf6;text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s,color .12s;}
#sidebar .navitem .ic{width:16px;height:16px;text-align:center;flex:none;opacity:.95;display:inline-flex;align-items:center;justify-content:center;}
#sidebar .navitem .ic svg{width:16px;height:16px;display:block;}
#sidebar .navitem:hover{background:rgba(255,255,255,.1);color:#fff;}
#sidebar .navitem.active{background:#fff;color:var(--blu-scuro);font-weight:700;box-shadow:var(--shadow-md);}
#sidebar .navitem.active .ic{opacity:1;}
#sidebar .navgroup{padding:16px 22px 6px 22px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;font-weight:700;color:#c3d1e8;}
#sidebar .foot{padding:14px 22px;font-size:11px;opacity:.7;color:#c3d1e8;border-top:1px solid rgba(255,255,255,.14);margin-top:8px;}

#main{margin-left:var(--sidebar-w);min-height:100vh;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 30px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
#topbar h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.02em;color:var(--blu-scuro);}
#topbar .sub{font-size:12.5px;color:var(--text-mut);margin-top:3px;font-weight:500;}
#content{padding:26px 30px 60px 30px;}

/* cards */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);}
.card + .card{margin-top:16px;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;align-items:start;}
.kpi{border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;cursor:pointer;transition:transform .12s;}
.kpi:hover{transform:translateY(-1px);}
.kpi .n{font-size:29px;font-weight:800;line-height:1;}
.kpi .l{font-size:11.5px;margin-top:7px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.03em;line-height:1.3;}
.kpi.scaduti{background:var(--rosso-bg);color:var(--rosso);}
.kpi.inscadenza{background:var(--giallo-bg);color:var(--giallo);}
.kpi.futuri{background:var(--verde-bg);color:var(--verde);}
.kpi.completati{background:var(--blu-light);color:var(--blu-scuro);}

.section-title{font-size:15px;font-weight:700;margin:0 0 14px 0;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.005em;}
.section-title .cnt{font-weight:500;color:var(--text-mut);font-size:12.5px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:#F7F8FB;color:var(--text-mut);padding:9px 10px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:#F7F9FC;}
table.compact td, table.compact th{padding:7px 8px;}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.01em;}
.badge.stato-da-fare{background:var(--giallo-bg);color:var(--giallo);}
.badge.stato-calcolato{background:#BDD7EE;color:var(--blu-scuro);}
.badge.stato-inviato-telematicamente{background:var(--verde-bg);color:var(--verde);}
.badge.stato-comunicato-al-cliente{background:var(--viola-bg);color:var(--viola);}
.badge.stato-errore{background:var(--rosso-bg);color:var(--rosso);}
.badge.stato-non-applicabile{background:var(--grigio-bg);color:var(--grigio);}
.badge.regime{background:var(--blu-light);color:var(--blu-scuro);}
.badge.cessato{background:var(--grigio-bg);color:var(--grigio);}
.badge.attivo{background:var(--verde-bg);color:var(--verde);}

select.statoSel{font-weight:600;border:1px solid var(--border);border-radius:6px;padding:4px 6px;}
select.statoSel.stato-da-fare{background:var(--giallo-bg);color:var(--giallo);border-color:transparent;}
select.statoSel.stato-calcolato{background:#BDD7EE;color:var(--blu-scuro);border-color:transparent;}
select.statoSel.stato-inviato-telematicamente{background:var(--verde-bg);color:var(--verde);border-color:transparent;}
select.statoSel.stato-comunicato-al-cliente{background:var(--viola-bg);color:var(--viola);border-color:transparent;}
select.statoSel.stato-errore{background:var(--rosso-bg);color:var(--rosso);border-color:transparent;}
select.statoSel.stato-non-applicabile{background:var(--grigio-bg);color:var(--grigio);border-color:transparent;}

.pill-delta{font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block;}
.pill-delta.scaduto{background:var(--rosso-bg);color:var(--rosso);}
.pill-delta.oggi{background:var(--rosso-bg);color:var(--rosso);}
.pill-delta.vicino{background:var(--giallo-bg);color:var(--giallo);}
.pill-delta.lontano{background:#E2EFDA;color:var(--verde);}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13px;font-weight:600;transition:background .12s,border-color .12s;}
.btn:hover{background:#f2f4f7;}
.btn.primary{background:var(--blu-mid);border-color:var(--blu-mid);color:#fff;box-shadow:var(--shadow-sm);}
.btn.primary:hover{background:var(--blu-scuro);border-color:var(--blu-scuro);}
.btn.danger{background:#fff;border-color:var(--rosso-bg);color:var(--rosso);}
.btn.danger:hover{background:var(--rosso-bg);}
.btn.small{padding:5px 11px;font-size:12px;}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:#f2f4f7;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.paginazione{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 4px 2px;}
tr.riga-selezionata{background:var(--blu-light);}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.field label{font-size:11.5px;font-weight:600;color:var(--text-mut);text-transform:uppercase;letter-spacing:.02em;}
.field input, .field select, .field textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;min-width:150px;}
.field textarea{min-width:260px;}
.field.grow input, .field.grow select{min-width:220px;}
/* flex-shrink:0 è il pezzo che mancava per il layout "Destinatari" segnalato da Matteo (e lo stesso
   identico bug latente nella riga radio "tipo import" di Contabilità, riga ~5317): quando più
   .checkline stanno affiancati dentro un contenitore flex-wrap (es. "Un cliente / Tutti i clienti
   attivi / Più clienti"), senza questa riga un .checkline può restringersi sotto la sua larghezza
   naturale (comportamento di default di flexbox) e il suo testo va a capo PAROLA PER PAROLA invece
   che l'intera opzione andare a capo come blocco - il risultato è il pallino del radio allineato
   alla prima riga ma il testo spezzato in modo incoerente. Con flex-shrink:0 ogni opzione mantiene
   la sua larghezza intera: se non c'è spazio, è l'opzione INTERA a scendere a capo (flex-wrap del
   contenitore), mai il singolo testo al suo interno. */
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;flex-shrink:0;}
/* .checkline.nowrap (task #109): flex-shrink:0 qui sopra impedisce solo a un .checkline INTERO di
   restringersi rispetto ai fratelli in una riga condivisa - non impedisce al TESTO al suo interno
   di andare a capo parola per parola quando lo spazio scarseggia (un nodo di testo dentro un
   contenitore flex ha comunque una sua "dimensione minima automatica" pari alla parola più lunga,
   non all'intera frase). Segnalato ancora "sballato" da Matteo sulla riga radio "Destinatari"
   nonostante flex-shrink:0: le tre opzioni sono frasi BREVI che devono sempre stare su una riga
   sola (o l'opzione intera scende a capo, mai spezzata a metà). Applicata solo dove serve, non su
   .checkline in generale, perché nelle griglie di adempimenti (grid3) ogni checkbox ha una sua
   cella dedicata e lì andare a capo su più righe dentro la cella è il comportamento voluto. */
.checkline.nowrap{white-space:nowrap;}
/* .checkline.top: per un checkbox con un'etichetta LUNGA che deve poter andare a capo (es. "Riguarda
   un F24..." in Nuova comunicazione) il nowrap sopra sarebbe sbagliato (spingerebbe la frase fuori
   dal modale). Qui il problema non è il testo a capo in sé (voluto, normale per una frase lunga) ma
   che "align-items:center" (sopra) centra il quadratino sull'INTERO blocco di più righe invece di
   allinearlo alla prima riga - il difetto "sballato" segnalato da Matteo. flex-start allinea in alto,
   e il margin-top sul checkbox lo riporta alla stessa linea di base della prima riga di testo. */
.checkline.top{align-items:flex-start;}
.checkline.top input{margin-top:3px;flex:none;}
/* ".field label" (sopra) è pensata per l'etichetta principale di un campo, ma un ".checkline"
   (radio/checkbox con testo accanto, es. "Un cliente"/"Tutti i clienti attivi") finisce spesso
   annidato dentro un ".field" (direttamente o dentro un wrapper) e ne erediterebbe lo stile tutto-
   maiuscolo/più piccolo - con un'etichetta lunga (es. "Tutti i clienti attivi (22)") il maiuscolo la
   allarga quanto basta da andare a capo, e "align-items:center" allora centra il pallino sull'intero
   blocco di due righe invece che sulla prima: il risultato è il layout "storto" segnalato da Matteo
   sul modale "Modifica modello ricorrente" (ma il problema, non corretto, si sarebbe ripresentato
   ovunque un .checkline con testo un po' lungo finisse dentro un .field). Specificità apposta più
   alta di ".field label" così vince sempre, a prescindere da quanto è annidato. */
.field label.checkline{font-size:13px;font-weight:400;color:var(--text);text-transform:none;letter-spacing:normal;}

.empty{text-align:center;padding:50px 20px;color:var(--text-mut);}
.empty .big{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,26,36,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:12px;max-width:720px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal h2{margin:0 0 4px 0;font-size:18px;}
.modal .modal-sub{color:var(--text-mut);font-size:12.5px;margin-bottom:18px;}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.modal .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 16px;}
.modal fieldset{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 0 0;}
.modal legend{font-size:12px;font-weight:700;color:var(--blu-scuro);padding:0 6px;}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.modal .full{grid-column:1 / -1;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tabs .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--text-mut);border-bottom:2px solid transparent;cursor:pointer;}
.tabs .tab.active{color:var(--blu-scuro);border-bottom-color:var(--blu-mid);}

.progress{height:8px;background:#eceff3;border-radius:6px;overflow:hidden;}
.progress > div{height:100%;background:var(--blu-mid);}

.client-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;cursor:pointer;}
.client-row:hover{border-color:var(--blu-mid);}
.client-row .name{font-weight:700;font-size:13.5px;}
.client-row .meta{font-size:12px;color:var(--text-mut);margin-top:2px;}
.client-row .right{display:flex;align-items:center;gap:16px;}

.subtask-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--border);}
.subtask-row:last-child{border-bottom:none;}
.subtask-row.done .name{text-decoration:line-through;color:var(--text-mut);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-head{font-size:11px;font-weight:700;color:var(--text-mut);text-align:center;padding-bottom:4px;text-transform:uppercase;}
.cal-day{min-height:86px;border:1px solid var(--border);border-radius:7px;padding:5px;font-size:11px;background:#fff;}
.cal-day.oggi{border-color:var(--blu-mid);box-shadow:0 0 0 1px var(--blu-mid) inset;}
.cal-day.has-eventi{cursor:pointer;}
.cal-day.has-eventi:hover{border-color:var(--blu-mid);box-shadow:0 0 0 1px var(--blu-mid) inset;}
.cal-day .num{font-weight:700;margin-bottom:3px;}
.cal-day .ev{background:var(--blu-light);color:var(--blu-scuro);border-left:3px solid var(--blu-mid);border-radius:3px;padding:1px 4px 1px 5px;margin-bottom:2px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-day .ev.cat-imposte-dirette{background:var(--rosso-bg);color:var(--rosso);border-left-color:var(--rosso);}
.cal-day .ev.cat-imposte-indirette{background:var(--blu-light);color:var(--blu-scuro);border-left-color:var(--blu-mid);}
.cal-day .ev.cat-contabili{background:var(--viola-bg);color:var(--viola);border-left-color:var(--viola);}
.cal-day .ev.cat-previdenziali{background:var(--verde-bg);color:var(--verde);border-left-color:var(--verde);}
.cal-day .ev.cat-lavoro{background:var(--giallo-bg);color:var(--giallo);border-left-color:var(--giallo);}
.cal-day .ev.cat-camerali{background:var(--ciano-bg);color:var(--ciano);border-left-color:var(--ciano);}
.cal-day .ev.cat-altri{background:var(--arancio-bg);color:var(--arancio);border-left-color:var(--arancio);}
.cal-day .ev.cat-task-team{background:var(--grigio-bg);color:var(--grigio);border-left-color:var(--grigio);}
.cal-gruppo{display:contents;}
.cal-day .ev.scaduto{background:var(--rosso-bg)!important;color:var(--rosso)!important;border-left-color:var(--rosso)!important;font-weight:700;}
.cal-day .ev.completato{opacity:.58;text-decoration:line-through;}
.cal-day .cal-piu{color:var(--blu-mid);font-weight:700;font-size:10px;margin-top:1px;}
.cal-day.altromese{opacity:.35;}
.cal-legenda{display:flex;flex-wrap:wrap;gap:10px 16px;margin:10px 0 14px;}
.cal-legenda .voce{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-mut);}
.cal-legenda .dot{width:9px;height:9px;border-radius:3px;flex:none;}
.cal-giorno-lista .voce{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);}
.cal-giorno-lista .voce:last-child{border-bottom:none;}
.cal-giorno-lista .dot{width:10px;height:10px;border-radius:3px;flex:none;}
.cal-giorno-lista .voce.completato .titolo{text-decoration:line-through;opacity:.6;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--blu-scuro);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;opacity:0;transform:translateY(8px);transition:all .2s;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:var(--rosso);}

.icon-x{cursor:pointer;color:var(--text-mut);font-weight:700;font-size:18px;line-height:1;background:none;border:none;padding:2px 6px;}
.icon-x:hover{color:var(--text);}

.helptext{font-size:11.5px;color:var(--text-mut);margin-top:2px;}
select[multiple]{min-height:150px;}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:0 0 10px 0;}
.adm-gruppo{margin:0 0 10px 0;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#FAFBFC;}
.adm-gruppo:last-child{margin-bottom:0;}
.adm-gruppo-titolo{font-size:12.5px;font-weight:700;color:var(--blu-scuro);margin:0 0 8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.adm-gruppo-cnt{font-size:10.5px;font-weight:700;color:var(--text-mut);background:var(--blu-light);border-radius:20px;padding:2px 8px;white-space:nowrap;}
.adm-sotto-titolo{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mut);margin:8px 0 5px 0;display:flex;align-items:center;gap:6px;}
.adm-sotto-titolo:first-of-type{margin-top:0;}
.adm-sotto-cnt{font-weight:500;text-transform:none;letter-spacing:0;opacity:.75;}

/* client-row polish */
.client-row{box-shadow:var(--shadow-sm);transition:border-color .12s,transform .12s;}
.client-row:hover{transform:translateY(-1px);}

/* badges extra */
.badge.info{background:var(--blu-light);color:var(--blu-mid);}
.badge.viola{background:var(--viola-bg);color:var(--viola);}

/* task team (board) */
.task-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
.task-col-head{font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-mut);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.task-card{background:var(--card-bg);border:1px solid var(--border);border-radius:9px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.task-card .titolo{font-weight:700;font-size:13.5px;margin-bottom:4px;}
.task-card .meta{font-size:11.5px;color:var(--text-mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;}
.task-card .note{font-size:12px;color:var(--text-mut);margin-top:4px;white-space:pre-wrap;}
.task-card .azioni{display:flex;gap:6px;margin-top:8px;}
@media (max-width:900px){.task-board{grid-template-columns:1fr;}}

/* catalogo impostazioni */
.cat-tipo{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;}
.cat-tipo.disattivo{opacity:.55;}
.cat-tipo .cat-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
.cat-tipo .cat-head .nome{font-weight:700;font-size:13.5px;flex:1;}
.occ-row{display:grid;grid-template-columns:70px 70px 1fr 32px;gap:8px;align-items:center;padding:4px 0;}
.occ-row input{border:1px solid var(--border);border-radius:6px;padding:5px 7px;width:100%;}

/* Mini-card generica (titolo + sottotitolo grigio): nata per il mockup del portale, oggi usata
   anche dall'anteprima del wizard import contabilità - task #111 ha tolto il mockup ma questa
   regola resta, ha un secondo utilizzo reale. */
.ph-card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.ph-card .t{font-weight:700;font-size:12.5px;}
.ph-card .s{font-size:11.5px;color:var(--text-mut);margin-top:2px;}

.portal-banner{display:flex;align-items:center;gap:10px;background:var(--blu-light);color:var(--blu-scuro);border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:18px;}
.portal-banner .tag-anteprima{flex:0 0 auto;background:var(--blu-scuro);color:#fff;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
.portal-fullscreen-backdrop{position:fixed;inset:0;background:rgba(14,32,57,.92);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 16px;overflow-y:auto;z-index:60;}
.portal-fullscreen-bar{width:100%;max-width:380px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.portal-fullscreen-bar .lbl{color:#fff;font-size:12.5px;font-weight:700;}
.portal-fullscreen-bar .icon-x{color:#fff;font-size:22px;}
/* Anteprima PORTALE DESKTOP a schermo intero (task #111: unica anteprima rimasta nel tab Portale
   cliente, dopo la rimozione del mockup telefono inline - quella era ridondante col link reale e
   affollava la pagina senza aggiungere nulla che questa non mostri già meglio): una vera pagina,
   pensata per vedere "la schermata grande da PC" che vedrebbe davvero il cliente - hero con i
   numeri chiave, poi le sezioni affiancate in una griglia invece di un'unica colonna stretta. */
.portal-fullscreen-backdrop.desktop{background:var(--bg);padding:0;align-items:stretch;}
.portal-fullscreen-bar.desktop{max-width:none;width:100%;background:#fff;border-bottom:1px solid var(--border);padding:13px 30px;position:sticky;top:0;z-index:2;box-shadow:var(--shadow-sm);gap:14px;}
.portal-fullscreen-bar.desktop .lbl{color:var(--text-mut);font-weight:600;}
.portal-fullscreen-bar.desktop .icon-x{color:var(--text-mut);font-size:20px;}
.portal-fullscreen-bar .bar-right{display:flex;align-items:center;gap:12px;margin-left:auto;}
.pd-toggle-sens{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-mut);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:6px 13px 6px 11px;}
.pd-toggle-sens:hover{background:#eceff5;}
.pd-toggle-sens.on{background:var(--blu-light);color:var(--blu-scuro);border-color:var(--blu-accent);}
.pd-toggle-sens .dot{width:7px;height:7px;border-radius:50%;background:var(--text-mut);flex:none;}
.pd-toggle-sens.on .dot{background:var(--blu-accent);}
/* Navigazione fra le "schermate" del portale desktop: Panoramica è sempre la prima/predefinita
   (recap dell'azienda), le altre restano identiche a prima ma ora sono schermate a sé invece di
   stare tutte affastellate in un'unica pagina lunghissima. */
.pd-nav{display:flex;gap:4px;flex-wrap:wrap;background:#fff;padding:10px 48px;border-bottom:1px solid var(--border);}
.pd-nav-item{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-mut);white-space:nowrap;}
.pd-nav-item:hover{background:var(--bg);color:var(--text);}
.pd-nav-item.active{background:var(--blu-scuro);color:#fff;}
.pd-hero{background:linear-gradient(120deg,var(--blu-scuro) 0%,#1c3f74 55%,var(--blu-accent) 140%);color:#fff;padding:40px 48px 46px;}
.pd-hero .eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;opacity:.72;margin-bottom:12px;}
.pd-hero h1{font-size:30px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em;}
.pd-hero .sub{font-size:14px;opacity:.86;max-width:560px;line-height:1.55;}
.pd-stats{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;}
.pd-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px 18px;min-width:150px;}
.pd-stat .n{font-size:23px;font-weight:800;line-height:1;}
.pd-stat .l{font-size:11.5px;opacity:.86;margin-top:6px;font-weight:600;}
.pd-body{max-width:1180px;margin:0 auto;padding:24px 48px 60px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px;}
.pd-panel{background:#fff;border-radius:16px;box-shadow:var(--shadow-md);padding:22px 24px;align-self:start;}
.pd-panel.span2{grid-column:1/-1;}
.pd-panel h2{display:flex;align-items:center;gap:10px;font-size:14.5px;margin:0 0 14px;font-weight:800;color:var(--blu-scuro);}
.pd-panel h2 .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
.pd-panel h2 .ic svg{width:15px;height:15px;}
.pd-panel h2 .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--text-mut);background:var(--bg);border-radius:20px;padding:3px 10px;}
.pd-item{padding:12px 0;border-bottom:1px solid var(--border);}
.pd-item:last-child{border-bottom:none;padding-bottom:0;}
.pd-item .t{font-weight:700;font-size:13px;color:var(--text);}
.pd-item .s{font-size:12px;color:var(--text-mut);margin-top:3px;line-height:1.45;}
.pd-empty{color:var(--text-mut);font-size:12.5px;padding:6px 0 2px;}
.pd-progress-row{display:flex;align-items:center;gap:12px;margin-top:6px;}
.pd-progress-row .bar{flex:1;height:7px;border-radius:20px;background:var(--bg);overflow:hidden;}
.pd-progress-row .bar div{height:100%;background:var(--verde);border-radius:20px;}
.pd-progress-row .pct{font-size:12px;font-weight:800;color:var(--verde);flex:none;}
/* Schermata Panoramica: recap anagrafica (kv-grid), riepilogo comunicazioni per stato (mini-stat)
   e dato sensibile mascherabile (pd-masked, si attiva col toggle nella barra in alto). */
.pd-kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;}
.pd-kv{padding:10px 0;border-bottom:1px solid var(--border);}
.pd-kv .k{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-mut);letter-spacing:.04em;margin-bottom:4px;}
.pd-kv .v{font-size:13.5px;font-weight:600;color:var(--text);word-break:break-word;}
.pd-masked{letter-spacing:2px;color:var(--text-mut);font-weight:700;}
.pd-mini-stats{display:flex;gap:10px;}
.pd-mini-stat{flex:1;border-radius:12px;padding:14px 10px;text-align:center;}
.pd-mini-stat .n{font-size:22px;font-weight:800;line-height:1;}
.pd-mini-stat .l{font-size:10.5px;margin-top:6px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.pd-mini-stat.aperte{background:var(--rosso-bg);color:var(--rosso);}
.pd-mini-stat.corso{background:var(--giallo-bg);color:var(--giallo);}
.pd-mini-stat.chiuse{background:var(--verde-bg);color:var(--verde);}
</style>
</head>

   ogni cliente col vecchio flag periodico attivo, sposta l'obbligo sull'equivalente annuale
   (nessuna perdita di dati) e rimuove il flag legacy e la voce di catalogo periodico legacy. */
const ADEMPIMENTI_DUPLICATI_LEGACY = [

];
function migraAdempimentiDuplicati(stato) {
  let migrati = 0;
  ADEMPIMENTI_DUPLICATI_LEGACY.forEach(({ idPeriodico, flagPeriodico, chiaveAnnuale }) => {
    (stato.clienti || []).forEach(c => {
      if (c.flags && c.flags[flagPeriodico]) {
        if (!Array.isArray(c.adempimentiAnnualiApplicabili)) c.adempimentiAnnualiApplicabili = [];
        if (!c.adempimentiAnnualiApplicabili.includes(chiaveAnnuale)) c.adempimentiAnnualiApplicabili.push(chiaveAnnuale);

      if (stato.catalogoPeriodico.length !== prima) migrati++;

   altrimenti il default) nel formato { flag, nome, dates:[{m,g,nota}] } atteso
   dal motore di generazione scadenze. */
function catalogoPeriodici() {
  const sorgente = (STATE && STATE.catalogoPeriodico) || DEFAULT_CATALOGO_PERIODICO;
  return sorgente.filter(def => def.attivo !== false).map(def => ({
    flag: def.flag, nome: def.nome, dates: def.occorrenze,
  }));
}

const FLAG_SEMPLICI = ['lipe','bolloFattElett','inail','fattureEstere','oss','imu','paghe','enasarco','iva398'];

  oss:'OSS (e-commerce/digitali UE)', imu:'IMU', paghe:'Paghe dipendenti',
  enasarco:'Enasarco / FIRR (agenti di commercio)',
  iva398:'IVA/IRES forfettaria L.398/91 (enti associativi)',
};
function tipoFlagPeriodico(flag) {
  const def = (STATE && STATE.catalogoPeriodico || DEFAULT_CATALOGO_PERIODICO).find(d => d.flag === flag);
  return (def && def.tipo) || TIPO_ADEMPIMENTO_DEFAULT;
}
/* Alcune scadenze periodiche non hanno una entry 1:1 nel catalogo perché sono generate "al
   volo" in generaScadenzePeriodiche/generaScadenzeRitenute (diritto camerale con data scelta
   per cliente, saldo/acconto imposte, INPS eccedente/gestione separata, ritenute autonomi) —
   qui il loro tipo per il raggruppamento in vista è fisso. */
const TIPO_SCADENZA_SINTETIZZATA = {
  'Diritto camerale': 'Adempimenti camerali/societari',
  'Saldo e acconto imposte sui redditi': 'Imposte dirette',
  'INPS Artig/Comm - eccedente': 'Adempimenti previdenziali',
  'INPS Gestione Separata': 'Adempimenti previdenziali',
  'Versamento ritenuta autonomi': 'Imposte dirette',
};
function tipoCategoriaScadenzaPeriodica(nomeTipo) {
  const def = (STATE && STATE.catalogoPeriodico || DEFAULT_CATALOGO_PERIODICO).find(d => d.nome === nomeTipo);
  if (def && def.tipo) return def.tipo;
  return TIPO_SCADENZA_SINTETIZZATA[nomeTipo] || TIPO_ADEMPIMENTO_DEFAULT;
}
/* Raggruppa un elenco di "tipo" (nomi) di scadenza periodica per categoria (imposte
   dirette/indirette/ecc.), nell'ordine di TIPI_ADEMPIMENTO, per i filtri <select> a optgroup. */
function raggruppaTipiPerCategoria(tipiValori) {
  const perCategoria = new Map();
  TIPI_ADEMPIMENTO.forEach(t => perCategoria.set(t, []));
  tipiValori.forEach(t => {
    const cat = tipoCategoriaScadenzaPeriodica(t);
    if (!perCategoria.has(cat)) perCategoria.set(cat, []);
    perCategoria.get(cat).push(t);
  });
  return Array.from(perCategoria.entries()).filter(([, vals]) => vals.length);
}

function flagsAttivi(cliente) {
  const f = {};
  f.ivaMensile = cliente.periodicitaIva === 'Mensile';
  f.ivaTrimestrale = cliente.periodicitaIva === 'Trimestrale';
  f.accontoIva = cliente.periodicitaIva === 'Mensile' || cliente.periodicitaIva === 'Trimestrale';
  f.intrastatMensile = cliente.periodicitaIntrastat === 'Mensile';
  f.intrastatTrimestrale = cliente.periodicitaIntrastat === 'Trimestrale';
  f.inpsArtigComm = cliente.previdenza === 'Artigiani/Commercianti';
  f.inpsGestSeparata = cliente.previdenza === 'Gestione Separata';
  f.inpsAgricoltura = cliente.previdenza === 'Agricoltura (CD/IAP)';
  for (const k of FLAG_SEMPLICI) f[k] = !!(cliente.flags && cliente.flags[k]);
  // eventuali flag personalizzati creati dall'utente (id custom_...) passano così come sono
  if (cliente.flags) for (const k of Object.keys(cliente.flags)) { if (!(k in f)) f[k] = !!cliente.flags[k]; }
  return f;
}

   cliente, passando per il calcolo dell'imposta, la comunicazione dell'importo dovuto al cliente

const SOTTO_DICHIARAZIONE_STANDARD = [

function chiaveScadenza(dataISO, clienteId, admNome) {
  return `${dataISO}|${clienteId}|${admNome.toLowerCase().trim()}`;
}
function toISO(anno, meseIdx1, giorno) {
  const m = String(meseIdx1).padStart(2, '0');
  const g = String(giorno).padStart(2, '0');
  return `${anno}-${m}-${g}`;
}
/* Le scadenze fiscali che cadono di sabato o domenica slittano per legge al primo giorno
   feriale successivo (di norma il lunedì). Non gestiamo il calendario delle festività
   infrasettimanali (troppo variabile/da aggiornare ogni anno), ma il weekend è la casistica
   più frequente ed è quella che vale sempre. Usare SOLO per date di scadenza, mai per il
   rendering della griglia calendario (lì i giorni devono restare quelli veri del mese). */
function spostaSeFestivo(dataISO) {
  const d = new Date(dataISO + 'T00:00:00');
  const gg = d.getDay(); // 0 = domenica, 6 = sabato
  if (gg === 6) d.setDate(d.getDate() + 2);
  else if (gg === 0) d.setDate(d.getDate() + 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dataScadenza(anno, meseIdx1, giorno) {
  return spostaSeFestivo(toISO(anno, meseIdx1, giorno));
}

function generaScadenzePeriodiche(clienti, anno, vecchie) {
  vecchie = vecchie || {};
  const out = [];
  const catalogo = catalogoPeriodici();
  for (const cliente of clienti) {
    if (cliente.stato === 'cessato') continue;
    const flags = flagsAttivi(cliente);
    for (const def of catalogo) {
      if (!flags[def.flag]) continue;
      for (const d of def.dates) {
        const dataISO = dataScadenza(anno, d.m, d.g);
        const admNome = d.nota;
        const k = chiaveScadenza(dataISO, cliente.id, admNome);
        const salvato = vecchie[k];
        out.push({
          id: k, data: dataISO, clienteId: cliente.id, famiglia: 'periodico',
          tipo: def.nome, nome: admNome,
          responsabile: (salvato && salvato.responsabile) || cliente.responsabileStudio || '',
          stato: (salvato && salvato.stato) || 'Da fare',
          nota: (salvato && salvato.nota) || '',
          dataCompletamento: (salvato && salvato.dataCompletamento) || null,
          importo: (salvato && salvato.importo != null) ? salvato.importo : null,
          solleciti: (salvato && salvato.solleciti) || [],
          annotazioni: (salvato && salvato.annotazioni) || [],
          step: costruisciStepControllo(salvato),
        });
      }
    }
    /* Nota: "Diritto camerale" NON genera più una scadenza periodica qui — vive solo
       nell'adempimento annuale DIRITTO_CAMERALE (con sotto-task Predisposizione/Invio F24),
       che calcola comunque la data in automatico da cliente.dirittoCameraleScelta tramite
       SCADENZA_DINAMICA_ANNUALE, esattamente come prima ma senza comparire due volte. */

    /* Saldo/I acconto imposte sui redditi (+ II acconto fisso 30/11) — e le voci INPS che per
       legge seguono lo stesso termine (Artig/Comm eccedente, Gestione Separata). La data del
       saldo/I acconto è scelta per singolo cliente (proroghe ISA/forfettari cambiano ogni anno). */
    const scelta = cliente.versamentoImposteScelta;
    if (scelta && DATA_PER_SCELTA_VERSAMENTO[scelta]) {
      const infoV = DATA_PER_SCELTA_VERSAMENTO[scelta];
      const dataSaldo = dataScadenza(anno, infoV.m, infoV.g);
      const dataIIAcc = dataScadenza(anno, 11, 30);
      const pushVersamento = (tipo, nomeSaldo, nomeIIAcc) => {
        [[dataSaldo, nomeSaldo], [dataIIAcc, nomeIIAcc]].forEach(([dataISO, nome]) => {
          const k = chiaveScadenza(dataISO, cliente.id, nome);
          const salvato = vecchie[k];
          out.push({
            id: k, data: dataISO, clienteId: cliente.id, famiglia: 'periodico',
            tipo, nome,
            responsabile: (salvato && salvato.responsabile) || cliente.responsabileStudio || '',
            stato: (salvato && salvato.stato) || 'Da fare',
            nota: (salvato && salvato.nota) || '',
            dataCompletamento: (salvato && salvato.dataCompletamento) || null,
            importo: (salvato && salvato.importo != null) ? salvato.importo : null,
            solleciti: (salvato && salvato.solleciti) || [],
            annotazioni: (salvato && salvato.annotazioni) || [],
            step: costruisciStepControllo(salvato),
          });
        });
      };
      pushVersamento('Saldo e acconto imposte sui redditi',
        `Saldo e I acconto imposte sui redditi (${scelta})`, 'II acconto imposte sui redditi');
      if (flags.inpsArtigComm) {
        pushVersamento('INPS Artig/Comm - eccedente',
          `Saldo e I acc. eccedente Artig/Comm (${scelta})`, 'II acc. eccedente Artig/Comm');
      }
      if (flags.inpsGestSeparata) {
        pushVersamento('INPS Gestione Separata',
          `Saldo e I acconto Gestione Separata (${scelta})`, 'II acconto Gestione Separata');
      }
    }
  }
  out.sort((a, b) => a.data.localeCompare(b.data) || a.clienteId.localeCompare(b.clienteId));
  return out;
}

function calcolaScadenzeRitenute(righe) {
  const perCliente = new Map();
  righe.forEach(r => {
    // Una riga senza data pagamento è un placeholder (fattura emessa, non ancora pagata dal
    // cliente): resta visibile in elenco come promemoria ma non entra nel calcolo del cumulo/
    // scadenza F24 finché non le si imposta una data pagamento (vedi azione "rit-imposta-pagamento").
    if (!r.dataPagamento) return;
    if (!perCliente.has(r.clienteId)) perCliente.set(r.clienteId, []);
    perCliente.get(r.clienteId).push(r);
  });
  const scadenzaPerRigaId = {};
  const inAttesaPerRigaId = {};
  perCliente.forEach(righeCliente => {
    const perMese = new Map();
    righeCliente.forEach(r => {
      const d = new Date(r.dataPagamento + 'T00:00:00');
      const key = d.getFullYear() * 12 + d.getMonth();
      if (!perMese.has(key)) perMese.set(key, []);
      perMese.get(key).push(r);
    });
    const mesiOrdinati = Array.from(perMese.keys()).sort((a, b) => a - b);
    const flush = (batch, meseChiave) => {
      const annoBase = Math.floor(meseChiave / 12);
      const meseBase = meseChiave % 12;
      const base = new Date(annoBase, meseBase + 1, 1);
      const giorno = base.getMonth() === 7 ? 20 : 16;
      const scad = dataScadenza(base.getFullYear(), base.getMonth() + 1, giorno);
      batch.forEach(r => { scadenzaPerRigaId[r.id] = scad; });
    };
    let batch = [], totBatch = 0;
    for (const key of mesiOrdinati) {
      const righeMese = perMese.get(key);
      batch = batch.concat(righeMese);
      totBatch += righeMese.reduce((s, r) => s + (Number(r.importo) || 0), 0);
      const isDicembre = (key % 12) === 11;
      if (totBatch >= SOGLIA_CUMULO_RITENUTE || isDicembre) { flush(batch, key); batch = []; totBatch = 0; }
    }
    batch.forEach(r => { inAttesaPerRigaId[r.id] = true; });
  });
  return { scadenzaPerRigaId, inAttesaPerRigaId };
}

function generaScadenzeRitenute(righe, vecchie) {
  vecchie = vecchie || {};
  const { scadenzaPerRigaId, inAttesaPerRigaId } = calcolaScadenzeRitenute(righe);
  const gruppi = new Map();
  righe.forEach(r => {
    const scad = scadenzaPerRigaId[r.id];
    if (!scad) return;
    const key = scad + '|' + r.clienteId;
    if (!gruppi.has(key)) gruppi.set(key, { data: scad, clienteId: r.clienteId, righe: [] });
    gruppi.get(key).righe.push(r);
  });
  const out = [];
  for (const { data, clienteId, righe: righeGruppo } of gruppi.values()) {
    const tutteChiuse = righeGruppo.every(r => ['Pagata','Inviata'].includes(r.statoRit));
    const nota = righeGruppo.map(r => `${r.percipiente} - ${(Number(r.importo)||0).toLocaleString('it-IT',{minimumFractionDigits:2})} EUR`).join('; ');
    const nomeAdm = 'Versamento ritenuta autonomi';
    const k = chiaveScadenza(data, clienteId, nomeAdm);
    const salvato = vecchie[k];
    out.push({
      id: k, data, clienteId, famiglia: 'periodico', tipo: nomeAdm, nome: nomeAdm,
      responsabile: (salvato && salvato.responsabile) || '',
      stato: tutteChiuse ? 'Inviato telematicamente' : ((salvato && salvato.stato) || 'Da fare'),
      nota, dataCompletamento: (salvato && salvato.dataCompletamento) || null,
      importo: righeGruppo.reduce((s, r) => s + (Number(r.importo) || 0), 0),
      solleciti: (salvato && salvato.solleciti) || [],
    });
  }
  return { scadenze: out, inAttesaPerRigaId };
}

/* Alcuni adempimenti annuali non hanno una scadenza fissa in catalogo (scadenzaDefault) ma una
   che dipende da una scelta specifica del cliente — es. il Diritto camerale segue la data scelta
   per il versamento imposte (cliente.dirittoCameraleScelta), proprio come faceva prima la
   scadenza periodica equivalente (ora rimossa per evitare la doppia comparsa). */
const SCADENZA_DINAMICA_ANNUALE = {
  DIRITTO_CAMERALE: (cliente, anno) => {
    const info = cliente.dirittoCameraleScelta && DATA_PER_SCELTA_DC[cliente.dirittoCameraleScelta];
    return info ? dataScadenza(anno, info.m, info.g) : null;
  },
};
function generaAdempimentiAnnuali(clienti, anno, vecchie) {
  vecchie = vecchie || {};
  const out = [];
  for (const cliente of clienti) {
    if (cliente.stato === 'cessato') continue;
    const applicabili = cliente.adempimentiAnnualiApplicabili || [];
    for (const chiave of applicabili) {
      const def = catalogoAnnualeTutti().find(a => a.chiave === chiave);
      if (!def || def.attivo === false) continue;
      const k = `${anno}|${cliente.id}|${def.chiave}`;
      const salvato = vecchie[k];
      const sottoSalvati = (salvato && salvato.sotto) || {};
      const sotto = def.sotto.map(nomeSotto => ({
        nome: nomeSotto,
        completato: !!(sottoSalvati[nomeSotto] && sottoSalvati[nomeSotto].completato),
        data: (sottoSalvati[nomeSotto] && sottoSalvati[nomeSotto].data) || null,
        responsabile: (sottoSalvati[nomeSotto] && sottoSalvati[nomeSotto].responsabile) || cliente.responsabileStudio || '',
      }));
      const nCompletati = sotto.filter(s => s.completato).length;
      const resolverDinamico = SCADENZA_DINAMICA_ANNUALE[def.chiave];
      const scadenzaDefault = def.scadenzaDefault ? dataScadenza(anno, def.scadenzaDefault.m, def.scadenzaDefault.g)
        : (resolverDinamico ? resolverDinamico(cliente, anno) : null);
      out.push({
        id: k, anno, clienteId: cliente.id, tipoChiave: def.chiave, tipoNome: def.nome, tipo: def.tipo || TIPO_ADEMPIMENTO_DEFAULT,
        responsabile: (salvato && salvato.responsabile) || cliente.responsabileStudio || '',
        scadenza: (salvato && salvato.scadenza) || scadenzaDefault,
        sotto,
        percentuale: sotto.length ? Math.round((nCompletati / sotto.length) * 100) : 0,
        completato: sotto.length > 0 && nCompletati === sotto.length,
      });
    }
  }
  return out;
}

function classificaScadenze(scadenze, oggiISO) {
  const scaduti = [], inScadenza = [], futuri = [], completati = [];
  for (const s of scadenze) {
    const chiuso = STATI_SCADENZA_CHIUSI.includes(s.stato);
    if (chiuso) { completati.push(s); continue; }
    const delta = giorniTra(oggiISO, s.data);
    if (delta < 0) scaduti.push(s);
    else if (delta <= 30) inScadenza.push(s);
    else futuri.push(s);
  }
  return { scaduti, inScadenza, futuri, completati };
}
function giorniTra(isoA, isoB) {
  const a = new Date(isoA + 'T00:00:00');
  const b = new Date(isoB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

/* Quando l'app viene aggiornata con nuovi tipi di scadenza nel catalogo predefinito (es. F24
   Paghe, Enasarco...), gli utenti che hanno già uno stato salvato in localStorage NON li
   vedrebbero: lo stato salvato sovrascrive per intero catalogoPeriodico/catalogoAnnuale, quindi
   un catalogo "vecchio" resterebbe bloccato senza le voci aggiunte dopo il salvataggio. Questa
   funzione aggiunge in coda solo i tipi di default mancanti (per id/chiave), senza toccare le
   personalizzazioni già fatte dall'utente (rinomina, disattivazione, tipi custom, occorrenze
   modificate) sui tipi che già esistono. Va chiamata ad ogni caricamento di uno stato salvato. */
function sincronizzaCatalogoConDefault(stato) {
  if (!Array.isArray(stato.catalogoPeriodico)) stato.catalogoPeriodico = [];
  const idPresenti = new Set(stato.catalogoPeriodico.map(t => t.id));
  DEFAULT_CATALOGO_PERIODICO.forEach(def => {
    if (!idPresenti.has(def.id)) stato.catalogoPeriodico.push(JSON.parse(JSON.stringify(def)));
  });
  if (!Array.isArray(stato.catalogoAnnuale)) stato.catalogoAnnuale = [];
  const chiaviPresenti = new Set(stato.catalogoAnnuale.map(t => t.chiave));
  DEFAULT_CATALOGO_ANNUALE.forEach(def => {
    if (!chiaviPresenti.has(def.chiave)) stato.catalogoAnnuale.push(JSON.parse(JSON.stringify(def)));
  });
  return stato;
}
